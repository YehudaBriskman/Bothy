# bothy-files policy for an INSTALLED box (`bothy install`, files module).
# Mounted by stack/modes.yml; POLICY_FILE points at it. The repo's own policy
# (apps/bothy-files/policy.toml) is for the dev box and names four roots that an
# installed machine does not have (a ~/stacks checkout, a notes repo, ~/projects,
# $HOME). This file is the roots POLICY for that machine:
#
#   ONE root, `notes`: a single folder the user owns, <install root>/stack/
#   bothy-files/notes (a symlink there points it at another folder).
#   READ-ONLY three times over: `writable = false` here, the `:ro` bind mount in
#   the generated compose, and the edge exposing no write route at all (this
#   install has no login, and an unauthenticated write path is a hole).
#   No git roots, no $HOME alias, no config forms (nothing is patchable).
#
# [deny] and [sensitive] below are copied VERBATIM from apps/bothy-files/policy.toml;
# a test (TestInstalledFilesPolicyTracksTheShippedOne) fails if they drift: the
# secret-shaped-name rules are not something to fork. The snapshot and audit
# directories are tmpfs in the generated compose (no write can happen, so nothing
# needs to persist); the loader still requires them to exist.

[roots.notes]
path = "/repos/notes"
writable = false

[deny]
# Directories never served, at any depth, in any root.
#
# `.git` is the security one - it holds the object store and a config that can
# carry a credential. The rest are volume: they are tens of thousands of files
# nobody browses, and including them makes the explorer useless and the listing
# slow. Both reasons matter; do not split the list by motive.
#
# `secrets` (2026-09-17) is the one entry that is NOT "the owner's own files":
# apps/bothy-ops/secrets (the operator cluster token) and apps/headlamp/secrets
# (the read-only kubeconfig) are SERVICE credentials, written mode 600 by
# gen-kube-token.sh / gen-headlamp-token.sh. The [sensitive] reasoning below -
# mark, don't hide - is about files a person keeps; a token minted for a
# container is not one, and serving it would hand `viewer` the operator's
# cluster verbs. Hidden at any depth, so a project's `secrets/` dir goes too.
components = [
  ".git", ".ssh", ".gnupg", "secrets", "node_modules", ".venv", "venv",
  "__pycache__", ".mypy_cache", ".pytest_cache", "dist", "build",
  ".next", ".turbo", ".cache", "target",
]

# ── sensitive ───────────────────────────────────────────────────────────────
#
# THESE FILES ARE SERVED. The list marks them; it no longer hides them.
#
# It used to be `[deny].file_patterns` - a refusal - and the reasoning was that a
# component-only list cannot see `.env` or `key.pem`, which is true and is why
# the patterns are still here. What changed on 2026-08-17 is what happens when
# one matches: the file is labelled, not withheld. This is one box, reached over
# a tailnet, owned by the person reading it, and a file explorer that hides the
# owner's own `.env` from them is not protecting anybody - it is teaching them
# that Bothy cannot be trusted with the interesting half of the box.
#
# ONE CONSEQUENCE THAT IS NOT "MY BOX, MY FILES", and it should be read before
# deciding this was obvious: ~/stacks/.env contains OAUTH2_COOKIE_SECRET. Anyone
# who can read it can mint a session cookie for any role, so on this deployment
# `viewer` is now worth the same as `operator`. That is fine while one person
# holds all four roles and it stops being fine the moment a second person holds
# only `viewer`. If that day comes, the answer is a role gate on this list -
# `operator` to read a marked file - not a return to hiding them.
#
# The second thing worth naming: ~ holds credentials to OTHER systems - SSH
# keys, a GitHub token, Claude's OAuth credentials. Tailscale protects the wire,
# not the blast radius, and those keys open machines that are not this one.
# `~` is a read-only root, so they cannot be changed through Bothy, only read.
#
# `realm-*.json` is here because auth/realm-devbox.json carries a live Keycloak
# client secret and nothing in its name suggests it. It is the case that proves a
# name list catches the files somebody thought of and nothing else - which is now
# an argument about the LABEL being incomplete rather than about the wall being
# incomplete, and a label that is sometimes missing is a much cheaper failure.
[sensitive]
file_patterns = [
  ".env", ".env.*", "*.env",
  "*.pem", "*.key", "*.p12", "*.pfx", "*.jks", "*.keystore",
  "id_rsa", "id_dsa", "id_ecdsa", "id_ed25519", "*.ppk",
  "*.kdbx", "*.gpg", "*.asc",
  ".netrc", ".pgpass", ".htpasswd", ".git-credentials",
  "credentials", "credentials.*", "*secret*", "*password*",
  "*.sqlite", "*.db",
  "realm-*.json", "*-realm.json", "realm.json",
  # A bcrypt hash IS a credential, just a slow one - $2a$11$ is crackable
  # offline at leisure, and the file exists to hold nothing else. Found by
  # checks/served_secrets.py on its first run, which is the argument for that
  # check: nothing in the name matches "secret", "password" or "credentials",
  # so every pattern above missed it. Named exactly, like realm-*.json, rather
  # than guessed at with `*users*` - which would hide ordinary user lists.
  "dozzle-users.yml",
]

# Patterns above that describe a WORD rather than a file format, and so must not
# apply to prose. Found by running the walk over the real tree: a documentation
# page called "Change Password.md" was being MARKED as a secret. It mattered more
# when the mark was a refusal; it still matters, because a label on every page
# that mentions a password is a label nobody reads.
#
# Only true documentation formats are exempt. `.txt` deliberately is NOT -
# `db_password.txt` is exactly the shape of a file someone leaves a credential
# in, while `.md` and `.rst` are formats you write ABOUT credentials in.
wordy_patterns = ["*secret*", "*password*"]
prose_suffixes = [".md", ".markdown", ".rst"]

# Explicit exceptions, by exact name: files that match a pattern above but carry
# no credential. A committed `.env.example` is a TEMPLATE full of placeholders -
# the file you read to learn what to set - so marking it would be crying wolf on
# the one .env-shaped file that is safe by construction.
allow_files = [
  ".env.example", ".env.sample", ".env.template", ".env.test.example",
  ".env.local.template", ".env.production.template", ".env.defaults",
]

[snapshots]
path = "/var/lib/bothy/trash"
keep = 20
max_age_days = 30

# [config] is required by the loader. Nothing is patchable here: one harmless
# field, and the edge routes no /config path.
[config]
roots = ["notes"]
suffixes = [".yml", ".yaml"]
deny_prefixes = []
deny_relpaths = []
max_length = 500

[config.fields]
"dev.portal.project" = { kind = "compose-label", max_length = 80 }

[config.snapshots]
path = "/var/lib/bothy/config-trash"
keep = 20
max_age_days = 30
