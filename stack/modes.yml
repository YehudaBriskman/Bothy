# What each Bothy install mode runs on the Compose runtime: THE ONE SOURCE the
# binary's embedded stack is generated from (docs/plans/thin-bothy/bothy-install.md).
#
# `go generate ./...` in cli/ reads this file plus the compose files it names and
# writes cli/internal/install/stack/<mode>/ (compose.yml, stack.json, files/). A
# test regenerates in memory and fails when the committed copy is stale. Adding a
# service to a mode is a change HERE (and in its compose file) - never in Go.
#
# The generator is deliberately strict. It refuses (loudly, at generate time) a
# selected service that bind-mounts anything not declared below, because the repo
# compose files are written for a checkout (`../..:/repos/stacks`, ${HOME}...) and
# an installed box has no checkout.
schema: 1
modes:
  mini:                      # "Bivvy"
    title: Bivvy
    project: bothy           # compose project name on the user's machine
    reserve_mib: 512         # free memory that must remain after the stack's limits
    modules:
      - name: edge
        compose: edge/compose.yml
        services: [traefik]
        # The repo's edge is written for the dev box: a docker provider with the
        # socket mounted, a sandbox origin on :8100, a Prometheus on devnet. An
        # installed box gets the FILE provider only (decision Q1): no socket in
        # the most exposed process. Each line must match something in
        # edge/compose.yml or generation fails (a stale override is an error).
        overrides:
          traefik:
            command_remove: ["--providers.docker", "--entrypoints.sandbox.address="]
            replace:          # metrics/ping stay on an entrypoint nothing else can reach
              - {from: "--entrypoints.metrics.address=:8899", to: "--entrypoints.metrics.address=127.0.0.1:8899"}
            volumes_remove: [/var/run/docker.sock]
            env_remove: [DOCKER_API_VERSION]   # only the docker provider reads it
            drop_keys: [extra_hosts]           # host.docker.internal: there are no host-side routes
      - name: web
        compose: apps/bothy-web/compose.yml
        services: [bothy-web]
      # The file explorer's backend, as the SECOND module: added with data only.
      # Roots policy for a machine with no ~/stacks and no notes repo: ONE root,
      # `notes`, a single folder under the install dir (<root>/stack/bothy-files/
      # notes), READ-ONLY (policy `writable = false`, a `:ro` mount, and no write
      # route at the edge, because this install has no login). Policy file:
      # stack/installed/bothy-files.policy.toml. Not exposed: /write, /delete,
      # /config/* (no auth to gate them) and /raw, /archive (they are served from
      # the :8100 sandbox origin, which an installed box does not publish).
      - name: files
        compose: apps/bothy-files/compose.yml
        services: [bothy-files]
        overrides:
          bothy-files:
            # the dev box's four roots, audit dir and two undo nets, by container path
            volumes_remove: [/repos/stacks, /repos/notes, /repos/projects, /repos/home, /audit, /var/lib/bothy/trash, /var/lib/bothy/config-trash]
            volumes_add:
              - ./notes:/repos/notes:ro
              - ./policy:/etc/bothy-files:ro
            tmpfs_add: [/audit, /var/lib/bothy/trash, /var/lib/bothy/config-trash]   # nothing can write; the loader wants them
            # the Dockerfile's CMD with POLICY_FILE pointed at the installed policy
            command_add: [sh, -c, "POLICY_FILE=/etc/bothy-files/policy.toml exec python3 -u app.py"]
            # The repo declares this service's routes in edge/dynamic/bothy-files.yml
            # behind SSO middlewares an installed box does not have; here only the
            # READ routes exist, each exact Path(), no Host().
            labels_set:
              - traefik.enable=true
              - traefik.http.services.bothy-files.loadbalancer.server.port=8099
              - "traefik.http.routers.bothy-files-read.rule=Path(`/-/api/files/roots`) || Path(`/-/api/files/tree`) || Path(`/-/api/files/read`) || Path(`/-/api/files/find`) || Path(`/-/api/files/docs`) || Path(`/-/api/files/dirsize`) || Path(`/-/api/files/search`) || Path(`/-/api/files/links`) || Path(`/-/api/files/history`) || Path(`/-/api/files/repos`) || Path(`/-/api/files/status`) || Path(`/-/api/files/git/diff`)"
              - traefik.http.routers.bothy-files-read.priority=100
              - traefik.http.routers.bothy-files-read.entrypoints=web
              - traefik.http.routers.bothy-files-read.service=bothy-files
              - traefik.http.routers.bothy-files-read.middlewares=bothy-files-strip,files-deidentify
              - traefik.http.middlewares.bothy-files-strip.stripPrefix.prefixes=/-/api/files
              - traefik.http.middlewares.files-deidentify.headers.customRequestHeaders.X-Auth-Request-User=
              - traefik.http.middlewares.files-deidentify.headers.customRequestHeaders.X-Auth-Request-Email=
              - traefik.http.middlewares.files-deidentify.headers.customRequestHeaders.X-Auth-Request-Groups=
              - traefik.http.middlewares.files-deidentify.headers.customRequestHeaders.X-Auth-Request-Preferred-Username=
              - traefik.http.middlewares.files-deidentify.headers.customRequestHeaders.X-Forwarded-User=
              - traefik.http.middlewares.files-deidentify.headers.customRequestHeaders.X-Forwarded-Email=
    # Host ports the installed stack publishes. Anything else a service publishes
    # in the repo (the sandbox entrypoint, say) is dropped. `env` is written to the
    # stack's .env by the installer (--port); the bind address comes from --bind.
    publish:
      - {service: traefik, container: 80, env: BOTHY_HTTP_PORT, default: 80}
    # The edge: Traefik with the file provider only. `go generate` renders the
    # traefik.* labels of every selected service into <dir>/<file>, drops the
    # labels from the compose, and lints the result (no Host(), exact Path()
    # routers plus the priority-1 catch-all, API on / dashboard off, nothing
    # listening on an unpublished port except 127.0.0.1).
    edge: {service: traefik, dir: traefik/dynamic, file: routes.yml}
    # Bind sources that may stay as written. Everything else must be a relative
    # path inside the service's own directory under the install root. The Docker
    # socket is never allowed (a lint refuses it anywhere in the generated stack).
    allow_binds: []
    # Files copied from the repo into <install root>/stack/<to> (none for mini yet).
    files:
      - {from: stack/installed/bothy-files.policy.toml, to: bothy-files/policy/policy.toml}
    # Bytes check after `up`: the installer fetches `path` through the edge and
    # compares it with `file` read from inside `service`; version_path must report
    # the release commit under `version_key`.
    verify:
      version_path: /version.json
      version_key: revision
      bytes:
        - {path: /, service: bothy-web, file: /usr/share/nginx/html/index.html}
