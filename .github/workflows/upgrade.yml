# Does an upgrade keep your data?
#
# The install job proves a FRESH box comes up. Nobody installs Bothy twice; they
# install it once and then pull. So the interesting question is not "does it
# start" but "does it start on top of the box you already had, without eating
# what was in it" - and nothing has ever asked that.
#
# The failure this exists for is the worst kind a self-hosted tool has: silent
# and unrecoverable. A volume renamed in a compose file, a `down -v` that crept
# into a recipe, a service whose data directory moved - each one comes up green,
# healthy, and empty. `just verify` passes. The dashboards are gone.
#
# ── what it asserts, and why each one ───────────────────────────────────────
#
#   1. A ROW WRITTEN BEFORE THE UPGRADE IS READABLE AFTER IT. The end-to-end
#      claim, in the one place where loss is unrecoverable. Everything else here
#      is a more specific version of this.
#
#   2. THE VOLUMES WERE NOT RECREATED. Stronger than (1) and it catches the near
#      miss: a volume recreated between the two `up`s would have lost the data
#      even if this particular row happened to be rewritten by something. Volume
#      IDs are compared, not names - a recreated volume keeps its name.
#
#   3. A SECOND `just up` RECREATES NOTHING. Idempotence at the stack level
#      rather than at bootstrap's. Measured on the real box before this was
#      written: 31 compose-managed containers, identical name-to-id set across a
#      second run. So it is a property that holds today, and a red here is a
#      regression rather than an aspiration. It is what makes `just up` safe to
#      run when you are not sure whether you already did.
#
#   4. THE BACKUP COVERS EVERY LIVE DATABASE. doctor.sh reports this and cannot
#      gate on it - it exits 0 no matter what it finds. A dump missing a database
#      looks exactly like a dump that has it until the day you restore.
#
#   5. THE NEW CODE IS WHAT RUNS. bothy-web, bothy-files and bothy-ops must be
#      images built from HEAD (their org.opencontainers.image.revision label),
#      and bothy-web must serve HEAD's /version.json and HEAD's bundle. Added
#      2026-09-18, when it turned out no upgrade had ever rebuilt them: (1)-(4)
#      all compare data, so a box running last month's app code passed them.
#      Together with (3) it also pins the build as a no-op when nothing changed:
#      a rebuild that is not cache-stable would recreate containers there.
#   6. THE BACKUPS CAN BE PUT BACK. Back up, then damage the box (drop a table,
#      delete grafana.db, wipe VictoriaMetrics and Loki), run every `just
#      restore-*` recipe, and find a row, an API-made dashboard, metrics and log
#      lines from before the backup. A backup nobody has restored is a hope.
#
# ── why nightly ────────────────────────────────────────────────────────────
#
# It is two full installs back to back, ~15-20 minutes. The property changes when
# somebody edits a volume declaration, which is rare and always deliberate.
name: Upgrade

on:
  schedule:
    # An hour after Elsewhere, so two 20-minute matrix jobs are not competing for
    # runners and a failure in one does not look like a symptom of the other.
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upgrade-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upgrade:
    name: Install the previous commit, then upgrade onto it
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DIR: /tmp/bothy

    steps:
      - uses: actions/checkout@v7
        with:
          path: workspace
          # The whole history, because this job checks out a PARENT commit. The
          # default fetch-depth of 1 gives a repo with no parent to go back to,
          # and the failure is `fatal: bad revision`, four steps in.
          fetch-depth: 0

      - name: Free disk (the stack pulls ~6 GB of images)
        run: |
          set -uo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/share/boost /usr/share/swift || true
          df -h / | tail -1

      - uses: extractions/setup-just@v4

      - name: Clone, and go back one commit
        run: |
          set -euo pipefail
          git clone --no-hardlinks "$GITHUB_WORKSPACE/workspace" "$DIR"
          cd "$DIR"
          # The FIRST PARENT, so a merge commit steps back to the previous state
          # of main rather than sideways into the branch that was merged. On a
          # merge, HEAD^2 is the feature branch - which never had the rest of
          # main in it, and would make this an unrelated install rather than an
          # upgrade.
          base=$(git rev-parse HEAD^1)
          echo "BASE_SHA=$base" >> "$GITHUB_ENV"
          echo "HEAD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git checkout -q "$base"
          echo "installing at:"; git log --oneline -1

      - name: The address a container can also reach
        run: |
          set -euo pipefail
          GW=$(docker network inspect bridge -f '{{(index .IPAM.Config 0).Gateway}}')
          [ -n "$GW" ] || { echo "no bridge gateway"; exit 1; }
          echo "BOTHY_BASE_HOST=$GW" >> "$GITHUB_ENV"

      - name: Install the OLD version
        working-directory: ${{ env.DIR }}
        run: |
          set -euo pipefail
          cp .env.example .env
          just up

      # ── plant something that must survive ──────────────────────────────────
      - name: Write a row, and record the volumes
        working-directory: ${{ env.DIR }}
        run: |
          set -euo pipefail
          set -a; . ./.env; set +a
          docker exec postgres psql -U "${POSTGRES_USER:-dev}" -d "${POSTGRES_DB:-dev}" \
            -v ON_ERROR_STOP=1 -c \
            "CREATE TABLE upgrade_probe (id int primary key, note text);
             INSERT INTO upgrade_probe VALUES (1, 'written before the upgrade');"
          echo "  planted."
          # IDs, not names: a recreated volume keeps its name, which is exactly
          # how this failure hides.
          docker volume ls -q | sort | while read -r v; do
            printf '%s %s\n' "$v" "$(docker volume inspect "$v" -f '{{.CreatedAt}}')"
          done > /tmp/volumes-before.txt
          wc -l < /tmp/volumes-before.txt | xargs echo "  volumes recorded:"

      # ── the upgrade ────────────────────────────────────────────────────────
      - name: Upgrade to HEAD
        working-directory: ${{ env.DIR }}
        run: |
          set -euo pipefail
          git checkout -q "$HEAD_SHA"
          echo "upgrading to:"; git log --oneline -1
          # Exactly what a person does: pull, then up. No down, no prune, no -v.
          just up

      # ── the upgrade applied the new CODE, not only the new compose files ───
      #
      # Until 2026-09-18 it did not: bothy-web, bothy-files and bothy-ops are
      # `build:` images, `up` never rebuilds an image that exists, and nothing
      # passed --build - so every upgrade kept the old app code running, green,
      # healthy and silent. Every assertion below this block compares DATA, so
      # this job passed throughout. These two compare CODE.
      - name: The running images were built from HEAD
        run: |
          set -uo pipefail
          # The IMAGE's label, not the container's config: that is what was
          # actually built. `just up-apps` sets it from `git rev-parse HEAD`.
          rc=0
          for c in bothy-web bothy-files bothy-ops; do
            img=$(docker inspect -f '{{.Image}}' "$c") || { echo "FAIL  no container $c"; rc=1; continue; }
            rev=$(docker image inspect -f '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$img")
            if [ "$rev" = "$HEAD_SHA" ]; then
              echo "  $c: built from $rev"
            else
              echo "FAIL  $c runs an image built from '${rev:-<no label>}', not HEAD $HEAD_SHA"
              rc=1
            fi
          done
          exit $rc

      - name: bothy-web serves HEAD's bundle
        working-directory: ${{ env.DIR }}
        run: |
          set -euo pipefail
          # 1. /version.json, through the edge exactly as a browser gets it.
          #    Bytes, not a status: the catch-all answers 200 for anything
          #    (rule 7), and nginx serves this file with an exact location so a
          #    missing one is a 404 rather than index.html.
          got=$(curl -fsS -m 5 http://127.0.0.1/version.json)
          echo "  /version.json: $got"
          [ "$got" = "{\"revision\":\"$HEAD_SHA\"}" ] \
            || { echo "FAIL  /version.json does not name HEAD $HEAD_SHA"; exit 1; }
          # 2. The BUNDLE. The label says which commit the image was built from;
          #    this says the page actually served is what HEAD's source builds
          #    to. The reference is built from HEAD's web/ in the Dockerfile's
          #    own pinned node stage (not the runner's node), and compared to the
          #    served index.html byte for byte - it names every content-hashed
          #    asset, so a stale bundle cannot match.
          docker build -q --target build -t bothy-web-ref apps/bothy-web >/dev/null
          docker run --rm bothy-web-ref cat /app/dist/index.html > /tmp/index-ref.html
          curl -fsS -m 5 http://127.0.0.1/ > /tmp/index-served.html
          ref_js=$(grep -o 'assets/index-[^"]*\.js' /tmp/index-ref.html | head -1 || true)
          got_js=$(grep -o 'assets/index-[^"]*\.js' /tmp/index-served.html | head -1 || true)
          echo "  HEAD builds: ${ref_js:-<none>}"
          echo "  served:      ${got_js:-<none>}"
          [ -n "$ref_js" ] || { echo "FAIL  the reference build has no index-*.js"; exit 1; }
          if ! cmp -s /tmp/index-ref.html /tmp/index-served.html; then
            echo "FAIL  the served index.html is not HEAD's build"
            diff /tmp/index-ref.html /tmp/index-served.html | head -20 || true
            exit 1
          fi
          # And the asset it names is really there - not the catch-all's
          # index.html wearing a .js name.
          ctype=$(curl -fsS -m 5 -o /dev/null -w '%{content_type}' "http://127.0.0.1/$got_js") \
            || { echo "FAIL  /$got_js is not served"; exit 1; }
          case "$ctype" in
            *javascript*) ;;
            *) echo "FAIL  /$got_js is served as '$ctype', not a script"; exit 1 ;;
          esac
          echo "  served index.html is byte-identical to HEAD's build"

      - name: The row is still there
        working-directory: ${{ env.DIR }}
        run: |
          set -euo pipefail
          set -a; . ./.env; set +a
          got=$(docker exec postgres psql -U "${POSTGRES_USER:-dev}" -d "${POSTGRES_DB:-dev}" \
                  -tAc "SELECT note FROM upgrade_probe WHERE id = 1")
          echo "  read back: '$got'"
          [ "$got" = "written before the upgrade" ] \
            || { echo "FAIL  the upgrade lost data written before it"; exit 1; }

      - name: No volume was recreated
        run: |
          set -uo pipefail
          docker volume ls -q | sort | while read -r v; do
            printf '%s %s\n' "$v" "$(docker volume inspect "$v" -f '{{.CreatedAt}}')"
          done > /tmp/volumes-after.txt
          # Only volumes that existed BEFORE are compared. The upgrade is allowed
          # to ADD one - a new service is not a regression - but an existing
          # volume changing its creation time means it was destroyed and remade.
          rc=0
          while read -r name created; do
            now=$(grep -m1 "^$name " /tmp/volumes-after.txt | cut -d' ' -f2-)
            if [ -z "$now" ]; then
              echo "FAIL  volume vanished: $name"; rc=1
            elif [ "$now" != "$created" ]; then
              echo "FAIL  volume RECREATED: $name ($created -> $now)"; rc=1
            fi
          done < /tmp/volumes-before.txt
          [ $rc -eq 0 ] && echo "  every pre-existing volume survived, same creation time"
          exit $rc

      # ── idempotence at the stack level ─────────────────────────────────────
      - name: Running `just up` again recreates nothing
        working-directory: ${{ env.DIR }}
        run: |
          set -euo pipefail
          snap() { docker ps -a --filter label=com.docker.compose.project \
                     --format '{{.Names}} {{.ID}}' | sort; }
          snap > /tmp/containers-before.txt
          just up >/dev/null
          snap > /tmp/containers-after.txt
          if diff /tmp/containers-before.txt /tmp/containers-after.txt; then
            echo "  identical name->id set across a second \`just up\` ($(wc -l < /tmp/containers-before.txt) containers)"
          else
            echo "FAIL  a second \`just up\` recreated containers - see the diff above"
            exit 1
          fi

      # ── the backup nobody can gate on ──────────────────────────────────────
      - name: The dump covers every live database
        working-directory: ${{ env.DIR }}
        run: |
          set -euo pipefail
          set -a; . ./.env; set +a
          # NOT GATED ON `just backup`'s EXIT CODE, deliberately. It reports a
          # FAILURE when portainer is not running, and `just up` does not start
          # portainer - it lives in mgmt/, which _up-all does not include. So on
          # any fresh box, and therefore on every run of this job, backup exits 1
          # for a service the install never started. Gating on that would make
          # this red every night for a reason nobody can act on, which is the
          # cry-wolf this repo keeps paying for - backup.sh's own header
          # describes the identical bug with redis.
          #
          # What this step is actually about is COVERAGE: does the dump contain
          # every database that exists? That is asserted below, on the artifact,
          # and it is unaffected by whether some other service was up.
          # (The portainer step is gone since 2026-08-18, and the restore steps
          # further down DO gate on `just backup` - this one stays about coverage.)
          just backup || echo "  (backup reported a failure; coverage is asserted below)"
          latest=$(ls -1t "${HOME}"/backups/postgres/pg-*.sql.gz 2>/dev/null | head -1)
          [ -n "$latest" ] || { echo "FAIL  backup produced no postgres dump"; exit 1; }
          live=$(docker exec postgres psql -U "${POSTGRES_USER:-dev}" -tAc \
                   "SELECT datname FROM pg_database WHERE NOT datistemplate")
          dumped=$(zcat "$latest" | sed -n 's/^CREATE DATABASE \([a-zA-Z0-9_]*\).*/\1/p')
          rc=0
          for db in $live; do
            # `postgres` itself is never CREATE DATABASE'd in a dumpall - it is
            # the maintenance database and always exists, so a coverage check
            # that looks for it in the dump reports a missing database on every
            # healthy backup there has ever been.
            #
            # scripts/doctor.sh runs the same comparison and excludes it in SQL
            # instead (`AND datname <> 'postgres'` in its own query). This
            # comment used to claim it did not, which was wrong when written or
            # went stale shortly after; the exclusion is in both, in two
            # different places, and moving one without the other is how that
            # divergence comes back.
            [ "$db" = "postgres" ] && continue
            case " $(echo "$dumped" | tr '\n' ' ') " in
              *" $db "*) ;;
              *) echo "FAIL  the dump is missing database: $db"; rc=1 ;;
            esac
          done
          [ $rc -eq 0 ] && echo "  dump covers: $(echo "$live" | tr '\n' ' ')"
          exit $rc

      # ── back up, damage, restore ───────────────────────────────────────────
      # The step above proves the dump CONTAINS every database. This proves the
      # backups can be PUT BACK: each restore recipe is run for real against a
      # box that has just lost the thing it restores, and what comes back is
      # checked on the data - a row, a dashboard, metrics and log lines from
      # before the backup - never on a recipe's exit code alone.
      #
      # A dashboard made through the API, not a provisioned one: provisioned
      # dashboards are re-created from monitoring/dashboards/ on every start,
      # so they would "come back" even from an empty grafana.db.
      - name: Plant what a restore must bring back, then back up
        working-directory: ${{ env.DIR }}
        run: |
          set -euo pipefail
          set -a; . ./.env; set +a
          docker exec postgres psql -U "${POSTGRES_USER:-dev}" -d "${POSTGRES_DB:-dev}" \
            -v ON_ERROR_STOP=1 -c \
            "CREATE TABLE restore_probe (id int primary key, note text);
             INSERT INTO restore_probe VALUES (1, 'written before the backup');"
          # Credentials on stdin (--config -), never in argv - see doctor.sh.
          printf 'user = "%s:%s"\n' "${GRAFANA_USER:-admin}" "${GRAFANA_PASSWORD:-admin}" \
            | curl -fsS --config - -H 'Content-Type: application/json' \
                -d '{"dashboard":{"uid":"restore-probe","title":"restore probe","panels":[]},"overwrite":true}' \
                http://localhost:3000/api/dashboards/db
          echo
          # A moment that both time-series stores hold data for, and that the
          # wipe below takes away: an instant two minutes before the backup.
          echo "PROBE_T=$(( $(date +%s) - 120 ))" >> "$GITHUB_ENV"
          # Gated this time: every step of backup.sh has something to back up
          # on this box, so any failure is a real one.
          just backup

      - name: Damage it - drop the table, delete grafana.db, wipe VictoriaMetrics and Loki
        working-directory: ${{ env.DIR }}
        run: |
          set -euo pipefail
          set -a; . ./.env; set +a
          docker exec postgres psql -U "${POSTGRES_USER:-dev}" -d "${POSTGRES_DB:-dev}" \
            -v ON_ERROR_STOP=1 -c "DROP TABLE restore_probe;"
          docker exec grafana rm -f /var/lib/grafana/grafana.db
          for c in victoriametrics loki; do
            docker stop "$c" >/dev/null
            d=$(docker inspect -f '{{range .Mounts}}{{if eq .Type "volume"}}{{.Destination}}{{end}}{{end}}' "$c")
            docker run --rm --volumes-from "$c" python:3.13-alpine sh -c "rm -rf $d/*"
            docker start "$c" >/dev/null
          done
          echo "  damaged"

      - name: Restore each with its recipe
        working-directory: ${{ env.DIR }}
        run: |
          set -euo pipefail
          # The glob is $2 unquoted on purpose; names are backup.sh's own.
          # shellcheck disable=SC2012,SC2086
          newest() { ls -1t "$HOME/backups/$1"/$2 | head -1; }
          just restore-postgres        "$(newest postgres 'pg-*.sql.gz')"      --yes
          just restore-grafana         "$(newest grafana 'grafana-*.db')"      --yes
          just restore-victoriametrics "$(newest victoriametrics 'vm-*.tar')"  --yes
          just restore-loki            "$(newest loki 'loki-*.tar.gz')"        --yes
          # env: into the real path, the way a person would - then it must be
          # byte-identical to what the backup took.
          just restore-env             "$(newest env 'env-2*[0-9]')"           --yes
          cmp .env "$(newest env 'env-2*[0-9]')"

      - name: Everything planted before the backup is back
        working-directory: ${{ env.DIR }}
        run: |
          set -euo pipefail
          set -a; . ./.env; set +a
          rc=0
          check() {  # <ok?> <pass message> <fail message>
            if [ "$1" = yes ]; then echo "  $2"; else echo "FAIL  $3"; rc=1; fi
          }
          got=$(docker exec postgres psql -U "${POSTGRES_USER:-dev}" -d "${POSTGRES_DB:-dev}" \
                  -tAc "SELECT note FROM restore_probe WHERE id = 1" || true)
          check "$([ "$got" = "written before the backup" ] && echo yes)" \
            "postgres: the row is back" "postgres row: '$got'"
          title=$(printf 'user = "%s:%s"\n' "${GRAFANA_USER:-admin}" "${GRAFANA_PASSWORD:-admin}" \
                  | curl -fsS --config - http://localhost:3000/api/dashboards/uid/restore-probe \
                  | jq -r '.dashboard.title' || true)
          check "$([ "$title" = "restore probe" ] && echo yes)" \
            "grafana: the API-made dashboard is back" "grafana dashboard: '$title'"
          n=$(printf 'user = "%s:%s"\n' "$DEV_LOGIN_USER" "$DEV_LOGIN_PASSWORD" \
              | curl -fsS --config - "http://localhost:8428/api/v1/query?query=count(up)&time=$PROBE_T" \
              | jq -r '.data.result[0].value[1] // "0"' || echo 0)
          check "$([ "${n:-0}" -gt 0 ] && echo yes)" \
            "victoriametrics: $n series of up at the probe time" "victoriametrics has nothing at the probe time"
          lines=$(curl -fsS -G http://localhost:3100/loki/api/v1/query_range \
                    --data-urlencode 'query={container=~".+"}' \
                    --data-urlencode "start=$(( PROBE_T - 600 ))000000000" \
                    --data-urlencode "end=${PROBE_T}000000000" --data-urlencode limit=50 \
                  | jq '[.data.result[].values[]] | length' || echo 0)
          check "$([ "${lines:-0}" -gt 0 ] && echo yes)" \
            "loki: $lines log lines from before the backup" "loki has no lines before the probe time"
          exit $rc

      - name: Collect logs
        if: failure()
        working-directory: ${{ env.DIR }}
        run: |
          set +e
          mkdir -p /tmp/logs
          for f in edge/compose.yml auth/compose.yml monitoring/compose.yml \
                   data/postgres/compose.yml apps/bothy/compose.yml; do
            docker compose -f "$f" logs --no-color --tail 300 \
              > "/tmp/logs/$(echo "$f" | tr / _).log" 2>&1
          done
          docker ps -a > /tmp/logs/ps.txt
          docker volume ls > /tmp/logs/volumes.txt

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: upgrade-failure-logs
          path: /tmp/logs
          retention-days: 7
