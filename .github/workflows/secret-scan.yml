name: Secret scan

# This repository is public and has had its history rewritten once already to
# remove a personal identifier. gitleaks is the guard that stops that recurring:
# it runs on every push and pull request, and weekly against the full history.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays, 04:17 UTC - off the hour so it does not queue behind everyone else.
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Same rule as ci.yml: a PR's stale run is cancelled, a push or the weekly
  # full-history scan never is. Keyed by SHA outside PRs so a pending scan of
  # a merged commit is not dropped by the next merge.
  group: secret-scan-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    # A full-history scan of this repo takes well under a minute. The runner
    # default is 360; a stall should fail in minutes, not hold a slot for six
    # hours while a Dependabot burst queues behind it.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history - a secret removed in a later commit is still a leak.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Findings fail the job. Do not soften this.
          GITLEAKS_ENABLE_SUMMARY: true
          # Both need write scopes we deliberately do not grant.
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
