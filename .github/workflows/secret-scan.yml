name: Secret scan

# This repository is public and has had its history rewritten once already to
# remove a personal identifier. gitleaks is the guard that stops that recurring:
# it runs on every push and pull request, and weekly against the full history.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays, 04:17 UTC — off the hour so it does not queue behind everyone else.
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history — a secret removed in a later commit is still a leak.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Findings fail the job. Do not soften this.
          GITLEAKS_ENABLE_SUMMARY: true
          # Both need write scopes we deliberately do not grant.
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
