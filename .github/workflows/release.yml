name: Release

# Tags v$VERSION when a commit on main carries a VERSION that has no tag yet AND
# that exact commit passed CI, Install and Upgrade, then publishes a GitHub
# Release with notes generated from the merged PRs.
#
# Why workflow_run and not `on: push`: the updater (docs/plans/updates.md) only
# offers releases whose CI passed, so the tag must never exist before the
# evidence does.
#
# ── what changed on 2026-11-02, and why ─────────────────────────────────────
#
# This used to trigger on CI alone. Install - the only workflow that actually
# runs README.md and every suite against a live stack - ran on the same push
# and was never consulted, and Upgrade ran only at night. So a commit could be
# tagged and offered to every box while its install was red. Now:
#
#   · each of the three workflows' completion on main triggers this;
#   · the run asks the API for the newest push run of ALL THREE on the same
#     head SHA and hands the answer to scripts/release-decision.sh, which says
#     release / wait / block (table-tested in scripts/checks/release-decision.sh,
#     and mutants.sh proves that table bites);
#   · `wait` is a green no-op - the last of the three to finish will decide;
#   · `block` with a new VERSION is RED, so a failed or cancelled prerequisite
#     on a release commit is visible here and not only in its own workflow.
#
# Re-running a failed prerequisite re-triggers this on completion, which is
# also the recovery path: no manual tag, no dispatch input to validate.
#
# The installer pin (scripts/bothy.sh BOTHY_PIN_SHA) CANNOT ride along - it pins
# the tagged commit's sha, which only exists after this runs. It follows as its
# own PR; until then scripts/checks/installer-pin.sh reports the pending release.
# The default token here cannot open PRs (repo setting), so that PR is manual.
# That PR also sets BOTHY_PIN_CHECKSUMS_SHA256 - the value `bothy.sh --binary`
# verifies against. It is the hash of the FINAL checksums.txt, the one the
# `release-manifest` job (last in the run) leaves on the release after adding the
# manifest's line; that job prints it. The `cli` job's own checksums.txt is an
# intermediate and its hash must NOT be pinned.
#
# The `cli` job (2026-11, D22/D27) runs only after `tag` has tagged and published,
# so it sits behind the same all-green gate and cannot change the decision above.
# It builds the CLI archives with scripts/build-cli.sh, attaches them and
# checksums.txt to the release, and attests them. It is the ONLY job holding
# id-token/attestations: the tagging job keeps contents:write and nothing else.
# If it fails, the release exists without assets: "Re-run failed jobs" repeats
# only `cli` (uploads are --clobber, so that is safe). Re-running `cli` after
# `release-manifest` has run puts the line-less checksums.txt back, so re-run
# `release-manifest` after it (it is idempotent) - see that job.

on:
  workflow_run:
    workflows: [CI, Install, Upgrade]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  # Per COMMIT. Three completions per SHA arrive here; GitHub keeps one running
  # and one pending per group and drops the rest, which is harmless within a
  # SHA (every run re-reads all three) but would silently drop a different
  # commit's last chance if the group were shared.
  group: release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  tag:
    name: Tag v$VERSION once CI, install and upgrade are green
    # A triggering run that did not succeed cannot make anything releasable;
    # the run triggered by whichever prerequisite finishes last reports it.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      # Reading the other workflows' runs for this SHA.
      actions: read
    outputs:
      # true only when THIS run created the tag and the release; the `cli` job
      # keys on it. A run that lost the tag race, or found the tag, leaves it unset.
      published: ${{ steps.publish.outputs.published }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Decide whether this commit is a release
        id: decide
        shell: bash
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          v=$(tr -d '[:space:]' < VERSION)
          bash scripts/checks/version.sh
          if git rev-parse --quiet --verify "refs/tags/v$v" >/dev/null; then
            echo "v$v already tagged - nothing to release"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$v is new - $SHA is a release candidate"
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "version=$v" >> "$GITHUB_OUTPUT"
          fi

      - name: CI, Install and Upgrade on this exact commit
        id: evidence
        if: steps.decide.outputs.release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          V: ${{ steps.decide.outputs.version }}
        run: |
          set -euo pipefail
          : > /tmp/evidence.txt
          for wf in ci.yml install.yml upgrade.yml; do
            # The NEWEST push run on main for this SHA. A re-run keeps its run id
            # and reports its latest attempt, so a re-run in progress reads as
            # in_progress rather than as the earlier failure.
            line=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?head_sha=$SHA&event=push&branch=main&per_page=100" \
                     --jq '.workflow_runs | sort_by(.created_at) | last
                           | if . == null then "missing - -"
                             else "\(.status) \(.conclusion // "-") \(.html_url)" end')
            read -r status conclusion url <<< "$line"
            echo "$wf $status $conclusion" >> /tmp/evidence.txt
            printf '  %-12s %-12s %-10s %s\n' "$wf" "$status" "$conclusion" "$url"
          done
          # exit 2 from the rule is an input error: treated as a block.
          verdict=$(bash scripts/release-decision.sh < /tmp/evidence.txt) \
            || verdict="block: the evidence could not be judged (exit $?)"
          echo "verdict: $verdict"
          echo "verdict=${verdict%%:*}" >> "$GITHUB_OUTPUT"
          case "$verdict" in
            release) ;;
            wait*)
              echo "::notice::v$V waits for${verdict#wait:} - the last one to finish releases it." ;;
            *)
              echo "::error::Not releasing v$V at $SHA:${verdict#block:}. Fix it or re-run the failed workflow; its completion re-runs this."
              exit 1 ;;
          esac

      - name: Tag and publish the release
        id: publish
        if: steps.decide.outputs.release == 'true' && steps.evidence.outputs.verdict == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.decide.outputs.version }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$V" -m "Bothy v$V" "$SHA"
          # Two commits carrying the same new VERSION can both reach here (each
          # has its own concurrency group). The push is the arbiter: the loser
          # is rejected, and says which commit owns the tag rather than failing
          # with git's bare "already exists".
          if ! git push origin "v$V"; then
            git fetch -q origin "refs/tags/v$V:refs/tags/v$V-remote" || true
            owner=$(git rev-parse -q --verify "refs/tags/v$V-remote^{commit}" || echo unknown)
            if [ "$owner" = "$SHA" ]; then
              echo "v$V was already pushed for $SHA by a parallel run - nothing to do"
              exit 0
            fi
            echo "::error::v$V already exists at $owner, not $SHA. Two commits carried VERSION $V; bump VERSION."
            exit 1
          fi
          gh release create "v$V" --verify-tag --generate-notes --title "Bothy v$V"
          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "::notice::Released v$V at $SHA. Next: a PR moving scripts/bothy.sh BOTHY_PIN_VERSION/BOTHY_PIN_SHA to v$V / $SHA, and BOTHY_PIN_CHECKSUMS_SHA256 to the hash the release-manifest job prints in its summary (the FINAL checksums.txt, not the cli job's)."

  cli:
    name: Build, attach and attest the CLI archives
    needs: tag
    if: needs.tag.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Upload the assets to the release.
      contents: write
      # The build-provenance attestation: an OIDC token, and the right to store it.
      id-token: write
      attestations: write
    steps:
      # The tagged revision, not the branch tip: main may have moved on.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Build every target
        run: bash scripts/build-cli.sh --out "$RUNNER_TEMP/dist"

      # The archives are only worth attesting if they are the right ones: this one
      # runs on the runner and must say the released version and sha.
      - name: The linux/amd64 binary runs and reports this release
        env:
          V: ${{ needs.tag.outputs.version }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/smoke"
          tar -xzf "$RUNNER_TEMP/dist/bothy_${V}_linux_amd64.tar.gz" -C "$RUNNER_TEMP/smoke"
          out=$("$RUNNER_TEMP/smoke/bothy" version)
          echo "$out"
          case "$out" in *"bothy $V (commit ${SHA:0:12},"*) ;; *) echo "::error::wrong version or sha in the built binary"; exit 1 ;; esac
          (cd "$RUNNER_TEMP/dist" && sha256sum -c checksums.txt)

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            ${{ runner.temp }}/dist/bothy_*
            ${{ runner.temp }}/dist/checksums.txt

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.tag.outputs.version }}
        run: |
          set -euo pipefail
          gh release upload "v$V" "$RUNNER_TEMP"/dist/bothy_* "$RUNNER_TEMP/dist/checksums.txt" --clobber
          # No hash for BOTHY_PIN_CHECKSUMS_SHA256 here on purpose: this
          # checksums.txt has no release-manifest.json line yet; the
          # release-manifest job changes it and prints the pinnable hash.

      - name: The attestation verifies
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.tag.outputs.version }}
        run: |
          set -euo pipefail
          gh attestation verify "$RUNNER_TEMP/dist/checksums.txt" -R "$GITHUB_REPOSITORY"
          gh attestation verify "$RUNNER_TEMP/dist/bothy_${V}_linux_amd64.tar.gz" -R "$GITHUB_REPOSITORY"

  # ── D34: Bothy's own images, published by digest ───────────────────────────
  #
  # Runs only after the tag job published a release, from the TAGGED sha, with
  # the same Dockerfiles and contexts as ci.yml's "Every image builds" job.
  # scripts/checks/release-manifest.sh fails CI when this matrix and the repo's
  # Dockerfiles / compose `build:` services disagree, so a new module cannot be
  # left out of a release.
  #
  # packages:write lives on THIS job only. The release-manifest job below, which
  # edits the release, cannot write packages.
  #
  # ARM64 via QEMU, not native runners (decision, 2026-11-17). Native arm64
  # runners (ubuntu-24.04-arm, free on a public repo) are faster but need a
  # build per arch, push-by-digest, and a merge step to assemble the index: more
  # moving parts and more places to be wrong in a pipeline that cannot be
  # exercised before a real release. QEMU gives one build per image that yields
  # the multi-arch index directly, and every digest we attest is that index.
  # Cost: slow (bothy-web runs `npm ci` + vite under emulation). If a release
  # build ever exceeds its timeout, the fix is `FROM --platform=$BUILDPLATFORM`
  # on bothy-web's node stage (its output is architecture-independent), or
  # moving to native runners; not before.
  #
  # Recovery: re-run the FAILED JOBS of the run that tagged (outputs are kept).
  # Re-running the whole workflow later finds the tag and publishes nothing.
  images:
    name: Publish ${{ matrix.image }} to GHCR
    needs: tag
    if: needs.tag.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write       # the attestation's OIDC identity
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # bothy-web builds from its own directory.
          - image: bothy-web
            dockerfile: apps/bothy-web/Dockerfile
            context: apps/bothy-web
            build_contexts: ''
          # bothy-files and bothy-ops build from apps/ (allowlisted by
          # apps/.dockerignore) so they can COPY apps/bothy-common in.
          - image: bothy-files
            dockerfile: apps/bothy-files/Dockerfile
            context: apps
            build_contexts: ''
          # compose.yml's `additional_contexts: jobtemplates`.
          - image: bothy-ops
            dockerfile: apps/bothy-ops/Dockerfile
            context: apps
            build_contexts: jobtemplates=k8s/job-templates
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Name the image
        id: name
        shell: bash
        env:
          IMAGE: ${{ matrix.image }}
          V: ${{ needs.tag.outputs.version }}
        run: |
          set -euo pipefail
          # GHCR repository names must be lower case; the owner may not be.
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "repo=ghcr.io/$owner/$IMAGE" >> "$GITHUB_OUTPUT"
          echo "tag=ghcr.io/$owner/$IMAGE:$V" >> "$GITHUB_OUTPUT"

      # Tagged with the version only: no `latest`, no moving tag. The tag is a
      # label for humans; the digest below is what the manifest names and what
      # anything installs.
      - name: Build and push (linux/amd64, linux/arm64)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-contexts: ${{ matrix.build_contexts }}
          build-args: REVISION=${{ github.event.workflow_run.head_sha }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.name.outputs.tag }}
          # Provenance is the GitHub attestation below, once; buildx's own
          # would add unknown/unknown entries to the index beside it.
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.tag.outputs.version }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Check what was pushed is a two-platform index
        shell: bash
        env:
          IMAGE: ${{ matrix.image }}
          REPO: ${{ steps.name.outputs.repo }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no digest from the build: '$DIGEST'"; exit 1; }
          platforms=$(docker buildx imagetools inspect "$REPO@$DIGEST" --raw \
            | jq -r '[.manifests[]?.platform | select(.os != "unknown") | "\(.os)/\(.architecture)"] | sort | join(",")')
          echo "$REPO@$DIGEST -> $platforms"
          [ "$platforms" = "linux/amd64,linux/arm64" ] || { echo "::error::expected linux/amd64,linux/arm64, got '$platforms'"; exit 1; }
          printf '%s' "$DIGEST" > "digest-$IMAGE"

      - name: Attest build provenance (pushed to the registry beside the image)
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.name.outputs.repo }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.image }}
          path: digest-${{ matrix.image }}
          if-no-files-found: error

  # The manifest an installer reads: every own image by digest, every third
  # party image by the digest its compose file pins, the commit and the version.
  # Built by scripts/gen-release-manifest.py, which fails on any third-party
  # image not pinned by digest. Attached to the release and attested.
  # No packages permission: it only reads the digests the images job recorded.
  #
  # It also makes the release SELF-CONSISTENT (found by the first real release,
  # v2026.11.1): `bothy install`/`bothy update` accept a manifest only if its
  # sha256 is a line of checksums.txt, but `cli` wrote checksums.txt before the
  # images and this manifest existed. So, after generating the manifest, this job
  # downloads the published checksums.txt, adds the manifest's line
  # (scripts/append-manifest-checksum.sh: sorted, idempotent), uploads it back
  # with --clobber and attests the new file AND the manifest. The attestation on
  # the cli job's earlier checksums.txt stays in the registry, for a digest that
  # no longer matches any release asset: harmless, nothing verifies against it.
  #
  # Why `needs: cli`: the file edited here must be the one `cli` finished
  # uploading, never one still racing it. A failed `cli` therefore skips this job.
  #
  # Order matters and scripts/checks/release-order.sh pins it: generate manifest,
  # final checksums.txt, upload, attest, verify, and only then the summary that
  # prints BOTHY_PIN_CHECKSUMS_SHA256 - the hash of the FINAL file.
  #
  # Recovery: re-running only this job is safe (the append replaces its own
  # line; same inputs, same bytes, same hash). If `cli` is ever re-run, its
  # --clobber upload restores the line-less checksums.txt: re-run this job after.
  release-manifest:
    name: Attach release-manifest.json and finish checksums.txt
    needs: [tag, images, cli]
    if: needs.tag.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write       # gh release upload
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true

      - name: Generate release-manifest.json
        shell: bash
        env:
          V: ${{ needs.tag.outputs.version }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          args=()
          for f in digests/digest-*; do
            name="${f##*/digest-}"
            args+=(--own "$name=ghcr.io/$owner/$name@$(cat "$f")")
          done
          python3 scripts/gen-release-manifest.py --version "$V" --commit "$SHA" "${args[@]}" --out release-manifest.json
          jq . release-manifest.json

      - name: Final checksums.txt - add the manifest's line to the published one
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.tag.outputs.version }}
        run: |
          set -euo pipefail
          mkdir final
          gh release download "v$V" -p checksums.txt -D final --clobber
          # What the cli job published must be the six archives (plus, on a
          # re-run, our own line): anything else is not a file to build on.
          n=$(grep -c "  bothy_${V}_" final/checksums.txt || true)
          [ "$n" -eq 6 ] || { echo "::error::checksums.txt on v$V lists $n bothy_${V}_ archives, expected 6 - did the cli job finish?"; exit 1; }
          bash scripts/append-manifest-checksum.sh final/checksums.txt release-manifest.json
          cat final/checksums.txt

      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.tag.outputs.version }}
        run: gh release upload "v$V" release-manifest.json final/checksums.txt --clobber

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            release-manifest.json
            final/checksums.txt

      - name: The release is self-consistent
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.tag.outputs.version }}
        run: |
          set -euo pipefail
          # What the release serves is what was attested, and the manifest's
          # line in it is the manifest's real hash: the check `bothy install` makes.
          mkdir served
          gh release download "v$V" -p checksums.txt -p release-manifest.json -D served --clobber
          cmp final/checksums.txt served/checksums.txt
          cmp release-manifest.json served/release-manifest.json
          (cd served && grep "  release-manifest.json$" checksums.txt | sha256sum -c -)
          gh attestation verify served/checksums.txt -R "$GITHUB_REPOSITORY"
          gh attestation verify served/release-manifest.json -R "$GITHUB_REPOSITORY"

      - name: Summary - the pin for scripts/bothy.sh
        shell: bash
        env:
          V: ${{ needs.tag.outputs.version }}
        run: |
          set -euo pipefail
          sum=$(sha256sum served/checksums.txt | cut -d' ' -f1)
          {
            echo "### BOTHY_PIN_CHECKSUMS_SHA256 for v$V"
            echo
            echo "sha256 of the FINAL checksums.txt (archives + release-manifest.json line):"
            echo
            echo '```'
            echo "$sum"
            echo '```'
            echo
            echo "Pin this one. The cli job's earlier checksums.txt had no manifest line."
          } | tee -a "$GITHUB_STEP_SUMMARY"
