name: Deploy site to GitHub Pages

# LIVE since 2026-11-17 (bothybox.com; Pages source is "GitHub Actions", the certificate is issued, HTTPS enforced).
# It runs on every release tag (v*), and by hand. A tag deploys the site exactly as that tag's tree builds it, so
# the owner decides when the public site changes by tagging. The `github-pages` environment allows the branch main
# and the tag pattern v* (Settings > Environments); without the tag rule a tag run is refused at the deploy job.
# The gates (npm test, verify-dist.sh) run first and a failure stops the deploy.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: bash scripts/verify-dist.sh
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site/dist

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
