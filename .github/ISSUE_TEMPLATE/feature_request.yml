name: Feature request
description: Propose a new service, recipe, dashboard or change in how the box is wired.
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This repository is the configuration for one person's self-hosted
        development box, so the bar for "should this exist here" is a bit
        specific. Two rules worth knowing before you write:

        - The stack provides what projects **do not** ship — routing, DNS,
          dashboards, logs. It does not provide what a project ships for itself;
          a project keeps its own database.
        - Nothing a browser reaches gets a published host port. It gets a
          `*.dev.test` hostname through Traefik instead.

  - type: dropdown
    id: area
    attributes:
      label: Which part of the box would this touch?
      options:
        - edge / Traefik
        - auth / SSO
        - monitoring
        - data
        - mgmt
        - apps / portal
        - docs
        - host / DNS
        - k8s
        - something new
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What is awkward, missing or manual today? Describe the situation, not the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like to happen
      description: If this adds a service, say what it is, why the stack should own it rather than a project, and what hostname it would take.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Including "do nothing" — a ruled-out option is useful information.
    validations:
      required: false

  - type: textarea
    id: impact
    attributes:
      label: Impact on existing behaviour
      description: >
        Would this change a router rule, a compose file, the SSO middleware, or
        anything listed under "Load-bearing design rules" in SECURITY.md? New
        resource cost (RAM, disk, a container that never idles) belongs here too.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and discussions for the same idea.
          required: true
        - label: This does not require publishing a host port for something a browser reaches.
          required: false
        - label: I am willing to open a pull request for this.
          required: false
