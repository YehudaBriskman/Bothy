name: Feature request
description: Propose a new service, recipe, dashboard or change in how the box is wired.
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This repository is the configuration for one person's self-hosted
        development box, so the bar for "should this exist here" is a bit
        specific. Two rules worth knowing before you write:

        - The stack provides what projects **do not** ship - routing,
          dashboards, logs. It does not provide what a project ships for itself;
          a project keeps its own database.
        - **Access is `IP:port`.** The `*.dev.test` name layer was deleted on
          2026-08-12 and Traefik holds zero `Host()` rules, so anything a
          browser reaches publishes a host port and gets listed in `just urls`.
          Proposals built on hostnames need to argue for rebuilding that layer,
          not assume it.
        - **Nothing is authenticated at the edge right now.** `sso@file` is
          defined and attached to no router while identity is rebuilt on
          Keycloak. A service that needs a login carries its own.

  - type: dropdown
    id: area
    attributes:
      label: Which part of the box would this touch?
      options:
        - edge / Traefik
        - auth / Keycloak / oauth2-proxy
        - monitoring
        - data
        - mgmt
        - apps / portal
        - docs
        - host / networking
        - k8s
        - something new
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What is awkward, missing or manual today? Describe the situation, not the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like to happen
      description: If this adds a service, say what it is, why the stack should own it rather than a project, and which host port it would take (checked free against `just urls`).
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Including "do nothing" - a ruled-out option is useful information.
    validations:
      required: false

  - type: textarea
    id: impact
    attributes:
      label: Impact on existing behaviour
      description: >
        Would this change a router rule, a compose file, the SSO middleware, or
        anything listed under "Load-bearing design rules" in SECURITY.md? New
        resource cost (RAM, disk, a container that never idles) belongs here too.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and discussions for the same idea.
          required: true
        - label: If this needs a host port, I checked it is free against `just urls` and `docker ps`.
          required: false
        - label: I am willing to open a pull request for this.
          required: false
