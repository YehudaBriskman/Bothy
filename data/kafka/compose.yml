name: kafka

services:
  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # INTERNAL (kafka:19092) for containers, EXTERNAL (localhost:9092) for host.
      # Without this the broker writes to its built-in default and the volume
      # mounted below stays empty, so every topic dies with the container.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:19092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1500m
    networks: [devnet]

  kafka-ui:
    image: kafbat/kafka-ui@sha256:7cda86a33344160309fdb65146332e4da65db81a945614f2fe32e210803f6fd1
    container_name: kafka-ui
    labels:
      - traefik.enable=true
      - traefik.http.routers.kafka.rule=Host(`kafka.dev.test`)
      - traefik.http.routers.kafka.entrypoints=web
      - traefik.http.routers.kafka.service=kafka
      - traefik.http.services.kafka.loadbalancer.server.port=8080
      # Kafka-UI runs with DYNAMIC_CONFIG_ENABLED and has no auth of its own, so
      # anyone reaching it could add clusters and mutate topic config.
      - traefik.http.routers.kafka.middlewares=sso-errors@file,sso@file
      - dev.portal.name=Kafka UI
      - dev.portal.desc=Browse the single-node KRaft broker — topics, partitions, consumer groups and live messages.
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on: [kafka]
    deploy:
      resources:
        limits:
          memory: 768m
    networks: [devnet]

  kafka-exporter:
    image: danielqsj/kafka-exporter@sha256:a51b280b55a763deaa1bc5024310bc2954995d9160014d7445055dac6a090868
    container_name: kafka-exporter
    restart: unless-stopped
    command: ["--kafka.server=kafka:19092"]
    depends_on: [kafka]
    deploy:
      resources:
        limits:
          memory: 128m
    networks: [devnet]

volumes:
  kafka_data:

networks:
  devnet:
    external: true
