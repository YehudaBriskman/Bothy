name: postgres

services:
  postgres:
    # Tag for humans, digest for the pull: `17` floated, so a routine `up` could
    # move the server to a new minor unannounced. keycloak-db-init in
    # auth/compose.yml pins the SAME ref - bump both together.
    image: postgres:17.10@sha256:7958605b474b3d264a969cb3a123d6aa00ad1e1fe9da8a69984dabb704d93317
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-dev}
    ports:
      # Loopback only. The ssh tunnel in `just urls` connects to localhost on
      # this box, so it is unaffected; containers reach postgres by name over
      # devnet and never touch this published port.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Card title in Bothy's Overview, `Role · Vendor` - see edge/compose.yml.
    # The shared database - Keycloak's schema lives here and projects borrow it -
    # so a name implying the portal OWNED the data would be the wrong claim
    # twice over.
    labels:
      - dev.portal.project=Database · Postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1g
    networks: [devnet]

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
    container_name: postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-dev}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-dev}?sslmode=disable"
    # Short form waits only for the container to exist, not for the service
    # to accept connections, so on a cold boot this started against a DB
    # still initialising and crash-looped until the restart policy caught it.
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The landing page, not /metrics: /metrics queries postgres, and a DB
      # outage is pg_up=0, not a broken exporter.
      test: ["CMD", "wget", "-qO", "/dev/null", "-T", "3", "http://127.0.0.1:9187/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 128m
    networks: [devnet]

volumes:
  postgres_data:

networks:
  devnet:
    external: true
