name: redis

# RETIRED 2026-08-12 — kept on disk, no longer started by `just up`.
#
# Why: measured idle. `DBSIZE` returned 0 and `INFO keyspace` was empty — not a
# single key in any database. The pair held ~30 MB (redis 13.2 MB,
# redis-exporter 16.3 MB) of the box's 4,678 MB total container memory. Small,
# but it was storing nothing at all, and the exporter cost more than the server.
#
# The `redis_data` volume was deliberately PRESERVED (`down` without `-v`).
# It is cheap and deleting it is irreversible. (Note `cvops_redis_data` is a
# different volume owned by the CVOps project — untouched, unrelated.)
#
# To bring it back — one command, nothing else to undo:
#   docker compose -f data/redis/compose.yml up -d
# Still referenced by `just down` and `just nuke` so an older deployment on
# this box still gets cleaned up.
#
# While this is down, `just redis` (redis-cli shell) and the redis leg of
# scripts/backup.sh have nothing to talk to; backup.sh already degrades
# gracefully with "redis not running — skipped".

services:
  redis:
    image: redis:8-alpine
    container_name: redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      # Loopback only - this instance has no requirepass at all, so it must
      # never be reachable beyond the box itself.
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m
    networks: [devnet]

  redis-exporter:
    image: oliver006/redis_exporter:v1.88.0
    container_name: redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: "redis://redis:6379"
    # Short form waits only for the container to exist, not for the service
    # to accept connections, so on a cold boot this started against a DB
    # still initialising and crash-looped until the restart policy caught it.
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128m
    networks: [devnet]

volumes:
  redis_data:

networks:
  devnet:
    external: true
