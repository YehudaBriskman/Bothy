name: redis

services:
  redis:
    image: redis:8-alpine
    container_name: redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      # Loopback only - this instance has no requirepass at all, so it must
      # never be reachable beyond the box itself.
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m
    networks: [devnet]

  redis-exporter:
    image: oliver006/redis_exporter:v1.88.0
    container_name: redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: "redis://redis:6379"
    # Short form waits only for the container to exist, not for the service
    # to accept connections, so on a cold boot this started against a DB
    # still initialising and crash-looped until the restart policy caught it.
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128m
    networks: [devnet]

volumes:
  redis_data:

networks:
  devnet:
    external: true
