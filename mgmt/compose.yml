name: mgmt

services:
  portainer:
    image: portainer/portainer-ce@sha256:3fa8750ac2b98ce56784ca292df1adc3ec38f0062fd572811ea4b2221beee310
    container_name: portainer
    # No Traefik router - reached directly on published port 9000.
    #
    # Portainer holds a READ-WRITE docker socket, so its UI serves container
    # Env - POSTGRES_PASSWORD and the Grafana admin password - and container
    # exec, which is root on this box. Its own login is now the ONLY thing
    # between the tailnet and that (the SSO chain was parked, and the route it
    # sat behind is gone), and it is set interactively on first visit, so an
    # unclaimed instance is a total takeover for whoever claims it first.
    restart: unless-stopped
    # Card title in Bothy's Overview, `Role · Vendor` - see edge/compose.yml.
    # "Containers", not "Management" - a role has to say what it manages. This is
    # also the name most likely to outlive its vendor: when container actions
    # become first-party, "Containers" stays and only the credit changes.
    labels:
      - dev.portal.project=Containers · Portainer
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    deploy:
      resources:
        limits:
          memory: 512m
    networks: [devnet]

  dozzle:
    image: amir20/dozzle:v10.7.1
    container_name: dozzle
    # No Traefik router - reached directly on published port 8080.
    #
    # Dozzle streams every container's logs. Since the SSO chain was parked
    # (2026-08-08) it runs its own simple-auth: users in dozzle-users.yml
    # (generated with `dozzle generate`, gitignored - hash only, no secrets
    # in the public repo).
    restart: unless-stopped
    environment:
      DOZZLE_AUTH_PROVIDER: simple
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./dozzle-users.yml:/data/users.yml:ro
    deploy:
      resources:
        limits:
          memory: 256m
    networks: [devnet]

volumes:
  portainer_data:

networks:
  devnet:
    external: true
