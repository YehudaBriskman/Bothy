name: mgmt

services:
  portainer:
    image: portainer/portainer-ce@sha256:f6bc23d1695530a609563fd65c180aaafec0fc02e019d5fc63d16b6fbe83addd
    container_name: portainer
    labels:
      - traefik.enable=true
      - traefik.http.routers.portainer.rule=Host(`portainer.dev.test`)
      - traefik.http.routers.portainer.entrypoints=web
      - traefik.http.routers.portainer.service=portainer
      - traefik.http.services.portainer.loadbalancer.server.port=9000
      # Portainer holds a READ-WRITE docker socket, so its UI serves container
      # Env — POSTGRES_PASSWORD and the Grafana admin password — and container
      # exec, which is root on this box. Its own login is the only thing between
      # the tailnet and that, and it is set interactively on first visit, so an
      # unclaimed instance is a total takeover for whoever claims it first.
      # SSO in front means a GitHub session is required before Portainer's own
      # login is even reachable.
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    deploy:
      resources:
        limits:
          memory: 512m
    networks: [devnet]

  dozzle:
    image: amir20/dozzle:v10.6.13
    container_name: dozzle
    labels:
      - traefik.enable=true
      - traefik.http.routers.dozzle.rule=Host(`dozzle.dev.test`)
      - traefik.http.routers.dozzle.entrypoints=web
      - traefik.http.routers.dozzle.service=dozzle
      - traefik.http.services.dozzle.loadbalancer.server.port=8080
      # Dozzle streams every container's logs and ships with no auth of its
      # own, so it sits behind the GitHub SSO chain (see edge/dynamic/auth.yml).
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    deploy:
      resources:
        limits:
          memory: 256m
    networks: [devnet]

volumes:
  portainer_data:

networks:
  devnet:
    external: true
