name: mgmt

services:
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    labels:
      - traefik.enable=true
      - traefik.http.routers.portainer.rule=Host(`portainer.dev.test`)
      - traefik.http.routers.portainer.entrypoints=web
      - traefik.http.routers.portainer.service=portainer
      - traefik.http.services.portainer.loadbalancer.server.port=9000
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    deploy:
      resources:
        limits:
          memory: 512m
    networks: [devnet]

  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    labels:
      - traefik.enable=true
      - traefik.http.routers.dozzle.rule=Host(`dozzle.dev.test`)
      - traefik.http.routers.dozzle.entrypoints=web
      - traefik.http.routers.dozzle.service=dozzle
      - traefik.http.services.dozzle.loadbalancer.server.port=8080
      # Dozzle streams every container's logs and ships with no auth of its
      # own, so it sits behind the GitHub SSO chain (see edge/dynamic/auth.yml).
      - traefik.http.routers.dozzle.middlewares=sso-errors@file,sso@file
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    deploy:
      resources:
        limits:
          memory: 256m
    networks: [devnet]

volumes:
  portainer_data:

networks:
  devnet:
    external: true
