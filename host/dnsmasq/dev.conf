# DORMANT NOTE (2026-08-08): the tailnet split-DNS route for .test is being
# removed - clients now use the plain tailnet IP, so the .test wildcard below
# is served but unused. dnsmasq itself STAYS: it is this box's own resolver
# (see /etc/resolv.conf). Re-add the split-DNS route in the Tailscale admin
# console to bring names back; nothing here needs to change for that.

# Wildcard DNS for the local dev stack: *.test -> this WSL box's tailnet IP.
#
# .test is RFC 6761 reserved: it can never become a real gTLD and nothing
# HSTS-preloads it, so plain http:// works. (.dev is preloaded by Google and
# would force https:// - do not use it here.)

# Bind ONLY the tailnet address. systemd-resolved owns 127.0.0.53 and would
# collide on a bare 0.0.0.0 bind. bind-dynamic (not bind-interfaces) so dnsmasq
# survives tailscale0 appearing after it at boot.
bind-dynamic
listen-address=100.117.176.85

# Authoritative for .test and nothing else. Tailscale split DNS only routes
# .test queries here, so no upstream is needed - and no-resolv stops dnsmasq
# reading WSL's auto-generated resolv.conf and looping back on itself.
no-resolv
address=/test/100.117.176.85

# --- Also serve the box itself -------------------------------------------
# The block above is authoritative for .test and deliberately has no upstream,
# which is correct for tailnet clients arriving via split DNS. But it left the
# box unable to resolve its own names: /etc/resolv.conf points at WSL's NAT
# resolver, which knows nothing about .test, so `curl grafana.dev.test` failed
# from inside WSL while working from a phone.
#
# Listening on loopback as well lets /etc/resolv.conf point here. That in turn
# requires real upstreams, since a resolver that only knows .test cannot be a
# host's primary. Docker ignores 127.x nameservers, so containers keep
# inheriting the NAT resolver exactly as before.
listen-address=127.0.0.1
server=/ts.net/100.100.100.100
server=10.255.255.254

# address= alone still let AAAA queries for .test be forwarded upstream, and the
# upstream never answers them, so every getaddrinfo() with AF_UNSPEC hung until
# the client timed out: `curl -4 http://dev.test` returned 200 while plain
# `curl http://dev.test` failed with "Resolving timed out".
# local= makes dnsmasq authoritative for .test, so a type it has no record for
# gets an immediate NODATA instead of being forwarded.
local=/test/

# --- Never forward single-label names -------------------------------------
# A dotless name (`tempo`, `redis`, any bare container name that leaked out of a
# compose file into a HOST process) has no meaning outside a Docker network, but
# dnsmasq was forwarding it to the Windows resolver at 10.255.255.254, which
# silently drops such queries instead of answering NXDOMAIN. glibc then retried
# A and AAAA across both nameservers, so `getent hosts tempo` took 40 SECONDS to
# fail.
#
# That is not just slow, it is a correctness bug for any Node service: getaddrinfo
# runs on libuv's 4-thread pool, so a handful of hanging lookups starve every
# other lookup in the process. The Tals auth service hit exactly this - its
# OpenTelemetry exporter defaulted to `http://tempo:4318`, the repeated hanging
# `tempo` lookups occupied all 4 threads, and pg's own `localhost` lookup then
# could not get a thread inside its 5s connect timeout. Every login 500'd with
# "Connection terminated due to connection timeout" while the database sat
# perfectly healthy 2ms away.
#
# domain-needed makes dnsmasq answer NXDOMAIN immediately for names with no dot
# instead of forwarding them. Cost: `yehuda-hs` no longer resolves to its
# fe80:: link-local address, which was not usable without a zone index anyway.
# Anything real on this box (*.test, *.ts.net, internet names) has a dot.
domain-needed
