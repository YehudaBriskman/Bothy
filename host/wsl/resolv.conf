# Hand-managed, deliberately a REAL file rather than the resolvconf symlink into
# tmpfs, so the immutable bit below can hold. generateResolvConf=false in
# /etc/wsl.conf covers the next boot; the immutable bit is what stops WSL
# rewriting this in a RUNNING distro, which it does whenever Windows' DNS config
# changes (e.g. when the Windows Tailscale node connects).
#
# 127.0.0.1 is dnsmasq: authoritative for .test, forwards the rest. It answers
# AAAA for .test with an instant NODATA; the upstream Windows resolver instead
# hangs on those, which stalls every plain `curl http://x.test` until timeout
# while `curl -4` succeeds.
#
# To edit: sudo chattr -i /etc/resolv.conf, edit, sudo chattr +i /etc/resolv.conf
nameserver 127.0.0.1
nameserver 10.255.255.254
