<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="32" height="32">
  <!-- Bothy - the mark, SILHOUETTE RENDERING. This file is the source of
       geometry for every icon that ships: `scripts/gen-icons.py` (at the REPO
       ROOT, driven by headless Chromium) rasterises this file into icon-192.png
       and icon-512.png, and icon-maskable.svg - which carries a copy of these
       two paths at 0.72 scale - into icon-maskable-512.png and
       apple-touch-icon.png. Nothing else draws an icon.

       (An earlier version of this comment said the generator read this file
       while no such script existed, and then a second, now-deleted copy under
       web/scripts/ hardcoded a DIFFERENT mark and would have overwritten three
       shipped icons with it. Hence the explicit path above.)

       THERE IS A SECOND RENDERING OF THIS MARK, and it is deliberate:
       src/components/Brand.tsx draws it as a 2px `currentColor` OUTLINE for the
       one place inside the app that shows it - a 72px watermark in the Files
       empty state, at 13% opacity, which has to follow seven themes and would
       be a grey slab if it were filled. The two renderings are not derived from
       each other and their coordinates DIFFER on purpose; what they must share,
       and what checks/mark-geometry.mjs holds them to, is written up in
       docs/brand/foundations/logo-and-app-icons.md.

       A bothy is a squat stone hut with the door left open and the light on.
       Two shapes only:
         · the hut, a SOLID silhouette (no strokes - lucide is a 2px-stroke set,
           so a filled mark is categorically not one of its glyphs, which is the
           cheapest reliable way to stop reading as `house`),
         · the doorway, the one coloured element, 15% of the hut's area so it
           still measures 4x4 device pixels at 16px.

       The tile is dark in BOTH themes on purpose: a favicon sits on the
       browser's tab strip, not on the page, so it cannot know the page theme,
       and a mark that inverts is a mark nobody recognises at a glance. Which is
       also why the three colours here are LITERALS and not tokens: this file is
       served from public/, is never imported by the app, and has no theme to
       read. checks/stray-colour.mjs scans web/src only, so it never sees them. -->
  <rect width="24" height="24" rx="5.4" fill="#09090b"/>
  <!-- the hut: apex, deep eaves with a blunt 1.2-unit face, squat walls -->
  <path fill="#fafafa" d="M12 4.2 L22.4 10.6 L22.4 11.8 L19 11.8 L19 20.2 L5 20.2 L5 11.8 L1.6 11.8 L1.6 10.6 Z"/>
  <!-- the lit doorway -->
  <path fill="#60a5fa" d="M9 20.2 V17.2 a3 3 0 0 1 6 0 V20.2 Z"/>
</svg>
