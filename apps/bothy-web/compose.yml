name: bothy-web

# Vite+React rewrite of the portal, served as a static build behind Traefik. It
# is THE portal now (the pure-HTML apps/portal was retired). The name layer is
# gone, so it is served on the bare tailnet IP - http://100.117.176.85/
# - by the catch-all router below, which is the only route it has left.

services:
  bothy-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bothy-web
    restart: unless-stopped
    volumes:
      # Written by the host-side collector (../bothy-collector), which resolves
      # each project's project.dev.yml against real host state. Bind-mounted
      # rather than baked into the image because it changes every minute and the
      # image does not. Read-only: the portal renders it, never writes it, and an
      # absent file simply means no declared projects.
      - ./data:/usr/share/nginx/html/data:ro
    labels:
      - traefik.enable=true
      - traefik.http.services.bothy-web.loadbalancer.server.port=80
      # ONE router, and it is the catch-all. The Host(<base-domain>) router that
      # used to sit here was removed on 2026-08-12 with the rest of the name
      # layer: it matched a hostname that has not resolved since 2026-08-08, so
      # it was answering nothing.
      #
      # This is now the ONLY route the portal has, which makes it load-bearing:
      # it is what serves http://<tailnet-ip>/ . Priority 1 keeps it below every
      # real rule, so the host-less exact-Path() /-/api/* routes at priority 100
      # (edge/dynamic/bothy-api.yml, bothy-prom.yml) still win over it - that
      # ordering is why the SPA and its data plane can share one origin.
      #
      # Do not delete it, and do not give it a Host rule.
      - traefik.http.routers.bothy-web-fallback.rule=PathPrefix(`/`)
      - traefik.http.routers.bothy-web-fallback.priority=1
      - traefik.http.routers.bothy-web-fallback.entrypoints=web
      - traefik.http.routers.bothy-web-fallback.service=bothy-web
    # Straight at nginx, not through :80 on the host - via Traefik, the
    # catch-all would answer 200 whether or not this container was up.
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "-T", "3", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
      # LOAD-BEARING. Traefik's docker provider ignores a container whose
      # health is still `starting`, and this container's labels ARE the
      # catch-all router. Without start_interval the first probe waits a full
      # `interval`, so for ~30s after every (re)start `/` is Traefik's own 404
      # - CI's install job hit exactly that 5s after `just up` (2026-09-18).
      start_interval: 2s
    deploy:
      resources:
        limits:
          memory: 64m
    networks: [devnet]

networks:
  devnet:
    external: true
