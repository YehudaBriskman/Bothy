# What Bothy knows how to keep current: every component it runs, how to update
# it by hand, and how far an update may ever go without a person.
#
# THE ONLY HAND-WRITTEN UPDATE CATALOG (docs/plans/updates.md §3). Read by:
#
#   apps/bothy-ops/discover_updates.py   on the HOST, every 6h: reads each pin
#                                        named below, asks the registry / GitHub /
#                                        the helm index what is newer, and writes
#                                        ~/.local/state/bothy/updates/available.json
#   apps/bothy-ops/updates.py            in bothy-ops: serves this file merged with
#                                        available.json at GET /-/api/updates/status
#
# The host updater (apps/bothy-ops/updater) deploys what `main` pins for the
# classes it handles - stateless and timeseries (step 4), the one-way app-db,
# Grafana and Keycloak (step 5), Bothy itself (own-code, step 6), the cluster
# add-ons (cluster, step 8: `just k8s-monitoring ksm|alloy`) and the Postgres
# MAJOR (database, step 8: the manual plan kind postgres-major - typed AND noted,
# never automatic) - running `apply` and the canaries in updater/canaries.py.
# `verify` here is the words the page shows for them; the checks themselves are
# code. The auth boundary and the edge are still updated by hand.
#
# updates.load_catalog() has NO DEFAULTS and REFUSES unknown keys, unknown
# channels, and an `auto` channel on anything one-way or on the auth boundary. A
# typo here stops bothy-ops starting, which is the loud way to be wrong.
#
# ── the policy (approved 2026-09-18, docs/plans/updates.md "Decisions") ─────────
#
#   channel = "auto"     patch releases only, applied in the window below. A minor
#                        of an auto component is only NOTIFIED; a major is MANUAL.
#   channel = "notify"   shown, with a badge; applied by a person.
#   channel = "manual"   shown, never applied automatically. The updater may still
#                        offer it as a plan, but a one-way plan always needs the
#                        component's name TYPED, never a click.
#   ANY major, of anything, is manual (updates.effective_channel()).
#
# `auto` is legal only for class stateless and timeseries. Widening that is a code
# change to updates.AUTO_CLASSES, reviewed, not an edit to this file.
#
# ── component keys (ALL required unless marked) ──────────────────────────────────
#
#   title       what the page calls it
#   class       stateless | boundary | edge | timeseries | app-db | database |
#               own-code | cluster                       (docs/plans/updates.md §4)
#   source      where "newer" comes from:
#                 image     a container registry (Docker Registry HTTP API v2)
#                 manifest  the same, for an image pinned in a k8s manifest
#                 helm      a chart's helm repository index.yaml
#                 github    the release tags of a GitHub repository
#   pins        where the version is written, repo-relative. The FIRST is the one
#               the page shows; the rest must agree with it (discovery says so
#               when they do not):
#                 image     "<compose file>:<service>"
#                 manifest  "<manifest>:<container name>"
#                 helm      "<script>:<SHELL_VARIABLE>"
#                 github    "<file holding the version>"
#   apply       the `just` recipe that applies a changed pin
#   dependants  what restarts or is interrupted with it (container names, or
#               "every gated route"-style words for the page)
#   changelog   https URL; `{version}` is replaced by the version on offer
#   channel     auto | notify | manual
#   one_way     true when the first start of a new version migrates data that the
#               old version cannot read - rollback is a restore, not a re-pin
#   one_way_why REQUIRED when one_way is true, FORBIDDEN otherwise
#   verify      the canaries that must pass after an update (descriptive until
#               step 4 runs them; rule 7: bodies, never status codes)
#   repo        (github only) owner/name
#   chart       (helm only) the chart name in the index
#   chart_repo  (helm only) the https URL of the helm repository
#   release     (helm only) "<namespace>/<release>", to read what is installed
#   workload    (manifest only) "<namespace>/<kind>/<name>", to read what runs
#
# Not listed: prometheus and promtail (monitoring/compose.yml, behind the
# legacy-* profiles - kept for rollback and never started), bothy-web's nginx /
# node bases and the Python bases of bothy-files and bothy-ops (they update WITH
# our own code), minikube / kubectl / helm (host tooling, out of scope for v1).

[policy]
# Automatic updates run only inside this window, local time...
window_start = "03:30"
window_end = "05:00"
# ...only when that night's 03:00 backup (stacks-backup.service) succeeded, and
# `just doctor` was green just before.
require_backup = "stacks-backup.service"
require_doctor = true
# One automatic update per night, stopping at the first failure.
max_auto_per_night = 1
# A rollback or a failed verify pauses `auto` for that component until an
# operator clears it.
pause_on_failure = true
# The discovery timer's period, in hours; the page calls the result stale after
# two missed runs.
discover_every_hours = 6

