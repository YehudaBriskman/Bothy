# ── 4. update.plan ───────────────────────────────────────────────────────────
# `data.plan` is EXACTLY what the legacy GET /updates/plan serves (the host
# planner's own output through bothy-ops' allow-list). `data.scope` is the one
# thing added: for a component the host will refuse to apply alone because its
# recipe also recreates other services, the structured refusal of doc 4.5
# (code scope.group-available) with the group-apply offer. It is DATA on a 200,
# not an error envelope: the question "what would applying do" was answered.
[ops."update.plan"]
title = "What applying a component (or a whole recipe group) would do, including every refusal"
http = "GET /-/api/v1/updates/plan"
role = "viewer"
effect = "read"
confirm = "none"
callers = ["web", "cli", "mcp", "system"]
mcp = { tool = "bothy_update_plan", scope = "read" }
cli = "update plan"
audit = "v1.update.plan"
idempotent = true
input.component = { type = "string", pattern = "[a-z][a-z0-9-]{0,39}", one_of = "target" }
input.group = { type = "string", pattern = "[a-z][a-z0-9-]{0,39}", one_of = "target" }
output = { type = "object", required = ["target", "plan", "reason", "ageSeconds", "scope"], properties = { target = { type = "string", enum = ["component", "group"] }, component = { type = "string" }, group = { type = "string" }, plan = { type = "object", nullable = true, required = ["id", "level", "confirm"], properties = { id = { type = "string" }, kind = { type = "string", nullable = true }, level = { type = "string", enum = ["patch", "minor", "major"] }, confirm = { type = "string", enum = ["click", "type-name"] }, oneWay = { type = "boolean" }, confirmWord = { type = "string", nullable = true }, members = { type = "array", items = { type = "object" } }, skipped = { type = "array", items = { type = "object", properties = { reason = { type = "untrusted", source = "file" } } } }, own = { type = "object", properties = { ci = { type = "object", properties = { detail = { type = "untrusted", source = "ci", nullable = true } } } } } } }, reason = { type = "untrusted", source = "file", nullable = true }, ageSeconds = { type = "integer", nullable = true }, scope = { type = "object", nullable = true, required = ["code", "message", "details", "hint"], properties = { code = { type = "string", enum = ["scope.group-available"] }, message = { type = "string" }, details = { type = "object", required = ["component", "recipe", "would_recreate", "group", "group_class", "group_confirm", "group_plan_id", "rollback"], properties = { component = { type = "string" }, recipe = { type = "string" }, would_recreate = { type = "array", items = { type = "string" } }, group = { type = "string" }, group_class = { type = "string" }, group_confirm = { type = "string", enum = ["click", "type-name"] }, group_plan_id = { type = "string" }, rollback = { type = "string", enum = ["all-or-nothing"] } } }, hint = { type = "string" } } } } }

# ── 5. update.history ────────────────────────────────────────────────────────
[ops."update.history"]
title = "Finished and running update jobs, newest first"
http = "GET /-/api/v1/updates/history"
role = "viewer"
effect = "read"
confirm = "none"
callers = ["web", "cli", "mcp", "system"]
mcp = { tool = "bothy_update_history", scope = "read" }
cli = "update history"
audit = "v1.update.history"
idempotent = true
input.component = { type = "string", pattern = "[a-z][a-z0-9-]{0,39}" }
input.limit = { type = "integer", min = 1, max = 100, default = 20 }
output = { type = "object", required = ["jobs"], properties = { jobs = { type = "array", items = { type = "object", required = ["id", "component", "state", "requestedAt", "endedAt", "from", "to", "error", "note"], properties = { id = { type = "string" }, component = { type = "string" }, planId = { type = "string", nullable = true }, state = { type = "string", enum = ["queued", "running", "succeeded", "rolled_back", "aborted", "failed", "refused"] }, requestedBy = { type = "string" }, requestedAt = { type = "string", nullable = true }, startedAt = { type = "string", nullable = true }, endedAt = { type = "string", nullable = true }, durationMs = { type = "integer", nullable = true }, failedStep = { type = "string", nullable = true }, members = { type = "array", items = { type = "string" } }, error = { type = "untrusted", source = "container-log", nullable = true }, note = { type = "untrusted", source = "operator-note", nullable = true } } } } } }

# ── 6. job.get ───────────────────────────────────────────────────────────────
[ops."job.get"]
title = "One job: its state and its steps"
http = "GET /-/api/v1/job"
role = "viewer"
effect = "read"
confirm = "none"
callers = ["web", "cli", "mcp", "system"]
mcp = { tool = "bothy_job_get", scope = "read" }
cli = "job show"
audit = "v1.job.get"
idempotent = true
input.id = { type = "string", pattern = "[a-f0-9]{32}", required = true }
output = { type = "object", required = ["job"], properties = { job = { type = "object", required = ["id", "component", "state", "steps"], properties = { id = { type = "string" }, component = { type = "string" }, planId = { type = "string", nullable = true }, state = { type = "string", enum = ["queued", "running", "succeeded", "rolled_back", "aborted", "failed", "refused"] }, requestedBy = { type = "string" }, requestedAt = { type = "string", nullable = true }, startedAt = { type = "string", nullable = true }, endedAt = { type = "string", nullable = true }, error = { type = "untrusted", source = "container-log", nullable = true }, note = { type = "untrusted", source = "operator-note", nullable = true }, snapshot = { type = "untrusted", source = "file", nullable = true }, steps = { type = "array", items = { type = "object", required = ["name", "state", "detail"], properties = { name = { type = "string" }, state = { type = "string", enum = ["pending", "running", "ok", "failed", "skipped"] }, startedAt = { type = "string", nullable = true }, endedAt = { type = "string", nullable = true }, detail = { type = "untrusted", source = "container-log", nullable = true } } } } } } } }

# ── 7. events.query ──────────────────────────────────────────────────────────
# Slice 1 serves the job feed (history.jsonl) and nothing else. `type` is an enum
# of what exists, so a client cannot ask for audit rows and be told nothing.
[ops."events.query"]
title = "The append-only event feed, oldest first, by cursor"
http = "GET /-/api/v1/events"
role = "viewer"
effect = "read"
confirm = "none"
callers = ["web", "cli", "mcp", "system"]
mcp = { tool = "bothy_events_query", scope = "read" }
cli = "events"
audit = "v1.events.query"
idempotent = true
input.since = { type = "string", pattern = "e_[a-f0-9]{32}_[a-z_]{4,12}" }
input.type = { type = "string", enum = ["job"] }
input.limit = { type = "integer", min = 1, max = 200, default = 50 }
output = { type = "object", required = ["events", "cursor", "more"], properties = { events = { type = "array", items = { type = "object", required = ["id", "ts", "type", "component", "state", "text"], properties = { id = { type = "string" }, ts = { type = "string", nullable = true }, type = { type = "string", enum = ["job"] }, component = { type = "string" }, job_id = { type = "string" }, state = { type = "string" }, text = { type = "untrusted", source = "container-log", nullable = true } } } }, cursor = { type = "string", nullable = true }, more = { type = "boolean" } } }

# ── 8. settings.get ──────────────────────────────────────────────────────────
# NEVER returns a secret VALUE: for a secret it serves metadata only (set,
# version, updated_at, fingerprint) and no `value` key at all. The adapter reads
# bothy_settings through get_meta alone; it has no path to reveal_for_projection.
[ops."settings.get"]
title = "One setting: its value, or - for a secret - only that it is set"
http = "GET /-/api/v1/settings"
role = "viewer"
effect = "read"
confirm = "none"
callers = ["web", "cli", "mcp", "system"]
mcp = { tool = "bothy_settings_get", scope = "read" }
cli = "settings get"
audit = "v1.settings.get"
idempotent = true
input.module = { type = "string", pattern = "[a-z][a-z0-9_-]{0,62}", required = true }
input.key = { type = "string", pattern = "[A-Za-z_][A-Za-z0-9_]{0,127}", required = true }
output = { type = "object", required = ["module", "key", "secret", "set"], properties = { module = { type = "string" }, key = { type = "string" }, secret = { type = "boolean" }, set = { type = "boolean" }, version = { type = "integer", nullable = true }, updated_at = { type = "string", nullable = true }, updated_by = { type = "string", nullable = true }, fingerprint = { type = "string", nullable = true }, value_type = { type = "string", enum = ["string", "number", "boolean", "null", "object", "array"] }, value = { type = "untrusted", source = "setting" } } }
