# THE OPERATION CATALOG - the one hand-written description of /-/api/v1.
#
# docs/plans/thin-bothy/cli-and-control-plane.md section 1.1 (decisions D15 and D16).
# Everything below is an INPUT; every other copy is an OUTPUT of
# `scripts/gen-ops-v1.py` (`just ops-v1`), and CI re-runs it and fails on a diff:
#
#   apps/bothy-ops/generated/edge-routers.v1.yml   one exact Path() router per route
#   apps/bothy-ops/generated/openapi.v1.json       the OpenAPI document (3.1)
#   apps/bothy-ops/generated/mcp-tools.v1.json     the MCP tool list: read tools only
#   apps/bothy-ops/generated/cli-verbs.v1.json     the CLI verb table
#
# and bothy-ops itself (v1api.py) loads THIS file at start-up to serve
# GET /-/api/v1/discover, to validate every query string, to type untrusted text
# and to refuse a role the op does not allow. The Go client is built from the
# generated documents and tested against checks/golden/v1/.
#
# SLICE 1 IS READ-ONLY (decision D28). Every op below has effect = "read" and
# method GET, and v1api.py REFUSES any other method on /v1/* with auth.forbidden:
# there is no write route, in the catalog or in the router, to find.
#
# ── field reference ─────────────────────────────────────────────────────────
#   title      one line, what it is for a person and for an agent's tool list
#   http       "GET /-/api/v1/<path>": EXACT path (notes rule 1: ids travel in
#              the query string, never in the path, so the router table stays
#              enumerable). The prefix is /-/api/v1; Traefik strips /-/api.
#   role       lowest role that may call it: viewer | editor | operator
#   effect     read | tighten | loosen | destructive | host-only (only `read` exists)
#   confirm    none | click | type-name | host
#   callers    which surfaces may call it at all: web | cli | mcp | system
#   mcp        { tool, scope } - a tool exists ONLY for an op that has this
#   cli        the verb words, e.g. "update plan"
#   audit      the audit KIND written for every call (the executor's row schema
#              of doc 1.7 is slice 2; slice 1 writes this kind to admin.log)
#   idempotent a repeat is harmless
#   input.<n>  type string|integer|boolean, required, pattern (fullmatch), enum,
#              min, max, default, `one_of` = a group of which EXACTLY one is given
#   output     a JSON-Schema SUBSET for `data`: type, nullable, required,
#              properties, items, enum. Unknown extra keys are always allowed
#              (clients ignore them: doc 2.5 rule 4) EXCEPT that a string the
#              schema does not mark is trusted text authored by Bothy.
#              type = "untrusted" is the TRUST TYPING of doc 1.3: the value is
#              served as {"text": ..., "trust": "untrusted", "source": <source>}
#              and ONLY this schema decides which fields are wrapped, so the
#              three surfaces cannot disagree.
#
# ── ids ──────────────────────────────────────────────────────────────────────
# The plan says `j_<ulid>` and `p_<hash>`. The code has 32-hex job ids and
# 24-hex plan ids that every spool file, record and audit line already uses, so
# v1 serves THOSE, unprefixed. A prefix is presentation a client may add.

[api]
version = 1
min_client = "0.0.0"
base = "/-/api/v1"
# Sources a value typed `untrusted` may name. container-log: job step text and
# errors, which quote what a container printed. file: a plan or drift sentence
# that quotes a compose file or path. registry: what an image registry said.
# ci: what GitHub's check runs said. setting: a user-entered setting value.
# operator-note: the free-text note on a request. release-notes and commit are
# reserved for the ops that will carry them (slice 3); none does yet.
untrusted_sources = ["container-log", "file", "registry", "ci", "setting", "operator-note", "release-notes", "commit"]

# Roles in rank order; the repo has no `admin` and its `shell` role is unused.
roles = ["viewer", "editor", "operator"]

# ── the discover endpoint itself (not one of the eight ops) ─────────────────
[endpoints.discover]
title = "The capability list: what this server supports and how to talk to it"
http = "GET /-/api/v1/discover"
role = "viewer"
effect = "read"
confirm = "none"
callers = ["web", "cli", "system"]
cli = "version"
audit = "v1.discover"
idempotent = true
output = { type = "object", required = ["serverVersion", "apiVersion", "minClient", "ops", "enums"], properties = { enums = { type = "object", required = ["component"], properties = { component = { type = "array", items = { type = "string" } } } }, serverVersion = { type = "string" }, apiVersion = { type = "integer" }, minClient = { type = "string" }, ops = { type = "array", items = { type = "object", required = ["id", "method", "path", "role", "effect", "confirm", "callers", "audit"], properties = { id = { type = "string" }, title = { type = "string" }, method = { type = "string", enum = ["GET"] }, path = { type = "string" }, role = { type = "string" }, effect = { type = "string" }, confirm = { type = "string" }, callers = { type = "array", items = { type = "string" } }, idempotent = { type = "boolean" }, audit = { type = "string" }, cli = { type = "string" }, mcp = { type = ["object", "null"] }, input = { type = "object" } } } } } }

# ── 1. status ────────────────────────────────────────────────────────────────
[ops."status"]
title = "The one health view: updates, the running job, discovery freshness"
http = "GET /-/api/v1/status"
role = "viewer"
effect = "read"
confirm = "none"
callers = ["web", "cli", "mcp", "system"]
mcp = { tool = "bothy_status", scope = "read" }
cli = "status"
audit = "v1.status"
idempotent = true
output = { type = "object", required = ["server", "updates", "discovery", "applying", "job", "needsAttention"], properties = { server = { type = "object", required = ["version", "apiVersion"], properties = { version = { type = "string" }, apiVersion = { type = "integer" } } }, updates = { type = "object", required = ["components", "updates", "behind", "drift", "toApply", "configDrift", "groups", "errors"], properties = { components = { type = "integer" }, updates = { type = "integer" }, behind = { type = "integer" }, drift = { type = "integer" }, toApply = { type = "integer" }, configDrift = { type = "integer" }, groups = { type = "integer" }, errors = { type = "integer" } } }, discovery = { type = "object", required = ["present", "stale"], properties = { present = { type = "boolean" }, stale = { type = "boolean" }, generatedAt = { type = "string", nullable = true }, ageSeconds = { type = "integer", nullable = true }, hint = { type = "string", nullable = true } } }, applying = { type = "boolean" }, job = { type = "object", nullable = true, required = ["id", "component", "state"], properties = { id = { type = "string" }, component = { type = "string" }, state = { type = "string" }, error = { type = "untrusted", source = "container-log", nullable = true } } }, needsAttention = { type = "array", items = { type = "object", required = ["kind", "component"], properties = { kind = { type = "string", enum = ["paused", "discovery-error", "update-failed"] }, component = { type = "string" }, detail = { type = "untrusted", source = "container-log", nullable = true } } } } } }

# ── 2. module.list ───────────────────────────────────────────────────────────
# Module declarations (#320) do not exist yet. Until they do, a "module" is what
# the update catalog already groups: one `apply` recipe (`just up-monitoring`),
# with the components it carries. `source` says so out loud, so a client never
# mistakes this for the declared-module list that replaces it.
[ops."module.list"]
title = "The modules on this box, and the components each carries"
http = "GET /-/api/v1/modules"
role = "viewer"
effect = "read"
confirm = "none"
callers = ["web", "cli", "mcp", "system"]
mcp = { tool = "bothy_module_list", scope = "read" }
cli = "module list"
audit = "v1.module.list"
idempotent = true
output = { type = "object", required = ["source", "modules"], properties = { source = { type = "string", enum = ["update-catalog"] }, modules = { type = "array", items = { type = "object", required = ["id", "recipe", "runtime", "components"], properties = { id = { type = "string" }, recipe = { type = "string" }, runtime = { type = "string", enum = ["compose", "k3s"] }, components = { type = "array", items = { type = "string" } } } } } } }

