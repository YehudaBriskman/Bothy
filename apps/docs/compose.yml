name: docs

# Markdown VIEWER for every .md under ~/ (projects + claude-notes + stacks).
# MkDocs Material renders a curated mirror (content/) that a sidecar keeps synced
# one-way from the real files (node_modules/caches excluded). HTTP-native (unlike
# SilverBullet, which requires HTTPS/localhost). Read-only — edit the source files
# and they update here within ~15s. Routed at docs.dev.test, behind the stack SSO,
# discovered by the portal. Replaced Wiki.js.

services:
  docs:
    image: squidfunk/mkdocs-material:9
    container_name: docs
    restart: unless-stopped
    working_dir: /docs
    command: serve --dev-addr=0.0.0.0:8000 --dirtyreload
    ports:
      # Direct host port for pure-IP access (Host routing is dormant while the
      # custom DNS is retired; 8000 itself is held by a Tals host process).
      - "8085:8000"
    volumes:
      - ./mkdocs.yml:/docs/mkdocs.yml:ro
      - ./content:/docs/content:ro
    labels:
      - traefik.enable=true
      - traefik.http.services.docs.loadbalancer.server.port=8000
      - traefik.http.routers.docs.rule=Host(`docs.dev.test`)
      - traefik.http.routers.docs.entrypoints=web
      - traefik.http.routers.docs.service=docs
      - dev.portal.project=Docs
      - dev.portal.name=Docs
      - dev.portal.icon=📚
      - dev.portal.desc=Every ~/ markdown doc, rendered (MkDocs Material). Read-only; auto-updates from the source files.
    deploy:
      resources:
        limits:
          memory: 256m
    networks: [devnet]

  # One-way mirror: real dirs -> content/ (read-only for the viewer). Run as devssh
  # (1000) so content/ files are user-owned; sources mounted :ro (never written).
  sync:
    # pinned by digest — the repo's own rule is never :latest, and this was the
    # last holdout. This digest is the image already running here, so pinning it
    # changes nothing at runtime. Dependabot proposes bumps.
    image: eeacms/rsync@sha256:733f33d3b58c196e11daa03d884765e9b39cd69d1c07ef0b9d2519eb6d5512e2
    container_name: docs-sync
    restart: unless-stopped
    user: "1000:1000"
    entrypoint: ["/bin/sh", "-c"]
    command: ["while true; do sh /sync.sh 2>/dev/null; sleep 15; done"]
    volumes:
      - ./sync.sh:/sync.sh:ro
      - /home/devssh/projects:/src/projects:ro
      - /home/devssh/claude-notes:/src/claude-notes:ro
      - /home/devssh/stacks:/src/stacks:ro
      - ./content:/dest
    deploy:
      resources:
        limits:
          memory: 64m
    networks: [devnet]

networks:
  devnet:
    external: true
