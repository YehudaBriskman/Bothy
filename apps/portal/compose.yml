name: portal

services:
  portal:
    image: nginx:alpine
    container_name: portal
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./html:/usr/share/nginx/html:ro
    deploy:
      resources:
        limits:
          memory: 64m
    networks: [devnet]

networks:
  devnet:
    external: true
