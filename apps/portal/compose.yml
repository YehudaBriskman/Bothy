name: portal

services:
  portal:
    image: nginx:alpine
    container_name: portal
    restart: unless-stopped
    # No published port on purpose - Traefik (edge/compose.yml) owns :80 and
    # routes here by Host. This container is now unreachable except through the
    # edge, which is the point: it can never collide with another project again.
    volumes:
      - ./html:/usr/share/nginx/html:ro
      # no-cache for the static assets so live edits show without a hard-refresh
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      # Superseded by apps/portal-next (the Vite+React rewrite), which now owns
      # Host(dev.test) + the catch-all. This nginx no longer routes; the
      # socket-proxy below still runs (the new portal needs it for /-/api/docker).
      # To roll back: set this to true and stop portal-next.
      - traefik.enable=false

      # The router labels that used to live here are GONE (2026-08-12), not
      # commented out. They were already inert - `traefik.enable=false` above
      # means the docker provider never created them - but they were also wrong
      # twice over: they declared `Host(`dev.test`)` against a name layer that
      # was retired the same day, and they referenced `sso-errors@file,sso@file`,
      # middlewares that stopped existing when the SSO was parked on 2026-08-08.
      #
      # Leaving that behind would have been three kinds of misleading: a route
      # for a dead name, protected by a middleware that does not exist, on a
      # container that is switched off. If this service is ever un-retired it
      # needs writing against the current model anyway - a published port, or the
      # catch-all pattern that apps/portal-next now owns.
      #
      # THIS SERVICE STAYS DEFINED AND RUNNING regardless: it owns
      # `portal-socket-proxy` below, which is what serves the live portal's
      # read-only Docker API through edge/dynamic/portal-api.yml. Stopping this
      # compose file breaks the Overview. See the justfile's up-apps comment.
    deploy:
      resources:
        limits:
          memory: 64m
    networks: [devnet]

  # ── The portal's read-only view of Docker ────────────────────────────────
  # The portal page discovers what's running (ports, health, projects) instead
  # of being a hand-written list. Traefik's API knows routes but not ports or
  # health - only Docker does. nginx must NEVER touch the socket (it's
  # root-equivalent), so this proxy stands in front of it.
  #
  # SECURITY - read this before changing anything here:
  #
  #  • CONTAINERS=1 does NOT mean "only /containers/json". docker-socket-proxy
  #    gates by endpoint FAMILY, so it also permits /containers/{id}/json -
  #    whose response includes Env, i.e. POSTGRES_PASSWORD and the Grafana admin
  #    password. The actual boundary is the exact Path() rule in
  #    ../../edge/dynamic/portal-api.yml. Never widen that to PathPrefix.
  #
  #  • POST=0 is load-bearing. Without it, CONTAINERS=1 also grants
  #    /containers/{id}/kill|stop|restart to anyone who can reach this.
  #
  #  • This is on socketnet, NOT devnet, and publishes no port. It has no auth
  #    of any kind, so reachability IS authorisation.
  #
  # What this exposes to the tailnet via /containers/json: container names,
  # images, ports, health, labels, Mounts (host paths) and Command (argv).
  # NOT Env. That's a home-dir-layout disclosure - acceptable on a personal
  # tailnet, NOT acceptable if dev.test ever reaches beyond it.
  #
  #  • SYSTEM=1 grants the /system family so the portal can read /system/df
  #    (per-image / per-container / per-volume disk usage - the "Data & disk"
  #    card). WHY THIS IS SAFE: /system/df returns the SAME categories already
  #    exposed by /containers/json (names, images, labels, command, mounts) plus
  #    SIZE numbers - it carries NO Env and no new secret-bearing field. It is
  #    also read-only (POST=0 still blocks every mutating /system endpoint). As
  #    with CONTAINERS, the real boundary is the exact Path() rule in
  #    ../../edge/dynamic/portal-api.yml - only /-/api/docker/system/df is
  #    routed; nothing else under /system is reachable from the tailnet.
  socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0   # pinned: never :latest for a socket holder
    container_name: portal-socket-proxy
    restart: unless-stopped
    environment:
      # The grants: container list (enrichment) + disk usage (Data & disk card).
      CONTAINERS: 1
      SYSTEM:    1   # /system/df only (POST=0 blocks every mutating /system call)
      # Deny-by-default is the image's behaviour, but a socket proxy is the last
      # place to trust a default surviving an image bump. Say it out loud.
      POST:         0   # no mutation, ever
      EXEC:         0   # container exec == root on this box
      EVENTS:       0   # we poll; shrink the surface
      PING:         0
      VERSION:      0
      AUTH:         0
      SECRETS:      0
      CONFIGS:      0
      IMAGES:       0
      INFO:         0
      NETWORKS:     0
      NODES:        0
      PLUGINS:      0
      SERVICES:     0
      SESSION:      0
      SWARM:        0
      TASKS:        0
      VOLUMES:      0
      DISTRIBUTION: 0
      BUILD:        0
      COMMIT:       0
    volumes:
      # :ro is the second lock. The proxy is the real boundary, but a writable
      # socket would leave POST=0 as the ONLY thing between the tailnet and root.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # NO ports: - must never be reachable from the host network.
    # NOT on devnet - see the security note above.
    networks: [socketnet]
    deploy:
      resources:
        limits:
          memory: 32m

networks:
  devnet:
    external: true
  socketnet:
    external: true
