# Portal is a live dashboard bind-mounted from ./html with no build step, so an
# edit to index.html / portal.js / portal.css should show up immediately. The
# default nginx image sends only ETag/Last-Modified, which lets a browser serve
# a stale cached module without revalidating - which is why a portal.js change
# needed a hard-refresh to appear. `no-cache` = the browser may cache but MUST
# revalidate first (via ETag), so a changed file returns 200 with fresh bytes and
# an unchanged one returns 304. Always current, on a normal reload.
#
# Static only: the /-/api/* endpoints are served by Traefik (edge/dynamic/
# portal-api.yml), never by this nginx - see ../compose.yml security notes.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
