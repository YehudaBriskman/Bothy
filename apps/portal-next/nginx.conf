# Static SPA. no-cache so a redeploy shows immediately (same policy as the portal).
# /-/api/* is served by Traefik (edge/dynamic/portal-api.yml), never by nginx.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── user themes, listed rather than registered ──────────────────────────
    #
    # A theme a PERSON added is a .css file dropped into this directory on the
    # host (apps/portal-next/data/themes, bind-mounted). It has to work for
    # somebody who downloaded Bothy and runs it - no source tree, no npm, no
    # rebuild - so it cannot live in the bundle, and it must survive `up --build`.
    # A bind mount is the only thing that satisfies both.
    #
    # autoindex_format json turns the directory itself into the index. The
    # alternative was an index.json listing every theme, and that is a second
    # file to keep in step with the first: drop in a .css, forget the JSON, and
    # the theme silently does not exist. Here the filesystem IS the list.
    #
    # `try_files` is deliberately absent: the SPA fallback above would answer a
    # missing theme with index.html, and the client would try to parse a page of
    # HTML as CSS. A 404 is the honest answer and the loader handles it.
    location /data/themes/ {
        alias /usr/share/nginx/html/data/themes/;
        autoindex on;
        autoindex_format json;
        add_header Cache-Control "no-cache";
        # A SIBLING location, so it inherits none of the headers set on `/` -
        # nginx's add_header does not cascade across locations. The CSP is not
        # wanted here (this serves a stylesheet, not a document) but nosniff is:
        # these files are written by a person, and a .css whose bytes look like
        # something else must not be re-interpreted as that something else.
        add_header X-Content-Type-Options "nosniff";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";

        # ── CSP, and the threat it is actually for ──────────────────────────
        #
        # NOT an internet attacker: this box is tailnet-only. The realistic path
        # is a COMPROMISED FRONTEND DEPENDENCY. This page pulls CodeMirror,
        # three.js, lucide and their trees, and that code runs INSIDE the
        # authenticated origin - it can call /write with the session cookie and
        # read every response the JSON API gives back. A malicious postinstall or
        # a hijacked patch release is the whole attack, and no amount of care in
        # this repository's own code prevents it.
        #
        # CSP does not stop that code running. What it stops is the useful half:
        # exfiltration. `connect-src 'self'` means the collected bytes have
        # nowhere to go, and `script-src` with no 'unsafe-inline' means a stored
        # string cannot become a second stage.
        #
        # WHY A HASH AND NOT 'unsafe-inline'. index.html carries one inline
        # script - the pre-paint theme stamp, which must run before React mounts
        # or a light-mode user gets a dark flash. Allowing 'unsafe-inline' for
        # that one script would also allow every injected one, which is most of
        # what a CSP is for. The hash allows exactly that script and nothing
        # else. IT WILL DRIFT: edit the script and the theme stamp silently stops
        # running. checks/csp_hash.mjs fails the build when it does.
        #
        # WHY $host AND NOT THE BOX IP. Raw bytes live on the sandbox origin,
        # port 8100, and the client builds that URL from location.hostname
        # precisely because this box answers on the tailnet IP, on localhost, and
        # on whatever else forwards to it. A literal IP here would break every
        # address but one - the exact bug lib/files.ts warns about. nginx
        # rejects a malformed Host before this is interpolated, so the value can
        # only ever be a syntactically valid host.
        #
        # frame-src/img-src/media-src reach the sandbox because that is where SVG,
        # HTML, PDF, images and video are served from. connect-src deliberately
        # does NOT: no script here ever fetches those bytes, it only points an
        # element at them, and a fetch() to the sandbox would hand a hostile
        # document's bytes to this origin's JavaScript.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-swg2nI8aBMzvV3t84exM+Tsz7mFjKORHPpdwMTCyJWs='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http://$host:8100; media-src 'self' blob: http://$host:8100; frame-src http://$host:8100; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";
        # style-src keeps 'unsafe-inline' and cannot lose it yet: CodeMirror
        # injects its theme as a <style> element at runtime (style-mod), and
        # React writes inline style attributes for the pane sizes. Stated rather
        # than left to look like an oversight - CSS injection is a real but much
        # narrower problem than script injection.

        add_header X-Content-Type-Options "nosniff";
        # The portal links out to Grafana, Portainer and the rest. no-referrer
        # keeps this box's paths out of their logs; strict-origin would still
        # leak the origin, which is the interesting half on a private network.
        add_header Referrer-Policy "no-referrer";
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()";
    }
}
