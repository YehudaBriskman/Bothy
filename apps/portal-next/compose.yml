name: portal-next

# Vite+React rewrite of the portal, served as a static build behind Traefik. It
# is THE portal now (the pure-HTML apps/portal was retired). The the name layer name
# layer is gone, so it is served on the bare tailnet IP - http://100.117.176.85/
# - by the catch-all router below, which is the only route it has left.

services:
  portal-next:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portal-next
    restart: unless-stopped
    volumes:
      # Written by the host-side collector (../portal-collector), which resolves
      # each project's project.dev.yml against real host state. Bind-mounted
      # rather than baked into the image because it changes every minute and the
      # image does not. Read-only: the portal renders it, never writes it, and an
      # absent file simply means no declared projects.
      - ./data:/usr/share/nginx/html/data:ro
    labels:
      - traefik.enable=true
      - traefik.http.services.portal-next.loadbalancer.server.port=80
      # ONE router, and it is the catch-all. The Host(the name layer) router that
      # used to sit here was removed on 2026-08-12 with the rest of the name
      # layer: it matched a hostname that has not resolved since 2026-08-08, so
      # it was answering nothing.
      #
      # This is now the ONLY route the portal has, which makes it load-bearing:
      # it is what serves http://<tailnet-ip>/ . Priority 1 keeps it below every
      # real rule, so the host-less exact-Path() /-/api/* routes at priority 100
      # (edge/dynamic/portal-api.yml, portal-prom.yml) still win over it - that
      # ordering is why the SPA and its data plane can share one origin.
      #
      # Do not delete it, and do not give it a Host rule.
      - traefik.http.routers.portal-next-fallback.rule=PathPrefix(`/`)
      - traefik.http.routers.portal-next-fallback.priority=1
      - traefik.http.routers.portal-next-fallback.entrypoints=web
      - traefik.http.routers.portal-next-fallback.service=portal-next
    deploy:
      resources:
        limits:
          memory: 64m
    networks: [devnet]

networks:
  devnet:
    external: true
