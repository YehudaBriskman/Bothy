name: wiki

services:
  wiki:
    image: ghcr.io/requarks/wiki:2
    container_name: wiki
    # No Traefik router: the *.dev.test name layer was retired permanently, so
    # the Host(`wiki.dev.test`) route had nothing left to match. Reached
    # directly on published port 3001.
    restart: unless-stopped
    environment:
      DB_TYPE: postgres
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: wiki
      DB_PASS: ${WIKI_DB_PASSWORD:?set WIKI_DB_PASSWORD in .env}
      DB_NAME: wiki
    ports:
      - "3001:3000"
    deploy:
      resources:
        limits:
          memory: 768m
    networks: [devnet]

networks:
  devnet:
    external: true
