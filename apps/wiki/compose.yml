name: wiki

services:
  wiki:
    image: ghcr.io/requarks/wiki:2
    container_name: wiki
    labels:
      - traefik.enable=true
      - traefik.http.routers.wiki.rule=Host(`wiki.dev.test`)
      - traefik.http.routers.wiki.entrypoints=web
      - traefik.http.routers.wiki.service=wiki
      - traefik.http.services.wiki.loadbalancer.server.port=3000
    restart: unless-stopped
    environment:
      DB_TYPE: postgres
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: wiki
      DB_PASS: ${WIKI_DB_PASSWORD:?set WIKI_DB_PASSWORD in .env}
      DB_NAME: wiki
    ports:
      - "3001:3000"
    deploy:
      resources:
        limits:
          memory: 768m
    networks: [devnet]

networks:
  devnet:
    external: true
