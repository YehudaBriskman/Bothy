
# WHAT THIS FILE IS NOW: the socket proxy, and nothing else.
#
# It used to also run the original pure-HTML portal on nginx, kept as a one-line
# rollback after apps/portal-next replaced it (`traefik.enable=false`, roll back
# by flipping it to true). That rollback was deleted on 2026-08-17 and the
# reasoning is worth keeping, because "keep it, it costs nothing" is how it
# survived this long:
#
#   · It cost 64 MB and a running container to serve nothing. Traefik has not
#     routed to it since portal-next took the catch-all.
#   · The rollback was a fiction. The HTML it served was written against
#     hostnames that no longer resolve, and its
#     portal.js carried its own copy of the name tables. Flipping the label
#     would have restored a portal whose every link was dead, so the thing being
#     "kept for safety" could not have been safely used.
#   · It held ten references to the dead namespace, in a file nobody
#     read because nobody served it.
#
# The container was called `portal-socket-proxy` until 2026-08-19 - named after
# that same dead nginx portal, and the last thing in the repo still pointing at
# it. Renamed to `bothy-socket-proxy` in #97. `container_name` is IMMUTABLE on a
# running container, so this file and the daemon disagree until somebody runs
# `docker compose up -d --force-recreate socket-proxy` in project `bothy`; every
# consumer of the name accepts both while that is true.


services:

  # ── The portal's read-only view of Docker ────────────────────────────────
  # The portal page discovers what's running (ports, health, projects) instead
  # of being a hand-written list. Traefik's API knows routes but not ports or
  # health - only Docker does. nginx must NEVER touch the socket (it's
  # root-equivalent), so this proxy stands in front of it.
  #
  # SECURITY - read this before changing anything here:
  #
  #  • CONTAINERS=1 does NOT mean "only /containers/json". docker-socket-proxy
  #    gates by endpoint FAMILY, so it also permits /containers/{id}/json -
  #    whose response includes Env, i.e. POSTGRES_PASSWORD and the Grafana admin
  #    password. The actual boundary is the exact Path() rule in
  #    ../../edge/dynamic/portal-api.yml. Never widen that to PathPrefix.
  #
  #  • POST=0 is load-bearing. Without it, CONTAINERS=1 also grants
  #    /containers/{id}/kill|stop|restart to anyone who can reach this.
  #
  #  • This is on socketnet, NOT devnet, and publishes no port. It has no auth
  #    of any kind, so reachability IS authorisation.
  #
  # What this exposes to the tailnet via /containers/json: container names,
  # images, ports, health, labels, Mounts (host paths) and Command (argv).
  # NOT Env. That's a home-dir-layout disclosure - acceptable on a personal
  # tailnet, NOT acceptable if this box ever reaches beyond it.
  #
  #  • SYSTEM=1 grants the /system family so the portal can read /system/df
  #    (per-image / per-container / per-volume disk usage - the "Data & disk"
  #    card). WHY THIS IS SAFE: /system/df returns the SAME categories already
  #    exposed by /containers/json (names, images, labels, command, mounts) plus
  #    SIZE numbers - it carries NO Env and no new secret-bearing field. It is
  #    also read-only (POST=0 still blocks every mutating /system endpoint). As
  #    with CONTAINERS, the real boundary is the exact Path() rule in
  #    ../../edge/dynamic/portal-api.yml - only /-/api/docker/system/df is
  #    routed; nothing else under /system is reachable from the tailnet.
  socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0   # pinned: never :latest for a socket holder
    # THIS NAME IS AN API, not a label. Three things match on it by string and
    # none of them can be discovered from here:
    #   · edge/dynamic/portal-api.yml dials `http://bothy-socket-proxy:2375`
    #     over socketnet by Docker DNS. Change one without the other and
    #     /-/api/docker/containers/json 502s and every Overview enrichment goes
    #     blank.
    #   · apps/portal-next/web/src/lib/actions.ts's SELF map keys the foot-gun
    #     warning on it, and a miss there fails OPEN - the warning vanishes
    #     silently rather than erroring.
    #   · scripts/doctor.sh checks it by name.
    # It is NOT in bothy-control's guard.SEVERING and never was; see the comment
    # in apps/bothy/compose.yml for why that list is deliberately narrower.
    container_name: bothy-socket-proxy
    restart: unless-stopped
    environment:
      # The grants: container list (enrichment) + disk usage (Data & disk card).
      CONTAINERS: 1
      SYSTEM:    1   # /system/df only (POST=0 blocks every mutating /system call)
      # Deny-by-default is the image's behaviour, but a socket proxy is the last
      # place to trust a default surviving an image bump. Say it out loud.
      POST:         0   # no mutation, ever
      EXEC:         0   # container exec == root on this box
      EVENTS:       0   # we poll; shrink the surface
      PING:         0
      VERSION:      0
      AUTH:         0
      SECRETS:      0
      CONFIGS:      0
      IMAGES:       0
      INFO:         0
      NETWORKS:     0
      NODES:        0
      PLUGINS:      0
      SERVICES:     0
      SESSION:      0
      SWARM:        0
      TASKS:        0
      VOLUMES:      0
      DISTRIBUTION: 0
      BUILD:        0
      COMMIT:       0
    volumes:
      # :ro is the second lock. The proxy is the real boundary, but a writable
      # socket would leave POST=0 as the ONLY thing between the tailnet and root.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # NO ports: - must never be reachable from the host network.
    # NOT on devnet - see the security note above.
    networks: [socketnet]
    deploy:
      resources:
        limits:
          memory: 32m

networks:
  devnet:
    external: true
  socketnet:
    external: true
