# Bothy - one compose project, five containers.
#
#   bothy-web           nginx; the portal on :80. No power.
#   bothy-files         the file editor AND the config forms. Read-write on the
#                       stack repo and the notes, read-only on $HOME and projects.
#   bothy-ops           container actions AND cluster actions. Reaches the daemon
#                       only through the two proxies below; holds the kube token.
#   bothy-socket-read   CONTAINERS=1 SYSTEM=1 POST=0 - the portal's Docker API and
#                       bothy-ops' inspects.
#   bothy-socket-write  CONTAINERS=0 POST=1, three verbs - bothy-ops only.
#
# It was eight until 2026-09 (bothy-config, bothy-control, bothy-kube and three
# proxies, in four projects). The merge removed duplicated code and containers;
# it did NOT remove a boundary. Read the headers of the fragments for the ones
# that stayed: the read/write proxy split, one inbound network per service that
# authenticates nobody (filesnet, opsnet), and exact Path() routes at the edge.
#
# Bothy groups systems by com.docker.compose.project, so one project renders as
# one card in its own Overview.
#
# The cluster is OPTIONAL: `just up-apps` adds ../bothy-ops/compose.cluster.yml
# only when minikube's `thales-scc` network exists. Use the recipe.
#
# ── WHY `include:` AND NOT `-f a.yml -f b.yml` ───────────────────────────────
# Tried the multi-file form first, on 2026-08-16, and it broke bothy-files.
#
# With repeated `-f`, EVERY relative path in EVERY file resolves against the
# FIRST file's directory — not against the file that wrote it. So
# bothy-files' `build: context:` resolved to apps/bothy-web/ and built the WEB
# tier's Dockerfile: the editor tier came up as nginx and crash-looped. Its
# `./audit:/audit:rw` mount had likewise moved to apps/bothy-web/audit, so the
# write log would have silently stopped accumulating where anything looks.
#
# `include:` resolves each fragment's paths against ITS OWN directory, which is
# exactly the difference that matters here. It is also why this file is a stub
# rather than a merge: each fragment carries the isolation rationale for a tier,
# and those tiers are NOT alike. (compose.cluster.yml is the one file that IS
# added with -f, and it spells its one path so that it resolves either way.)
#
# DO NOT `docker compose down` this project casually: it takes the socket proxy
# the portal reads through down with it, and the portal's Overview goes blank.

name: bothy

include:
  - path: ../bothy-web/compose.yml
  - path: ../bothy-files/compose.yml
  - path: ../bothy-ops/compose.yml
  - path: ./socket-proxy.yml
