# The two docker socket proxies, and NOTHING ELSE holds the docker socket.
#
# There were three until 2026-09: bothy-socket-proxy (the portal's read-only
# Docker API) in this file, and bothy-control-socket-read / -write in
# apps/bothy-control/compose.yml. The two READ proxies had the same grant model
# (POST=0) and differed by one flag, SYSTEM, so they are one container now:
#
#   bothy-socket-read    CONTAINERS=1 SYSTEM=1 POST=0   traefik (socketnet) and
#                                                        bothy-ops (controlsocknet)
#   bothy-socket-write   CONTAINERS=0 POST=1            bothy-ops only
#                        ALLOW_RESTARTS/START/STOP=1
#
# The WRITE proxy is unchanged and stays its own container. That split is the
# load-bearing one, and the next section is why.
#
# ── the constraint this file exists to satisfy ──────────────────────────────
#
# NEVER set POST=1 on a proxy with CONTAINERS=1. The image is
# tecnativa/docker-socket-proxy, whose haproxy rules are, in order:
#
#     http-request deny unless METH_GET || { env(POST) -m bool }
#     http-request allow if { path ~ /containers/<name>/(stop|restart|kill) } { env(ALLOW_RESTARTS) }
#     http-request allow if { path ~ /containers/<name>/start }              { env(ALLOW_START) }
#     http-request allow if { path ~ /containers/<name>/stop }               { env(ALLOW_STOP) }
#     ... one line per endpoint family ...
#     http-request allow if { path ~ ^/containers }                          { env(CONTAINERS) }
#     http-request deny
#
# The granular ALLOW_* rules are ADDITIVE - `allow` lines, with the broad
# `^/containers` line below them and no deny in between. So POST=1 together
# with CONTAINERS=1 permits every POST under /containers, /containers/create
# included, and a create with a bind mount of / is root on this box. That is the
# rule text, read out of tecnativa/docker-socket-proxy:0.3.0.
#
# So neither proxy can do the dangerous thing:
#
#   read    POST=0 denies every non-GET on the FIRST line, before any allow rule
#           runs. It can inspect; it cannot mutate anything.
#   write   CONTAINERS=0, so with POST=1 the only allow rules that can match are
#           the three verb regexes. It cannot create, cannot inspect, cannot
#           list, cannot read an Env. It is not a docker API; it is four buttons.
#
# A total compromise of bothy-ops still cannot create a privileged container,
# because the PROXY refuses /containers/create - not bothy-ops' Python.
#
# The one gap, named rather than hidden: ALLOW_RESTARTS grants `kill` alongside
# `stop` and `restart` (one regex, no way to split them). `kill` is refused by
# guard.VERBS in apps/bothy-ops, the one grant on this box bounded by code
# rather than by an environment variable. apps/bothy-ops/checks/grants.py
# asserts both halves of that sentence, and sweeps EVERY compose file in the
# repo for a proxy holding POST=1 and CONTAINERS=1 together.
#
# ── networks: nothing that can reach the write proxy can reach Traefik ──────
#
#   socketnet        traefik + bothy-socket-read
#   controlsocknet   bothy-ops + bothy-socket-read + bothy-socket-write
#
# bothy-socket-read sits on both, and that is the one new adjacency the merge
# created. It is safe for the reason every other one is: that proxy has POST=0,
# so nothing that reaches it - Traefik, bothy-ops - can mutate anything through
# it. What must stay true, and does: Traefik is NOT on controlsocknet, so the
# edge cannot reach a proxy that can stop a container. "It is not configured to"
# is weaker than "it cannot", and the network is what makes it the second.
#
#   DO NOT put either proxy on devnet. ~20 containers live there, including
#   third-party images; every one would get the socket. Nothing would warn you.
#
# ── what the READ proxy exposes to the tailnet, via Traefik ─────────────────
#
# Only what edge/dynamic/bothy-api.yml routes, and that is TWO exact Path()
# rules: /containers/json and /system/df. CONTAINERS=1 does NOT mean "only
# /containers/json" - the proxy gates by endpoint FAMILY, so it also permits
# /containers/{id}/json, whose body includes Env (POSTGRES_PASSWORD, the Grafana
# admin password). The exact Path() at the edge is the whole control there;
# never widen it to PathPrefix.
#
# What those two expose: container names, images, ports, health, labels, Mounts
# (host paths), Command (argv), and per-volume/image disk sizes. NOT Env. A
# home-dir-layout disclosure - acceptable on a personal tailnet, NOT if this box
# ever reaches beyond it.
#
# SYSTEM=1 grants the /system family so the portal can read /system/df (the
# Data & disk card). /system/df returns the SAME categories /containers/json
# already exposes plus SIZE numbers - no Env, no new secret-bearing field - and
# POST=0 blocks every mutating /system call. bothy-ops gained the ability to read
# /system/df by sharing this proxy; it never asks, and there is nothing in it it
# could not already read through /containers.
#
# ── THESE NAMES ARE AN API, not labels ──────────────────────────────────────
#
#   · edge/dynamic/bothy-api.yml dials http://bothy-socket-read:2375 by Docker
#     DNS. Change one without the other and every Overview enrichment goes blank.
#   · apps/bothy-ops/compose.yml sets DOCKER_READ / DOCKER_WRITE to these names.
#   · apps/bothy-ops/guard.py's SEVERING refuses stop/restart on both, and
#     checks/grants.py asserts the names there and here agree.
#   · apps/bothy-web/web/src/lib/actions.ts's SELF map warns on both, and a miss
#     there fails OPEN.
#   · scripts/doctor.sh checks both by name.

services:

  socket-read:
    image: tecnativa/docker-socket-proxy:0.3.0   # pinned: never :latest for a socket holder
    container_name: bothy-socket-read            # guard.SEVERING names this. Keep in sync.
    restart: unless-stopped
    environment:
      CONTAINERS:     1   # the portal's container list; bothy-ops' inspects
      SYSTEM:         1   # /system/df only - see the header
      # Deny-by-default is the image's behaviour, but a socket proxy is the last
      # place to trust a default surviving an image bump. Say it out loud - and
      # note three of these are NOT the image's defaults: EVENTS, PING and
      # VERSION ship as 1 in 0.3.0. checks/grants.py asserts every one.
      POST:           0   # no mutation, ever. The first rule, above all others.
      EXEC:           0   # container exec == root on this box
      ALLOW_RESTARTS: 0   # inert with POST=0; stated so it stays inert
      ALLOW_START:    0
      ALLOW_STOP:     0
      EVENTS:         0   # image default is 1 - we poll; shrink the surface
      PING:           0   # image default is 1
      VERSION:        0   # image default is 1
      AUTH:           0
      SECRETS:        0
      CONFIGS:        0
      IMAGES:         0
      INFO:           0
      NETWORKS:       0
      NODES:          0
      PLUGINS:        0
      SERVICES:       0
      SESSION:        0
      SWARM:          0
      TASKS:          0
      VOLUMES:        0
      DISTRIBUTION:   0
      BUILD:          0
      COMMIT:         0
      GRPC:           0
    volumes:
      # :ro is the second lock. The proxy is the real boundary, but a writable
      # socket would leave POST=0 as the ONLY thing between these networks and root.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # NO ports: - must never be reachable from the host network.
    networks: [socketnet, controlsocknet]
    labels:
      - traefik.enable=false
    # Proves haproxy answers, and nothing more. PING=0 makes /_ping a 403, so any
    # HTTP status line is the pass - a refused connection never prints one.
    # Probing an ALLOWED path would mean granting an endpoint just for the check.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null -T 3 http://127.0.0.1:2375/_ping 2>&1 | grep -q 'HTTP/'"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 32m

  socket-write:
    image: tecnativa/docker-socket-proxy:0.3.0   # pinned: never :latest for a socket holder
    container_name: bothy-socket-write           # guard.SEVERING names this. Keep in sync.
    restart: unless-stopped
    environment:
      POST:           1   # the only POST=1 socket proxy on this box
      ALLOW_RESTARTS: 1   # /containers/<name>/(stop|restart|kill)
      ALLOW_START:    1   # /containers/<name>/start
      ALLOW_STOP:     1   # /containers/<name>/stop
      # CONTAINERS=0 is what makes POST=1 safe here. It is not a leftover.
      # Setting it to 1 would silently grant /containers/create - a bind mount
      # of / and this box is owned - and nothing would look different.
      CONTAINERS:     0
      EXEC:           0   # container exec == root on this box
      EVENTS:         0   # image default is 1
      PING:           0   # image default is 1
      VERSION:        0   # image default is 1
      AUTH:           0
      SECRETS:        0
      CONFIGS:        0
      IMAGES:         0
      INFO:           0
      NETWORKS:       0
      NODES:          0
      PLUGINS:        0
      SERVICES:       0
      SESSION:        0
      SWARM:          0
      SYSTEM:         0
      TASKS:          0
      VOLUMES:        0
      DISTRIBUTION:   0
      BUILD:          0
      COMMIT:         0
      GRPC:           0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # NO ports: - never reachable from the host network. The only thing that may
    # reach it is bothy-ops, and controlsocknet is what says so.
    networks: [controlsocknet]
    labels:
      - traefik.enable=false
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null -T 3 http://127.0.0.1:2375/_ping 2>&1 | grep -q 'HTTP/'"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 32m

networks:
  socketnet:
    external: true
  controlsocknet:
    name: controlsocknet
    external: true
