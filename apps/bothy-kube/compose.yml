name: bothy-kube

# bothy-kube: OpenShift-console-style verbs on the local Kubernetes cluster -
# rollout restart, scale, events, logs, delete completed pods - for the two
# namespaces in guard.NAMESPACES and nothing else.
#
# ── the tier, and why it is a separate one ──────────────────────────────────
#
# bothy-control acts on CONTAINERS through socket proxies. This acts on
# WORKLOADS through the Kubernetes API, with a credential scoped by the
# cluster's own RBAC. The two share no network, process or credential: a
# compromise of either reaches exactly what that one could already do.
#
# ── networks ────────────────────────────────────────────────────────────────
#
#   kubenet      traefik + bothy-kube, and nothing else. The way IN. This
#                service authenticates nobody, so on the controlnet precedent
#                the network IS the authorisation. Never devnet.
#   thales-scc   minikube's own docker network (profile `thales-scc`), where the
#                apiserver listens on 192.168.49.2:8443. The way OUT. Created by
#                minikube, not by this repo - it exists only while the cluster
#                does, which is why this file is not in `just up-apps`: a box
#                with no cluster must still come up.
#
# Traefik is deliberately NOT on thales-scc. It never needs to reach the
# apiserver, so it cannot.
#
# BEFORE FIRST RUN:
#     just network        # creates kubenet (idempotent)
#     just kube-token     # writes ./secrets/{token,ca.crt}, mode 600
#
# ── the credential ──────────────────────────────────────────────────────────
#
# ./secrets holds a ServiceAccount token and the cluster CA, written by
# scripts/gen-kube-token.sh and gitignored. Mounted READ-ONLY, and with
# create_host_path: false, so a missing directory fails `up` loudly instead of
# docker creating an empty root-owned one and the tier silently answering 503.

services:
  bothy-kube:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bothy-kube
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp
    environment:
      PORT: 8098
      AUDIT_LOG: /audit/actions.log
      # Verified 2026-09-17: `kubectl config view` for context thales-scc and
      # `docker inspect thales-scc` both give 192.168.49.2, port 8443, and the
      # serving cert carries that IP as a SAN - so TLS verification stays on.
      KUBE_API: https://192.168.49.2:8443
      KUBE_TOKEN_FILE: /secrets/token
      KUBE_CA_FILE: /secrets/ca.crt
    volumes:
      - type: bind
        source: ./secrets
        target: /secrets
        read_only: true
        bind:
          create_host_path: false
      - ./audit:/audit:rw
    # NO ports: - never reachable from the host network. The only way in is
    # Traefik on kubenet, behind sso-viewer / sso-operator.
    networks:
      - kubenet
      - thales-scc
    labels:
      # No traefik.* router labels ON PURPOSE: the routes are the exact Path()
      # rules in edge/dynamic/bothy-kube.yml, each with its role middleware. An
      # auto-generated router would be an unauthenticated way to scale pre-prod.
      - traefik.enable=false
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8098/healthz',timeout=2).status==200 else 1)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 64m

networks:
  kubenet:
    name: kubenet
    external: true
  thales-scc:
    name: thales-scc
    external: true
