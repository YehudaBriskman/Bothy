<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="dark" />
    <title>BothyBox sky scenes</title>
    <meta
      name="description"
      content="Slice S6 gallery: seven sky-only backdrops from real photographs, graded by the hour table and moved by the pointer."
    />
    <link rel="icon" href="data:," />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        block-size: 100%;
        background: #0a0c10;
        color: #f7f5ef;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        overflow: hidden;
      }
      .stage {
        position: fixed;
        inset: 0;
        background: linear-gradient(to bottom, var(--sky-top, #05091a), var(--sky-bot, #1c2e56)) center / cover;
      }
      canvas {
        position: absolute;
        inset: 0;
        inline-size: 100%;
        block-size: 100%;
        opacity: 0;
        transition: opacity 0.35s ease;
      }
      canvas.on {
        opacity: 1;
      }
      .halo {
        position: absolute;
        inset: 0;
        pointer-events: none;
        mix-blend-mode: screen;
        background: radial-gradient(
          circle at var(--hx) var(--hy),
          transparent calc(var(--hr) - 26px),
          rgba(255, 190, 170, calc(var(--ha) * 0.55)) calc(var(--hr) - 10px),
          rgba(255, 248, 228, var(--ha)) var(--hr),
          rgba(190, 215, 255, calc(var(--ha) * 0.55)) calc(var(--hr) + 12px),
          transparent calc(var(--hr) + 30px)
        );
      }
      .halo[hidden] {
        display: none;
      }
      /* The caption and controls sit on a soft scrim so they read on every photograph at every hour. */
      .ui {
        position: fixed;
        inset-inline: 0;
        inset-block-end: 0;
        padding: 56px 16px 14px;
        background: linear-gradient(to top, rgba(6, 9, 18, 0.72), rgba(6, 9, 18, 0));
        display: grid;
        gap: 10px;
      }
      .cap h1 {
        margin: 0;
        font-size: clamp(18px, 2.4vw, 26px);
        font-weight: 600;
        letter-spacing: 0.01em;
      }
      .cap p {
        margin: 4px 0 0;
        max-inline-size: 62ch;
        font-size: 14px;
        line-height: 1.45;
        color: rgba(247, 245, 239, 0.88);
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 16px;
        align-items: center;
        font-size: 13px;
        font-variant-numeric: tabular-nums;
      }
      .picker {
        display: flex;
        gap: 6px;
      }
      button {
        font: inherit;
        color: inherit;
        min-inline-size: 36px;
        min-block-size: 36px;
        padding: 0 12px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.32);
        background: rgba(8, 12, 22, 0.5);
        cursor: pointer;
      }
      button[aria-pressed='true'] {
        background: rgba(247, 245, 239, 0.92);
        color: #0a0c10;
      }
      button:focus-visible,
      input:focus-visible {
        outline: 2px solid #fff;
        outline-offset: 2px;
      }
      input[type='range'] {
        inline-size: min(52vw, 360px);
      }
      .sr {
        position: absolute;
        inline-size: 1px;
        block-size: 1px;
        overflow: hidden;
        clip-path: inset(50%);
      }
    </style>
  </head>
  <body>
    <main class="stage" id="stage">
      <canvas id="gl" aria-hidden="true"></canvas>
      <div class="halo" id="halo" hidden aria-hidden="true"></div>
      <h1 class="sr">Sky scenes: seven backdrops from real photographs</h1>
    </main>
    <div class="ui">
      <div class="cap" aria-live="polite">
        <h1 id="title">Sky scenes</h1>
        <p id="line"></p>
      </div>
      <div class="row">
        <div class="picker" id="picker" role="group" aria-label="Scene"></div>
        <label>
          <span class="sr">Hour of day</span>
          <input id="hour" type="range" min="0" max="23.99" step="0.05" />
        </label>
        <output id="hourOut">--:--</output>
        <button id="pause" type="button" aria-pressed="false">Pause motion</button>
        <span>keys 1 to 8, arrows; move the pointer across the sky</span>
      </div>
    </div>
    <script type="module" src="gallery.js"></script>
  </body>
</html>
