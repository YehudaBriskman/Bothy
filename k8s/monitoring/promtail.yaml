# Pod logs from thales-scc -> the box's Loki (the compose `loki`, host :3100).
#
# promtail, not alloy, so the cluster and the compose stack run the SAME shipper
# at the SAME version (monitoring/compose.yml, grafana/promtail:3.6.8): one
# config language, one set of gotchas. Move both to alloy together or not at all.
#
# ── LABELS, and why `container` is NOT one of them ─────────────────────────────
#   cluster        thales-scc   (client external_labels; every stream has it)
#   namespace      k8s namespace
#   pod            pod name
#   k8s_container  container name inside the pod
#   stream         stdout / stderr - same meaning as the compose promtail's
#   job            kubernetes-pods
#
# The compose promtail already owns `container` (a DOCKER container name) and
# `stack` (a compose project), and the portal builds its log panels as
# {container="<docker name>"} (portal-collector/collect.py, web/src/lib/discover.ts).
# Tals runs a `postgres` and a `keycloak` in the cluster and the box runs
# containers with those names too - so a k8s `container` label would silently
# pour cluster logs into the box's own log panels. `k8s_container` cannot
# collide; `namespace`/`pod`/`cluster` are unused by the compose side. `stream`
# IS shared, on purpose, because it means the same thing on both.
#
# ── WHERE LOKI IS ─────────────────────────────────────────────────────────────
# 192.168.49.1 is the docker gateway of the `thales-scc` network, i.e. the host,
# where loki publishes 0.0.0.0:3100. Verified from a pod in this namespace:
# both 192.168.49.1:3100 and host.minikube.internal:3100 answer /ready. The NAME
# is used: minikube writes it into CoreDNS on every start, so it follows the
# gateway if the network is ever re-created on another subnet.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: monitoring-promtail
rules:
  # kubernetes_sd role=pod: read pod metadata. Nothing else, no write verbs.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: monitoring-promtail
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: monitoring-promtail
subjects:
  - kind: ServiceAccount
    name: promtail
    namespace: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail
  namespace: monitoring
data:
  promtail.yml: |
    server:
      http_listen_port: 3101
      grpc_listen_port: 0

    # On a hostPath under /var (the node's persistent disk, NOT /run which is
    # tmpfs), for the reason compose.yml gives: positions that reset re-ship the
    # whole log history into Loki on every restart.
    positions:
      filename: /var/lib/promtail/positions.yaml

    clients:
      - url: http://host.minikube.internal:3100/loki/api/v1/push
        external_labels:
          cluster: thales-scc

    scrape_configs:
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        # The node runs dockerd behind cri-dockerd: /var/log/pods/*/*/N.log are
        # symlinks to /var/lib/docker/containers/<id>/<id>-json.log, so the
        # lines are docker JSON, not CRI format.
        pipeline_stages:
          - docker: {}
          # promtail adds `filename`, which embeds the pod UID and the restart
          # count (.../algorithm/2.log): a new stream per restart for no query
          # anyone writes. namespace/pod/k8s_container already say where.
          - labeldrop: [filename]
        relabel_configs:
          # Only this node's pods - a DaemonSet must not ship its neighbours'.
          # promtail itself drops any target whose __host__ differs from its
          # $HOSTNAME, which the DaemonSet sets to spec.nodeName.
          #
          # NOT a `selectors: field: spec.nodeName=${NODE_NAME}` with
          # -config.expand-env: that flag also expands the `$1` in the __path__
          # replacement below to "", the glob becomes /var/log/pods/*/*.log,
          # matches nothing, and promtail sits at 0 targets with no error
          # (it happened, 2026-09-17).
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: __host__
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: k8s_container
          - target_label: job
            replacement: kubernetes-pods
          - source_labels: [__meta_kubernetes_pod_uid, __meta_kubernetes_pod_container_name]
            separator: /
            target_label: __path__
            replacement: /var/log/pods/*$1/*.log
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: monitoring
  labels:
    app.kubernetes.io/name: promtail
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: promtail
  template:
    metadata:
      labels:
        app.kubernetes.io/name: promtail
      annotations:
        # Roll the pods when the config above changes (`just k8s-monitoring`
        # stamps the ConfigMap's hash here).
        checksum/config: "set-by-apply"
    spec:
      serviceAccountName: promtail
      tolerations:
        - operator: Exists   # the one node is the control plane
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: promtail
          image: grafana/promtail:3.6.8
          args:
            - -config.file=/etc/promtail/promtail.yml
          env:
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: http
              containerPort: 3101
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
          # uid 0 is needed to read the node's log files (0640 root:root, in
          # 0710 root dirs under /var/lib/docker/containers) - as their OWNER,
          # so no capability is: every one is dropped, including the
          # DAC_OVERRIDE / DAC_READ_SEARCH that would let it read anything else.
          securityContext:
            runAsUser: 0
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
            limits:
              memory: 192Mi
          volumeMounts:
            - name: config
              mountPath: /etc/promtail
              readOnly: true
            - name: pods
              mountPath: /var/log/pods
              readOnly: true
            - name: docker-containers
              mountPath: /var/lib/docker/containers
              readOnly: true
            - name: positions
              mountPath: /var/lib/promtail
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: promtail
        - name: pods
          hostPath:
            path: /var/log/pods
        - name: docker-containers
          hostPath:
            path: /var/lib/docker/containers
        - name: positions
          hostPath:
            path: /var/lib/promtail
            type: DirectoryOrCreate
        - name: tmp
          emptyDir: {}
