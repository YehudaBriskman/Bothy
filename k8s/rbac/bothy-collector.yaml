#   deployments  list
#                <- deployments: a namespace's services, and replicas ready/wanted -> up/starting/stuck/stopped
#   ingresses    list
#                <- ingresses: the same, on a cluster that has no Routes
#   routes       list
#                <- routes: the host a browser would use. An OpenShift kind; absent CRD is not an error
#
# ── why a ClusterRole, when bothy-kube deliberately has none ───────────────
