name: edge

# The single front door for everything on this box.
#
# Why this exists: host ports are a flat global namespace with no allocator, so
# every project reaches for 3000/8080/5432 and collides with whatever got there
# first. Traefik routes by Host header instead, so services stop competing for
# port numbers entirely - a new project publishes NO host port, it just declares
# a name. Names are infinite; ports are 65535 and everyone picks the same dozen.
#
# Consequence: this is the ONLY container that should ever publish :80, and the
# Tailscale/portproxy layer needs exactly one rule, forever.
#
# STATUS 2026-08-12: the `*.dev.test` name layer above is RETIRED, not merely
# dormant. Access is pure IP:port - http://100.117.176.85:<port>. Every
# Host(`*.dev.test`) router in the files this compose owns has been removed, and
# new services publish a host port rather than declaring a name. Traefik still
# earns its keep for the host-less exact-Path() routes that make up the portal's
# /-/api/* data plane (edge/dynamic/portal-api.yml, portal-prom.yml) and for the
# portal fallback on the bare IP. Do not write new Host() rules against a
# namespace that no longer resolves - the route will register and simply never
# match.

services:
  traefik:
    image: traefik:v3.7
    container_name: traefik
    restart: unless-stopped
    command:
      # Discover routes from container labels. exposedbydefault=false means a
      # container is invisible until it opts in with traefik.enable=true, so
      # nothing gets published by accident just by joining devnet.
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      # Containers sit on several networks (devnet, project-local, minikube).
      # Pin discovery to devnet or Traefik may pick the wrong container IP.
      - --providers.docker.network=devnet
      # File provider for things that AREN'T containers - host processes like
      # Tilt's UI have no labels to discover, so they're declared in ./dynamic.
      # watch=true picks up edits live; no Traefik restart needed to add a route.
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      # CAVEAT: watch=true only works while the bind mount below still resolves.
      # A bind mount pins the host inode at container-creation time, and git
      # checkout deletes and recreates ./dynamic - after any branch switch this
      # container keeps reading an orphaned, empty directory and silently serves a
      # stale in-memory config. It ran that way from 16 to 21 Jul with every edit
      # to ./dynamic having no effect. After any checkout:
      #   docker compose -f edge/compose.yml up -d --force-recreate
      - --entrypoints.web.address=:80
      # --api=true, NOT --api.dashboard=true (changed 2026-08-12).
      #
      # The API itself must stay on: edge/dynamic/portal-api.yml routes four
      # exact paths (/-/api/traefik/{http/routers,http/services,overview,version})
      # to `service: api@internal`, and that internal service only exists while
      # the API is enabled. Turning the API off entirely 404s the portal's
      # routes/services panels.
      #
      # The DASHBOARD flag is what additionally serves the UI's own assets and,
      # with it, the browsable api@internal surface. It is off because the
      # `dashboard` router that published it (Host(`traefik.dev.test`)) has been
      # removed - see the note where the labels used to be. Nothing on this box
      # needs the UI; the portal reads the four paths above instead.
      - --api=true
      - --log.level=INFO
      - --accesslog=true
      # Prometheus metrics for the edge - request rates, latencies and error
      # rates per router + service + entrypoint. Served on an INTERNAL entrypoint
      # with NO host port, so only Prometheus (on devnet) scrapes traefik:8899.
      - --entrypoints.metrics.address=:8899
      - --metrics.prometheus=true
      - --metrics.prometheus.entryPoint=metrics
      - --metrics.prometheus.addEntryPointsLabels=true
      - --metrics.prometheus.addServicesLabels=true
      - --metrics.prometheus.addRoutersLabels=true
    environment:
      # Traefik's bundled Docker SDK falls back to API v1.24 when it doesn't
      # negotiate, and this daemon (29.6.1, API 1.55) rejects anything below
      # 1.40 - the provider then silently loads no routes and every request
      # 404s. Pin a version inside the daemon's supported range.
      DOCKER_API_VERSION: "1.44"
    ports:
      - "80:80"
    volumes:
      # Read-only: Traefik only needs to watch the container list. The socket is
      # root-equivalent, so never mount it writable here.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./dynamic:/etc/traefik/dynamic:ro
    extra_hosts:
      # Lets the file-provider routes above reach processes on the host
      # (Tilt UI, and any future host-side dev server).
      - "host.docker.internal:host-gateway"
    # NO labels, and no traefik.enable - deliberately. Traefik has no router of
    # its own any more.
    #
    # CREDENTIAL EXPOSURE, fixed 2026-08-12. There used to be a `dashboard`
    # router here on Host(`traefik.dev.test`) with `service=api@internal` and no
    # middleware, i.e. the whole Traefik API served unauthenticated. The API
    # includes /api/rawdata, which dumps the entire merged dynamic config -
    # every router, service AND middleware, with their values. One of those
    # middlewares is `portal-api-prom-auth` (edge/dynamic/portal-prom.yml), whose
    # customRequestHeaders carry a LIVE `Authorization: Basic ...` for
    # Prometheus. Anything that could reach :80 - i.e. every device on the
    # tailnet - could read that credential by fetching one URL. Removing the
    # router is the fix; --api.dashboard=true -> --api=true above is the other
    # half of it.
    #
    # Consequence worth knowing: api@internal now has NO listener of its own.
    # `--api=true` does not open a port - only `--api.insecure=true` would, and
    # that is exactly the hole we just closed. The API is reachable solely
    # through routers that name `service: api@internal`, which today means the
    # four exact Path() rules in edge/dynamic/portal-api.yml. /api/rawdata is
    # deliberately not among them and must not be added: its body prints the
    # middleware values, so its output is credential material.
    #
    # Do not re-add a router for the dashboard "just to look at it". If the UI is
    # ever genuinely wanted it needs auth in front of it, not a bare Host rule -
    # and the *.dev.test name layer it relied on is retired anyway (2026-08-12),
    # so there is no name left to hang it on.
    deploy:
      resources:
        limits:
          memory: 128m
    # socketnet: reaches portal-socket-proxy for the portal's read-only Docker
    # API (see edge/dynamic/portal-api.yml). Traefik and the proxy are the only
    # two members - the proxy has no auth, so reachability is authorisation.
    # filesnet added 2026-08-12 with the editor tier: it holds exactly two
    # containers, traefik and portal-files, so that a service with no auth of
    # its own is reachable only from the edge that authorises it.
    networks: [devnet, socketnet, filesnet]

networks:
  devnet:
    external: true
  socketnet:
    external: true
  filesnet:
    external: true
