# The route for Settings > Updates, served by bothy-ops (updates.py).
#
# HAND-WRITTEN, and kept out of bothy-ops.yml on purpose, for bothy-admin.yml's
# reason: that file's kube routers are generated from apps/bothy-ops/catalog.toml,
# and a generator that owns a file can rewrite it whole. It must never be able to
# drop a gate it does not know about.
#
# WARNING - this directory is rendered as a Go template. A doubled brace
# anywhere, INCLUDING INSIDE A COMMENT, voids the whole file. `just verify` check
# 5b catches it; apps/bothy-ops/checks/wiring_updates.py does too.
#
# ── one exact Path, GET only, viewer ────────────────────────────────────────
#
#   /-/api/updates/status   every component in updates.toml: pinned, running and
#                           available versions, patch/minor/major, drift, channel
#
# `viewer`, not `operator`: it says what versions the box runs and what is newer
# upstream - all of it public information about public images, the same facts
# About & health already shows a viewer - and it changes nothing. Step 4's plan
# read stays viewer and its request route will be `operator`; neither exists yet
# (docs/plans/updates.md §3), and a router for a path the service does not answer
# is a route nobody reviewed.
#
# `Method(GET)` is part of the rule: a POST never reaches the service at all.
#
# ── self-contained ──────────────────────────────────────────────────────────
#
# The strip and deidentify middlewares and the service below are this file's
# own, under names nothing else uses, so deleting bothy-ops.yml or bothy-admin.yml
# cannot break this route and deleting this file cannot break theirs. The gate is
# the exception, deliberately: sso-viewer is defined ONLY in bothy-gates.yml, and
# sso-errors ONLY in auth.yml.

http:
  routers:
    bothy-updates-status:
      rule: "Path(`/-/api/updates/status`) && Method(`GET`)"
      entryPoints: [web]
      priority: 110
      service: bothy-updates
      middlewares: [bothy-updates-strip, updates-deidentify, sso-viewer, sso-errors]

  middlewares:
    # /-/api/updates/status -> /updates/status. The service answers only its own paths.
    bothy-updates-strip:
      stripPrefix:
        prefixes: ["/-/api"]

    # Delete any identity header the CLIENT sent before forwardAuth runs, so the
    # only name in admin.log is oauth2-proxy's. Same list as admin-deidentify.
    updates-deidentify:
      headers:
        customRequestHeaders:
          X-Auth-Request-User: ""
          X-Auth-Request-Email: ""
          X-Auth-Request-Groups: ""
          X-Auth-Request-Preferred-Username: ""
          X-Forwarded-User: ""
          X-Forwarded-Email: ""

  services:
    # The same container as bothy-ops.yml's service, under this file's own name.
    # opsnet holds traefik and bothy-ops only; reachability is authorisation.
    bothy-updates:
      loadBalancer:
        servers:
          - url: "http://bothy-ops:8097"
