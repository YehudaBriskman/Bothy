# The client-address half of exposing /v1 (docs/plans/thin-bothy/cli-and-control-plane.md s1.9a).
#
# This file defines ONE middleware and NO router. A middleware nothing references is inert, so it
# changes nothing until the /v1 router is installed (that router, generated by `just ops-v1`, lists
# `v1-client-address`; checks/wiring_clientaddr.py refuses a token router that does not).
#
# WHAT bothy-ops NEEDS. Its failed-bearer rate limit must key on the real client, not on Traefik's
# address (every client has that). The header it reads is X-Forwarded-For, and the guarantee that it
# names the connecting peer comes from the ENTRYPOINT, not from here: edge/compose.yml sets no
# `forwardedHeaders.*` on `web`, so Traefik trusts no one, discards any client-sent X-Forwarded-For and
# writes the TCP peer's address. checks/wiring_clientaddr.py fails if anyone adds forwardedHeaders
# trustedIPs or insecure to an entrypoint. bothy-ops additionally honours it only when ITS peer is
# Traefik (BOTHY_TRUSTED_PROXIES) and the value is one bare address, so an appended list or a spoof
# from anywhere else falls back to the shared, safe bucket (apps/bothy-ops/clientaddr.py).
#
# WHY NOT customRequestHeaders FOR THE ADDRESS. A headers middleware can only set a STATIC value; it
# cannot say "the peer's IP". And per claude-notes/stack/edge.md a headers middleware hides a secret
# from the browser, not from /api/rawdata: this one carries no secret, only deletions.
#
# WHAT THIS MIDDLEWARE DOES. It deletes the look-alike client-address headers (empty value = delete),
# so that nothing downstream, now or after a later change, can be tricked by a client-sent copy of a
# header it might one day prefer. It deliberately does NOT touch X-Forwarded-For: if Traefik writes
# its own value BEFORE middlewares run, deleting it here would erase the genuine one, and this file
# cannot prove the order. The entrypoint already replaces a client-sent copy. UNPROVEN until it is
# run against a live Traefik: the checklist in s1.9a makes that the first step of the flip.
http:
  middlewares:
    v1-client-address:
      headers:
        customRequestHeaders:
          Forwarded: ""
          X-Real-Ip: ""
          X-Client-Ip: ""
          X-Real-Client: ""
          X-Bothy-Client: ""
          True-Client-Ip: ""
          CF-Connecting-IP: ""
