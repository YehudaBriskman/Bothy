  routers:
    # ══ containers: operator ═══════════════════════════════════════════════
    bothy-ops-control-restart:
      rule: "Path(`/-/api/control/restart`)"
      entryPoints: [web]
      priority: 110
      service: bothy-ops
      middlewares: [bothy-ops-strip, ops-deidentify, sso-operator, sso-errors]

    bothy-ops-control-stop:
