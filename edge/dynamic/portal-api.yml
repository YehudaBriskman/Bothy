# The portal's read-only data plane.
#
# The portal page discovers what's running instead of being a hand-written list.
# It needs read-only APIs, and it gets them under its OWN origin at /-/api/* -
# same-origin means zero CORS, no preflight, no headers to tune. `/-/` is a
# RESERVED prefix on every address this box answers on; mount nothing else there.
#
# ── SECURITY: THE RULES BELOW ARE THE BOUNDARY ─────────────────────────────
#
# Every rule here is Path() - an EXACT match. Never PathPrefix. This is not
# style, it is the entire security control:
#
#   docker-socket-proxy's CONTAINERS=1 gates by endpoint FAMILY, so it happily
#   serves the per-container /containers/<id>/json - whose response body includes
#   Env. On this box that means POSTGRES_PASSWORD and the Grafana admin password.
#   A PathPrefix here would publish every container's environment to the tailnet.
#
#   The socket-proxy env vars do NOT prevent this. Only these Path() rules do.
#
#   Nothing else guards it either. As of 2026-08-12 no router on this box carries
#   an auth middleware: sso@file/sso-errors@file are defined in auth.yml but
#   attached to NOTHING. These Path() rules are the whole control, on their own.
#
# To add an endpoint: add a Path() line. Never widen to PathPrefix.
#
# ── Regression test - CHECK THE CONTENT TYPE, NOT THE STATUS ───────────────
# Verified 2026-08-12. A blocked path no longer 404s: the portal's catch-all
# PathPrefix(`/`) router at priority 1 answers every unrouted path with the SPA,
# so the per-container endpoint returns 200 text/html. A status-code assertion
# here can never fail and is worthless. Assert the content type instead:
#
#   BOX=127.0.0.1                       # or the tailnet IP; there is no name
#   CID=$(docker ps -q | head -1)
#   # BLOCKED - must print text/html (the SPA, not a container body):
#   curl -s -o /dev/null -w '%{content_type}\n' \
#     http://$BOX/-/api/docker/containers/$CID/json
#   # ALLOWED - must print application/json:
#   curl -s -o /dev/null -w '%{content_type}\n' \
#     http://$BOX/-/api/docker/containers/json
#
# If the blocked line ever prints application/json, a rule here has been widened
# and every container's Env is on the tailnet. That is the only failure that
# matters, and only the content type detects it.
#
# ── Why no Host() rule ─────────────────────────────────────────────────────
# There is no name layer left to match on. The `*.dev.test` namespace was
# dormant from 2026-08-08 and its configuration was DELETED on 2026-08-12;
# access is pure IP:port (`just urls`). Traefik now holds zero Host() rules.
# Host-less Path() is therefore the only shape that works, and it answers on
# every address the box has at once - the tailnet IP, 127.0.0.1, anything.
# Priority 100 keeps these above the portal's catch-all at priority 1, which
# would otherwise swallow them and serve the SPA in place of the JSON.

http:
  routers:
    # Exactly TWO Docker endpoints, each an EXACT Path(). Nothing else is
    # reachable - see the boundary note above. /system/df is safe to add here:
    # its body carries the same categories as /containers/json (names, images,
    # labels, command, mounts) plus size numbers, and NO Env. The socket-proxy
    # grants SYSTEM=1 for it; POST=0 keeps every /system call read-only.
    portal-api-docker:
      rule: >-
        Path(`/-/api/docker/containers/json`)
        || Path(`/-/api/docker/system/df`)
      entryPoints: [web]
      priority: 100
      # NO auth middleware here, and as of 2026-08-12 none anywhere on the box.
      # This used to read "sso also closes the DNS-rebinding hole" - that was
      # true only while a session cookie scoped to .dev.test existed. The name
      # is gone, the cookie is gone, and sso@file is attached to no router, so
      # that sentence would now be a false comfort. Anything on the tailnet can
      # GET this. What it gets is bounded solely by the Path() rule above, which
      # is why the rule is the boundary and the comment is not decoration.
      middlewares: [portal-api-docker-rewrite]
      service: portal-socket-proxy

    # Loki reads, for the portal's per-service log view.
    #
    # WHY LOKI AND NOT /containers/{id}/logs: the docker route above is exact
    # Path() precisely because the socket-proxy gates by endpoint FAMILY, so any
    # pattern loose enough to match a container id would also match
    # /containers/{id}/json and publish every container's Env. Loki needs no
    # pattern at all - the container name is a query PARAMETER, not part of the
    # path - so this stays an exact Path() and the boundary above is untouched.
    #
    # Loki holds only log lines, is read-only on these two endpoints, and
    # already has every container (promtail docker_sd) plus host processes
    # (promtail host-processes job). It also keeps logs for containers that have
    # since stopped, which `docker logs` on a removed container cannot.
    portal-api-loki:
      rule: >-
        Path(`/-/api/loki/query_range`)
        || Path(`/-/api/loki/labels`)
      entryPoints: [web]
      priority: 100
      middlewares: [portal-api-loki-rewrite]
      service: portal-loki

    # The Traefik API is read-only by nature - no mutating endpoints exist.
    #
    # Updated 2026-08-12: the old justification here was "traefik.dev.test
    # already serves it unauthenticated, so these paths grant no authority that
    # isn't already there." That router is DELETED and `--api.dashboard=true`
    # is now `--api=true`, so the argument no longer holds - these four paths
    # are the only way the Traefik API is reachable at all. That is the point:
    # the dashboard router exposed the WHOLE api@internal surface, including
    # /api/rawdata, which rendered the live Authorization: Basic header that
    # portal-prom.yml injects. These four exact paths carry no credential.
    # Never add /api/rawdata, and never widen this to PathPrefix.
    portal-api-traefik:
      rule: >-
        Path(`/-/api/traefik/http/routers`)
        || Path(`/-/api/traefik/http/services`)
        || Path(`/-/api/traefik/overview`)
        || Path(`/-/api/traefik/version`)
      entryPoints: [web]
      priority: 100
      middlewares: [portal-api-traefik-rewrite]
      service: api@internal

  middlewares:
    # /-/api/docker/containers/json -> /containers/json
    portal-api-docker-rewrite:
      replacePathRegex:
        regex: "^/-/api/docker/(.*)"
        replacement: "/$1"

    # /-/api/loki/query_range -> /loki/api/v1/query_range
    portal-api-loki-rewrite:
      replacePathRegex:
        regex: "^/-/api/loki/(.*)"
        replacement: "/loki/api/v1/$1"

    # /-/api/traefik/http/routers -> /api/http/routers
    #
    # replacePathRegex, not stripPrefix: stripPrefix would leave /http/routers,
    # so the client would have to request /-/api/traefik/api/http/routers with
    # `api` twice. This keeps the client URL clean.
    portal-api-traefik-rewrite:
      replacePathRegex:
        regex: "^/-/api/traefik/(.*)"
        replacement: "/api/$1"

  services:
    # Reached by Docker DNS over socketnet. The docker provider can't see this
    # container (it's not on devnet, by design), which is exactly why it's
    # declared here in the file provider rather than via labels.
    portal-socket-proxy:
      loadBalancer:
        servers:
          - url: "http://portal-socket-proxy:2375"

    # Loki is on devnet, so this could have been a label on the loki container -
    # but it is declared here to keep the whole /-/api/* surface readable in one
    # file. That surface IS the security boundary; splitting it across compose
    # files is how a rule gets widened without anyone noticing.
    portal-loki:
      loadBalancer:
        servers:
          - url: "http://loki:3100"
