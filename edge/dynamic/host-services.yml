# Traefik routes for processes running on the HOST, not in containers.
#
# RETIRED 2026-08-12 - this file declares no routes any more, and is kept as the
# record of why.
#
# It existed because a container declares itself with labels and a host process
# has nothing to label, so its route was written here instead. Every route it
# held was a `Host(`*.dev.test`)` rule, and that name layer is gone: the tailnet
# split-DNS route was removed on 2026-08-08 and the configuration deleted on
# 2026-08-12. Access is pure IP:port.
#
# The routes that were here, and where those things live now:
#
#   tilt.dev.test        ->  http://<tailnet-ip>:10350
#   tilt.cvops.dev.test  ->  the same process (it was only an alias)
#
# Tilt binds one fixed host port and only one project's Tilt can hold it at a
# time, so the name never distinguished projects anyway - it always pointed at
# whichever project last ran `tilt up`. Reaching it by port loses nothing and
# removes the illusion of per-project addressing.
#
# Still true, and the reason a route here used to 502: a host process must bind
# an address the container can reach. 127.0.0.1 is NOT reachable from inside a
# container, so Tilt needs `tilt up --host=0.0.0.0 --port=10350`. That applies to
# reaching it directly by IP too, from any device other than this box.
#
# If a host process ever genuinely needs a Traefik route again, note that it
# cannot be a Host() rule - there is no name layer to match on. It would have to
# be a host-less exact `Path()` rule, the same shape the portal's data plane uses
# (see portal-api.yml), and it would answer on every address at once. Think about
# whether a published port is not simply the better answer.
