# EXAMPLE - how a project exposes a host process on this box.
#
# Rewritten 2026-08-12. Everything below is COMMENTED OUT on purpose; see "why
# this file declares nothing" at the bottom. Copy the shape, not the file.
#
# ── THE CURRENT MODEL: publish a port ────────────────────────────────────────
# There is no name layer any more. The namespace was dormant from
# 2026-08-08 and deleted on 2026-08-12, so a `Host(...)` rule registers happily
# and then matches nothing, forever. Do not write one.
#
# A host process is reached directly:
#
#     bind it to 0.0.0.0, not 127.0.0.1
#     reach it at  http://<tailnet-ip>:<port>
#
# 127.0.0.1 is not reachable from another device, and not reachable from inside a
# container either. A dev server that defaults to localhost needs telling:
# `vite --host 0.0.0.0`, `tilt up --host=0.0.0.0`, `uvicorn --host 0.0.0.0`.
#
# Pick a port nothing else holds - `just urls` prints what is already taken, and
# `ss -ltnp | grep :<port>` settles it. A collision is the single most common
# reason a new project "does not come up".
#
# That is the whole recipe. Most projects need nothing in this directory at all.
#
# ── IF YOU GENUINELY NEED A TRAEFIK ROUTE ────────────────────────────────────
# The only shape that still works is a HOST-LESS exact `Path()` rule, which is
# what the portal's own data plane uses (see portal-api.yml). Be aware of what
# that means: with no Host to scope it, the route answers on EVERY address this
# box has, at once, and it is a shared global path namespace - so a generic path
# like `/api` will collide with the next project that wants `/api`.
#
# Prefix it with something that is unmistakably yours, and match exactly:
#
#   http:
#     routers:
#       myproj-api:
#         rule: "Path(`/-/myproj/status`) || Path(`/-/myproj/items`)"
#         entryPoints: [web]
#         priority: 100          # above the portal catch-all, which sits at 1
#         service: myproj-api
#     services:
#       myproj-api:
#         loadBalancer:
#           servers:
#             - url: "http://host.docker.internal:3000"
#
# `Path()`, never `PathPrefix()`. portal-api.yml explains at length why that
# distinction is a security control and not a style preference: a prefix loose
# enough to be convenient is loose enough to expose an endpoint you did not
# audit.
#
# A 502 when the process is not running is expected, not a fault.
#
# ── WHY THIS FILE DECLARES NOTHING ───────────────────────────────────────────
# Traefik's file provider MERGES every *.yml in this directory. An example with
# live YAML is not an example - it is configuration.
#
# Two things this file did while it was live, both real:
#
#   1. Its `example-web` router sat in the router table with `status: disabled`,
#      because it referenced `sso@file` and that middleware stopped existing when
#      the SSO was parked. A permanently broken router that no one owned.
#   2. The same trap bit harder elsewhere on 2026-08-10: a newly written example
#      file declared the same router and middleware NAMES as a real generated
#      file, and the merge silently replaced a live credential with the example's
#      placeholder. Every request 401'd while the router still reported "enabled".
#
# So: examples in this directory stay commented, or use names that cannot
# collide with anything real. Both, ideally.
