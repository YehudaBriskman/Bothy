# EXAMPLE — a per-project route file. Copy to `<project>.yml` and edit.
#
# Traefik watches this directory (--providers.file.directory), so dropping a
# file in here publishes routes immediately; no restart, no edit to any shared
# file. That is the point: a project owns its own routes and never has to touch
# the stack's config.
#
# Files named anything other than the stack's own (auth.yml, host-services.yml,
# portal-api.yml) are GITIGNORED — see edge/dynamic/.gitignore. Per-project
# files are often generated by the project's own tooling and can name private
# work, so they stay on the box and out of this public repo.
#
# ── When you need this file at all ──────────────────────────────────────────
# Containers do NOT belong here. A container declares its own route with two
# labels and is picked up by the docker provider:
#
#     labels:
#       - traefik.enable=true
#       - traefik.http.routers.<name>.rule=Host(`<name>.dev.test`)
#
# This file is for HOST processes — a dev server, an API running under a
# process manager, anything started outside Docker. They have nothing to label,
# so they are declared here instead.
#
# ── Naming ──────────────────────────────────────────────────────────────────
# Nest a project's pieces underneath the project:
#
#     <project>.dev.test            the project's main UI
#     api.<project>.dev.test        its API
#     <sub>.<project>.dev.test      anything else
#
# The portal reads that nesting to group services, so a flat name for something
# that belongs to a project will file it in the wrong place. Use `.test`, never
# `.dev` — `.dev` is HSTS-preloaded and browsers force HTTPS on it.
#
# ── Reaching the host from inside Traefik ───────────────────────────────────
# host.docker.internal resolves to the host gateway (extra_hosts in
# ../compose.yml). The process must bind an address the container can reach:
# 127.0.0.1 is NOT reachable from inside a container, so start it on 0.0.0.0.
# That is the usual reason a route here returns 502.
#
# A 502 when the process simply is not running is expected, not a fault.

http:
  routers:
    # One router per hostname. `service` points at an entry under `services:`.
    example-web:
      rule: "Host(`example.dev.test`)"
      entryPoints: [web]
      service: example-web
      # Add the SSO pair for anything with no login of its own. Order matters:
      # sso-errors turns sso's bare 401 into the sign-in page. Omit both if the
      # app ships its own authentication.
      middlewares: [sso-errors@file, sso@file]

    example-api:
      rule: "Host(`api.example.dev.test`)"
      entryPoints: [web]
      service: example-api

  services:
    example-web:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:5173"
    example-api:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:3000"
