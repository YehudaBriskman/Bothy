# Routes for bothy-kube - OpenShift-console verbs on two cluster namespaces.
#
# WARNING - this directory is rendered as a Go template. A doubled brace anywhere,
# INCLUDING INSIDE A COMMENT, voids the whole file and Traefik silently keeps its
# last-good config until the next restart. `just verify` check 5b catches it.
#
# ── one exact Path per action, never a prefix, never a Host ─────────────────
#
# Five routers, one per id in apps/bothy-kube/catalog.toml, and
# apps/bothy-kube/checks/edge.py asserts the two lists are identical. A
# PathPrefix over /-/api/kube/ would expose every action the service grows
# LATER; with exact paths a sixth action is unreachable until this file is
# edited. No Host() rules - the name layer is retired (notes rule 1).
#
# ── the role on each router is the catalog's `role` ─────────────────────────
#
#   reads   (events, logs)                            sso-viewer
#   changes (rollout-restart, scale, delete-completed-pods)  sso-operator
#
# ── BORROWED middlewares, not redefined ─────────────────────────────────────
#
#   sso-viewer    edge/dynamic/portal-files.yml
#   sso-operator  edge/dynamic/bothy-control.yml
#   sso-errors    edge/dynamic/auth.yml
#
# The file provider merges every .yml here into one namespace, so bare names
# resolve, and a second definition would be a collision whose winner nobody
# picks. The coupling this creates is real: sso-operator now has TWO consumers,
# so deleting bothy-control.yml would leave these three routers referencing a
# middleware that does not exist. Traefik then marks the routers as erroring
# and they serve NOTHING - it fails closed, not open - but the note belongs here
# so that deletion is a two-file decision. checks/edge.py asserts all three
# names are still defined somewhere in this directory.
#
# oauth2-proxy fails CLOSED on a group nobody holds, so a realm without
# `operator` refuses these changes rather than admitting them.

http:
  routers:
    # ── changes: operator ────────────────────────────────────────────────────
    bothy-kube-rollout-restart:
      rule: "Path(`/-/api/kube/rollout-restart`)"
      entryPoints: [web]
      priority: 110
      service: bothy-kube
      middlewares: [bothy-kube-strip, kube-deidentify, sso-operator, sso-errors]

    bothy-kube-scale:
      rule: "Path(`/-/api/kube/scale`)"
      entryPoints: [web]
      priority: 110
      service: bothy-kube
      middlewares: [bothy-kube-strip, kube-deidentify, sso-operator, sso-errors]

    bothy-kube-delete-completed-pods:
      rule: "Path(`/-/api/kube/delete-completed-pods`)"
      entryPoints: [web]
      priority: 110
      service: bothy-kube
      middlewares: [bothy-kube-strip, kube-deidentify, sso-operator, sso-errors]

    # ── reads: viewer ────────────────────────────────────────────────────────
    bothy-kube-events:
      rule: "Path(`/-/api/kube/events`)"
      entryPoints: [web]
      priority: 110
      service: bothy-kube
      middlewares: [bothy-kube-strip, kube-deidentify, sso-viewer, sso-errors]

    # Log follow is text/event-stream. Traefik flushes that content type
    # immediately, so no flushInterval is needed; the service bounds each
    # stream to at most 300 seconds.
    bothy-kube-logs:
      rule: "Path(`/-/api/kube/logs`)"
      entryPoints: [web]
      priority: 110
      service: bothy-kube
      middlewares: [bothy-kube-strip, kube-deidentify, sso-viewer, sso-errors]

    # NO router for /healthz. It is the container's own HEALTHCHECK on 127.0.0.1.

  middlewares:
    # /-/api/kube/scale -> /kube/scale, the service's own path.
    bothy-kube-strip:
      stripPrefix:
        prefixes: ["/-/api"]

    # Delete any X-Auth-Request-* the CLIENT sent before forwardAuth runs, so the
    # only identity reaching the audit line is the one oauth2-proxy produced.
    # Its own copy, on control-deidentify's reasoning: not a role gate, so six
    # duplicated lines can drift into a wrong list but never a wrong answer.
    kube-deidentify:
      headers:
        customRequestHeaders:
          X-Auth-Request-User: ""
          X-Auth-Request-Email: ""
          X-Auth-Request-Groups: ""
          X-Auth-Request-Preferred-Username: ""
          X-Forwarded-User: ""
          X-Forwarded-Email: ""

  services:
    bothy-kube:
      loadBalancer:
        servers:
          # kubenet holds exactly two containers: traefik and bothy-kube.
          # Traefik is NOT on thales-scc and has no route to the apiserver.
          - url: "http://bothy-kube:8098"
