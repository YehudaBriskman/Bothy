# Override: let VictoriaMetrics see the minikube cluster `thales-scc`.
#
#   docker compose -f monitoring/compose.yml -f monitoring/compose.cluster.yml up -d victoriametrics
#
# `just up-monitoring` adds this file by itself when the docker network
# `thales-scc` exists. USE THE RECIPE, or both -f flags: a plain
# `docker compose -f monitoring/compose.yml up -d victoriametrics` recreates the
# container WITHOUT the network and the mounts below, and the kube* jobs vanish
# rather than go DOWN - so the cluster-down alert has nothing to fire on.
#
# WHY AN OVERRIDE AND NOT compose.yml ITSELF. An `external: true` network that
# does not exist is a hard error for the whole project. Put in compose.yml, it
# would make `just up` fail on every box without this cluster - fresh clones and
# `just ci-install` included - and make monitoring depend on the thing it
# watches, which stack/kubernetes.md rules out.
#
# WHY A SECOND NETWORK AT ALL. Docker isolates bridge networks from one another:
# from devnet, 192.168.49.2 times out. Joining `thales-scc` is the one path that
# needs no host-side forwarder and no port on the host. The cluster's own
# alternatives were weighed and are worse here: an in-cluster agent that
# remote-writes needs a write path opened on the metrics store and a credential
# inside the cluster, and turns "cluster down" into an absence of data instead
# of up==0.
#
# THE LEGACY `prometheus` SERVICE (profile legacy-prometheus) IS DELIBERATELY NOT
# LISTED HERE. scrape.d/ is in VictoriaMetrics' format now, which Prometheus
# refuses at startup - mounting it would turn a rollback into an outage. A
# rolled-back Prometheus runs without the kube jobs.
#
# If the cluster is ever deleted, `minikube delete` cannot remove the network
# while victoriametrics is attached - recreate it without this file first.
services:
  victoriametrics:
    volumes:
      - ./scrape.d:/etc/prometheus/scrape.d:ro
      # Directory, not file: the token is replaced by rename. Generated by
      # `just kube-prom-token` (scripts/gen-kube-prom-token.sh), gitignored.
      # VM runs as root in its container, so the token's 600/uid-65534 mode
      # (set for Prometheus' `nobody`) still reads.
      - ./kube-auth:/etc/prometheus/kube-auth:ro
    networks: [devnet, thales-scc]

networks:
  thales-scc:
    external: true
