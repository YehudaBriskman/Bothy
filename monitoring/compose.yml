name: monitoring

services:
  prometheus:
    image: prom/prometheus:v3.13.2
    container_name: prometheus
    # No Traefik router - reached directly on published port 9090.
    # Prometheus runs with --web.enable-lifecycle; its own basic auth
    # (--web.config.file below) is the boundary since the SSO was parked.
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
      # Basic auth on all endpoints (2026-08-08, replaces parked SSO). The web
      # config + password file are gitignored; see their headers to regenerate.
      # The self-scrape job and the Grafana datasource carry these creds too.
      - --web.config.file=/etc/prometheus/web.yml
    # Card title in Bothy's Overview, `Role · Vendor` - see edge/compose.yml.
    # Credited to Grafana, though the project is four upstream products
    # (Prometheus, Grafana, Loki, promtail) plus two exporters. The vendor slot
    # names the one you OPEN; the others are its plumbing and are listed on the
    # system's own page.
    labels:
      - dev.portal.project=Monitoring · Grafana
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-web.yml:/etc/prometheus/web.yml:ro
      - ./prom-username.txt:/etc/prometheus/prom-username.txt:ro
      - ./prom-password.txt:/etc/prometheus/prom-password.txt:ro
      - ./rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    # `extra_hosts: host.docker.internal:host-gateway` was here for the
    # docker-daemon scrape job and nothing else; both went on 2026-08-19. Grep
    # before adding it back: prometheus.yml names no host now, and a mapping
    # kept "just in case" is how the reason for a line gets lost.
    deploy:
      resources:
        limits:
          memory: 1g
    networks: [devnet]

  grafana:
    image: grafana/grafana:13.1.4
    container_name: grafana
    # No Traefik router - reached on published port 3000, where Grafana's own login applies.
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_EMAIL: ${GRAFANA_ADMIN_EMAIL:-admin@localhost}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SMTP_ENABLED: ${GF_SMTP_ENABLED:-false}
      GF_SMTP_HOST: ${GF_SMTP_HOST:-}
      GF_SMTP_USER: ${GF_SMTP_USER:-}
      GF_SMTP_PASSWORD: ${GF_SMTP_PASSWORD:-}
      GF_SMTP_FROM_ADDRESS: ${GF_SMTP_FROM_ADDRESS:-}
      GF_SMTP_FROM_NAME: ${GF_SMTP_FROM_NAME:-Grafana}
      GF_SMTP_STARTTLS_POLICY: ${GF_SMTP_STARTTLS_POLICY:-OpportunisticStartTLS}
      # Expanded by provisioning/datasources/datasources.yml for the Prometheus
      # basic auth added 2026-08-08. Values live in the gitignored root .env.
      DEV_LOGIN_USER: ${DEV_LOGIN_USER:?set DEV_LOGIN_USER in .env}
      DEV_LOGIN_PASSWORD: ${DEV_LOGIN_PASSWORD:?set DEV_LOGIN_PASSWORD in .env}
      # Consumed by provisioning/alerting/contactpoints.yml as `$ALERT_EMAIL_TO`.
      # Alerting provisioning interpolates with the plain `$VAR` form - NOT the
      # `$__env{VAR}` form used by datasource provisioning. The address used to be
      # hardcoded in that file, which put a personal address in every commit.
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-${GRAFANA_ADMIN_EMAIL:-admin@localhost}}
    volumes:
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on: [prometheus, loki]
    deploy:
      resources:
        limits:
          memory: 512m
    networks: [devnet]

  loki:
    image: grafana/loki:3.7.6
    container_name: loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      # Overrides the image config solely to add retention; see that file's
      # header for why it is derived from the default instead of hand-written.
      - ./loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    deploy:
      resources:
        limits:
          memory: 512m
    networks: [devnet]

  promtail:
    image: grafana/promtail:3.6.8
    container_name: promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./promtail.yml:/etc/promtail/config.yml:ro
      # Positions default to /tmp, which is empty again on every restart, so
      # promtail re-read every container log from the start and duplicated the
      # entire history into Loki each time it came back.
      - promtail_positions:/tmp
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Host-process logs (see the host-processes job in promtail.yml). Projects
      # that run from a terminal rather than a container write here, and the
      # filename becomes the Loki stream name.
      - ${HOME}/.local/state/devbox-logs:/host-logs:ro
    deploy:
      resources:
        limits:
          memory: 256m
    networks: [devnet]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    # cAdvisor ran with NO command at all, which means every metric family on,
    # housekeeping every second, and every container label copied onto every
    # series. Nobody chose that; it is just the default, and it is the single
    # most expensive misconfiguration on this box. Measured: cAdvisor produces
    # 4147 series, of which about 407 are reachable from anything in this repo,
    # and the top five metrics by cardinality in the whole Prometheus head -
    # container_tasks_state (360), container_memory_failures_total (288),
    # container_blkio_device_usage_total (124), container_fs_writes_total (113),
    # container_fs_reads_total (113) - are all cAdvisor families that no
    # dashboard, alert rule or portal query reads. cadvisor is also the closest
    # container on this box to its own limit, 213.5 MiB of a 256 MiB cap.
    #
    # THE LABEL WHITELIST IS LOAD-BEARING, and this is the line to be careful
    # with. `--store_container_labels=false` on its own drops
    # container_label_com_docker_compose_project, which SystemDialog.tsx selects
    # on for every per-system CPU and memory chart and which nothing else on
    # this box can produce, plus `_service` and `_project_working_dir`, which
    # dashboards/cadvisor.json renders as its Service and Working dir columns.
    # Both would go blank rather than error. A fourth compose label wanted by a
    # dashboard has to be added here in the same commit.
    #
    # --disable_metrics REPLACES cAdvisor's own default ignore list rather than
    # extending it - MetricSet.Set() clears the set before parsing the value -
    # so upstream's eleven defaults are repeated here verbatim and dropping one
    # of them would silently switch that family ON. The five on the end are the
    # families measured above: percpu, cpuLoad (container_tasks_state), disk and
    # diskIO (the fs_* and blkio_* series), and perf_event, which needs host
    # configuration this box does not have. What is kept is what is queried -
    # cpu, memory, network - plus oom_event, which is one series per container
    # and the only cheap answer to "why did that container disappear".
    # container_start_time_seconds is emitted unconditionally and belongs to no
    # family, so nothing here can take it away.
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service,com.docker.compose.project_working_dir
      - --disable_metrics=advtcp,cpuLoad,cpu_topology,cpuset,disk,diskIO,hugetlb,memory_numa,percpu,perf_event,process,referenced_memory,resctrl,sched,tcp,udp
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8082:8080"
    deploy:
      resources:
        limits:
          memory: 256m
    networks: [devnet]

  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: node-exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro
    ports:
      - "9100:9100"
    deploy:
      resources:
        limits:
          memory: 128m
    networks: [devnet]

volumes:
  promtail_positions:
  prometheus_data:
  grafana_data:
  loki_data:

networks:
  devnet:
    external: true
