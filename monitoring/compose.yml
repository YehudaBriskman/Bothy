name: monitoring

services:
  # ── metrics: VictoriaMetrics (replaced Prometheus 2026-09-17) ────────────────
  #
  # Single-node VictoriaMetrics scrapes the SAME prometheus.yml (+ scrape.d/ via
  # compose.cluster.yml) and answers the Prometheus HTTP API, so Grafana's
  # `prometheus` datasource, the five alert rules and Bothy's /-/api/prom/* graphs
  # work unchanged. Measured before the switch with scripts/checks/prom-parity.sh
  # against the live Prometheus: identical label sets for every query; alert
  # expressions and gauges identical to the sample; rate() differs point-by-point
  # by design (MetricsQL does not extrapolate) with window means within 5%.
  #
  # WHY: at this box's scale it holds 15 days in roughly half Prometheus' disk
  # (25h imported = 22 MB) and steady memory ~100 MiB.
  #
  # ADDRESSING - a new name, a new port, and deliberately NO `prometheus` alias.
  # During the switch-over both run side by side (history is imported from the
  # live Prometheus over devnet), and on rollback the legacy service comes back
  # under its old name. An alias would make `prometheus` resolve to BOTH
  # containers at those moments and Docker's DNS would round-robin between two
  # different databases. The consumers were few enough to repoint instead:
  # provisioning/datasources, scripts/gen-bothy-prom-route.sh, scripts/doctor.sh.
  #
  # ROLLBACK: the Prometheus service is kept below under the `legacy-prometheus`
  # profile, and its volume `monitoring_prometheus_data` is kept, untouched.
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.152.0
    container_name: victoriametrics
    restart: unless-stopped
    # CREDENTIALS WITHOUT LEAKING THEM INTO `docker inspect`. The password flag
    # takes `file://` natively, so the secret never enters argv at all. The
    # username flag does not (it is a plain string), so a shell reads it from the
    # same mounted file at start; `docker inspect` shows the `$(cat ...)`, not the
    # value. prom-username.txt / prom-password.txt are the files bootstrap already
    # generates for Prometheus - gitignored, from DEV_LOGIN_* in .env.
    #
    # $$ is compose's escape; the container's sh sees a single $. `exec` keeps VM
    # as PID 1 so `docker stop` reaches it and it flushes cleanly.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        exec /victoria-metrics-prod
        -storageDataPath=/victoria-metrics-data
        -retentionPeriod=15d
        -promscrape.config=/etc/prometheus/prometheus.yml
        -httpAuth.username="$$(cat /etc/prometheus/prom-username.txt)"
        -httpAuth.password=file:///etc/prometheus/prom-password.txt
    # RETENTION. 15d, as Prometheus had. There is no equivalent of Prometheus'
    # --storage.tsdb.retention.size: VM deletes whole data parts once they are
    # entirely outside the window, so the disk can briefly hold more than 15 days
    # (worst case documented upstream: retention + 1 month). At ~20 MB/day that is
    # still well under the 3GB ceiling Prometheus had. The remaining guard is
    # -storage.minFreeDiskSpaceBytes (default 100 MB): VM stops accepting writes
    # rather than fill the disk.
    labels:
      - dev.portal.project=Monitoring · Grafana
    volumes:
      # Same in-container paths Prometheus used, so prometheus.yml's
      # username_file/password_file lines and scrape.d/ work for both.
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prom-username.txt:/etc/prometheus/prom-username.txt:ro
      - ./prom-password.txt:/etc/prometheus/prom-password.txt:ro
      - victoriametrics_data:/victoria-metrics-data
    # vmui at http://<box>:8428/vmui, same basic auth.
    ports:
      - "8428:8428"
    # /health answers without auth (it says "OK" and nothing else), so the probe
    # carries no credential at all. The image is alpine with busybox wget.
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "-T", "3", "http://127.0.0.1:8428/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          # VM sizes its caches to 60% of THIS limit (-memory.allowedPercent), so
          # the limit is also the cache budget. Measured: ~95 MiB scraping this
          # box; ~330 MiB right after a 25h vmctl import, which is caches filling
          # up to that budget, not growth.
          memory: 512m
    networks: [devnet]

  # ── LEGACY: Prometheus, kept for rollback only ──────────────────────────────
  # Not started by `just up-monitoring` / `docker compose up` (profile). Rollback:
  #   docker compose -f monitoring/compose.yml stop victoriametrics
  #   docker compose -f monitoring/compose.yml --profile legacy-prometheus up -d prometheus
  # and point provisioning/datasources + the bothy-prom route back at
  # prometheus:9090. It comes back WITHOUT the thales-scc jobs: scrape.d/ is now
  # in VictoriaMetrics' format (a bare list), which Prometheus refuses, so
  # compose.cluster.yml does not mount it into this service. The self-scrape job
  # in prometheus.yml also targets VM now; expect that one target DOWN.
  prometheus:
    profiles: [legacy-prometheus]
    image: prom/prometheus:v3.14.0
    container_name: prometheus
    # No Traefik router - reached directly on published port 9090.
    # Prometheus runs with --web.enable-lifecycle; its own basic auth
    # (--web.config.file below) is the boundary since the SSO was parked.
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      # A CEILING AS WELL AS A CLOCK. retention.time alone means the volume grows
      # as `cardinality x 15 days`, so it is bounded by how much anything happens
      # to emit rather than by anything anyone chose - and the box learned what
      # that costs: cAdvisor ran with no flags and produced 4147 series, of which
      # ~400 were reachable, which is most of why this volume reached 1.8 GB.
      #
      # Measured 2026-08-19, and retention.time was working correctly the whole
      # time: 24 blocks, oldest 14 days old, dropping on schedule. The defect was
      # never that old data stayed - it was that nothing capped how big 15 days
      # could BE.
      #
      # 3GB is ~4-6x the expected steady state now that cAdvisor emits 1036
      # series rather than 4147, so it should never bite in normal operation.
      # When it does bite, it means something started emitting far more than
      # before, and losing the oldest hours is the right answer - Vitals only
      # ever looks back 24h and no dashboard here reads past that. Prometheus
      # honours whichever limit is reached first.
      - --storage.tsdb.retention.size=3GB
      - --web.enable-lifecycle
      # Basic auth on all endpoints (2026-08-08, replaces parked SSO). The web
      # config + password file are gitignored; see their headers to regenerate.
      # The self-scrape job and the Grafana datasource carry these creds too.
      - --web.config.file=/etc/prometheus/web.yml
    # Card title in Bothy's Overview, `Role · Vendor` - see edge/compose.yml.
    # Credited to Grafana, though the project is four upstream products
    # (Prometheus, Grafana, Loki, promtail) plus two exporters. The vendor slot
    # names the one you OPEN; the others are its plumbing and are listed on the
    # system's own page.
    labels:
      - dev.portal.project=Monitoring · Grafana
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-web.yml:/etc/prometheus/web.yml:ro
      - ./prom-username.txt:/etc/prometheus/prom-username.txt:ro
      - ./prom-password.txt:/etc/prometheus/prom-password.txt:ro
      - ./rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    # `extra_hosts: host.docker.internal:host-gateway` was here for the
    # docker-daemon scrape job and nothing else; both went on 2026-08-19. Grep
    # before adding it back: prometheus.yml names no host now, and a mapping
    # kept "just in case" is how the reason for a line gets lost.
    # Basic auth covers /-/ready too (web.yml has no per-path exemption), so the
    # probe builds the header from the mounted cred files AT RUN TIME - the
    # secret never lands in the container config that `docker inspect` prints.
    # $$ is compose's escape; the container's sh sees a single $.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null -T 3 --header \"Authorization: Basic $$(printf '%s:%s' \"$$(cat /etc/prometheus/prom-username.txt)\" \"$$(cat /etc/prometheus/prom-password.txt)\" | base64 -w0)\" http://127.0.0.1:9090/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      # WAL replay of a multi-GB TSDB; /-/ready is 503 until it finishes.
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1g
    networks: [devnet]

  grafana:
    image: grafana/grafana:13.2.2
    container_name: grafana
    # No Traefik router - reached on published port 3000, where Grafana's own login applies.
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_EMAIL: ${GRAFANA_ADMIN_EMAIL:-admin@localhost}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SMTP_ENABLED: ${GF_SMTP_ENABLED:-false}
      GF_SMTP_HOST: ${GF_SMTP_HOST:-}
      GF_SMTP_USER: ${GF_SMTP_USER:-}
      GF_SMTP_PASSWORD: ${GF_SMTP_PASSWORD:-}
      GF_SMTP_FROM_ADDRESS: ${GF_SMTP_FROM_ADDRESS:-}
      GF_SMTP_FROM_NAME: ${GF_SMTP_FROM_NAME:-Grafana}
      GF_SMTP_STARTTLS_POLICY: ${GF_SMTP_STARTTLS_POLICY:-OpportunisticStartTLS}
      # Expanded by provisioning/datasources/datasources.yml for the Prometheus
      # basic auth added 2026-08-08. Values live in the gitignored root .env.
      DEV_LOGIN_USER: ${DEV_LOGIN_USER:?set DEV_LOGIN_USER in .env}
      DEV_LOGIN_PASSWORD: ${DEV_LOGIN_PASSWORD:?set DEV_LOGIN_PASSWORD in .env}
      # Consumed by provisioning/alerting/contactpoints.yml as `$ALERT_EMAIL_TO`.
      # Alerting provisioning interpolates with the plain `$VAR` form - NOT the
      # `$__env{VAR}` form used by datasource provisioning. The address used to be
      # hardcoded in that file, which put a personal address in every commit.
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-${GRAFANA_ADMIN_EMAIL:-admin@localhost}}
    volumes:
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    # Honoured by `compose up` ONLY. When dockerd brings containers back at
    # boot (restart: unless-stopped) it ignores depends_on entirely, so Grafana
    # can still start before either datasource answers - it retries on its own.
    # loki stays service_started: its image is distroless (no shell, no wget,
    # no health flag), so it has no healthcheck and service_healthy would make
    # `compose up` refuse to start grafana at all.
    depends_on:
      victoriametrics:
        condition: service_healthy
      loki:
        condition: service_started
    healthcheck:
      # /api/health checks the DB too and needs no login.
      test: ["CMD", "wget", "-qO", "/dev/null", "-T", "3", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      # First boot runs schema migrations before the HTTP server listens.
      start_period: 30s
    deploy:
      resources:
        limits:
          # NOT lowered (2026-09-17). A fresh container reads ~165 MiB, which is
          # what `docker stats` showed when the trim was planned - but over 7 days
          # the median was 406 MiB, p95 437 MiB, peak 511 MiB. The snapshot was a
          # just-restarted Grafana, not its working size.
          memory: 512m
    networks: [devnet]

  loki:
    image: grafana/loki:3.7.8
    container_name: loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      # Overrides the image config solely to add retention; see that file's
      # header for why it is derived from the default instead of hand-written.
      - ./loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    # NO healthcheck, on purpose. grafana/loki is distroless: no sh, no wget,
    # no curl, and the binary has no health/ready flag (checked 3.7.6). Any
    # test here could only ever fail, which is worse than none. /ready on 3100
    # is still what to probe from OUTSIDE the container.
    deploy:
      resources:
        limits:
          # 7-day peak 211 MiB, p95 147 MiB (measured 2026-09-17) -> ~1.8x peak.
          memory: 384m
    networks: [devnet]

  # ── logs: Grafana Alloy (replaced promtail 2026-09-17) ───────────────────────
  # promtail is end-of-life. Config converted with `alloy convert
  # --source-format=promtail` and reviewed; the Loki label set is unchanged
  # (container, stack, stream; host_service + filename for host processes) -
  # verified with a side-by-side test container writing test="alloy" streams.
  # See alloy/config.alloy for the docker-access note and first-start behaviour.
  alloy:
    image: grafana/alloy:v1.19.2
    container_name: alloy
    restart: unless-stopped
    # The UI/API stays on 127.0.0.1 (the image default): the healthcheck is the
    # only client, and the Alloy UI shows the full pipeline to anyone who can
    # reach it. promtail listened on 0.0.0.0:9080 and nothing on devnet used it.
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --disable-reporting
    volumes:
      # A DIRECTORY mount, not a file: editing config.alloy does not strand the
      # container on the old inode (the gotcha that bit promtail.yml twice).
      - ./alloy:/etc/alloy:ro
      # Positions (and nothing else) live here. Unlike promtail's /tmp default,
      # this survives a recreate, so logs are not re-shipped on every restart.
      - alloy_data:/var/lib/alloy/data
      # promtail's old positions, read once for the host-log files so the switch
      # does not re-send them from byte 0. Harmless after that; drop it together
      # with the promtail_positions volume once promtail is gone for good.
      - promtail_positions:/promtail-positions:ro
      # Docker discovery and log reads, over the API - the access promtail had.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Host-process logs; the filename becomes host_service.
      - ${HOME}/.local/state/devbox-logs:/host-logs:ro
    # Ubuntu image with bash but no wget/curl: the same /dev/tcp probe promtail
    # used. HTTP/1.0 makes Alloy close the socket, so the read ends.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/12345 && printf 'GET /-/ready HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          # Measured 65 MiB tailing three containers in the side-by-side test;
          # promtail peaked at 113 MiB over 7 days tailing all of them.
          memory: 256m
    networks: [devnet]

  # ── LEGACY: promtail, kept for rollback only ────────────────────────────────
  #   docker compose -f monitoring/compose.yml stop alloy
  #   docker compose -f monitoring/compose.yml --profile legacy-promtail up -d promtail
  promtail:
    profiles: [legacy-promtail]
    image: grafana/promtail:3.6.8
    container_name: promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./promtail.yml:/etc/promtail/config.yml:ro
      # Positions default to /tmp, which is empty again on every restart, so
      # promtail re-read every container log from the start and duplicated the
      # entire history into Loki each time it came back.
      - promtail_positions:/tmp
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Host-process logs (see the host-processes job in promtail.yml). Projects
      # that run from a terminal rather than a container write here, and the
      # filename becomes the Loki stream name.
      - ${HOME}/.local/state/devbox-logs:/host-logs:ro
    # Debian image with bash but no wget/curl, so the request goes over bash's
    # /dev/tcp. HTTP/1.0 makes promtail close the socket, so the read ends.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9080 && printf 'GET /ready HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256m
    networks: [devnet]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    # cAdvisor ran with NO command at all, which means every metric family on,
    # housekeeping every second, and every container label copied onto every
    # series. Nobody chose that; it is just the default, and it is the single
    # most expensive misconfiguration on this box. Measured: cAdvisor produces
    # 4147 series, of which about 407 are reachable from anything in this repo,
    # and the top five metrics by cardinality in the whole Prometheus head -
    # container_tasks_state (360), container_memory_failures_total (288),
    # container_blkio_device_usage_total (124), container_fs_writes_total (113),
    # container_fs_reads_total (113) - are all cAdvisor families that no
    # dashboard, alert rule or portal query reads. cadvisor is also the closest
    # container on this box to its own limit, 213.5 MiB of a 256 MiB cap.
    #
    # MEASURED AFTER, on the same box, so the claim above is not left as a
    # prediction: 4147 series -> 1036, and 213.5 MiB -> 25.8 MiB (83% of the cap
    # to 10%). The three biggest producers went to zero - container_tasks_state
    # 360, container_blkio_device_usage_total 124, container_fs_reads_total 113.
    # Everything queried survived intact, and the query SystemDialog.tsx actually
    # runs still returns its six series grouped by compose project.
    #
    # 1036 rather than the ~407 that is "reachable": container_memory_failures_total
    # keeps 84 series because it is gated by MemoryUsageMetrics, so dropping it
    # would take container_memory_working_set_bytes with it. That is the floor.
    #
    # THE LABEL WHITELIST IS LOAD-BEARING, and this is the line to be careful
    # with. `--store_container_labels=false` on its own drops
    # container_label_com_docker_compose_project, which SystemDialog.tsx selects
    # on for every per-system CPU and memory chart and which nothing else on
    # this box can produce, plus `_service` and `_project_working_dir`, which
    # dashboards/cadvisor.json renders as its Service and Working dir columns.
    # Both would go blank rather than error. A fourth compose label wanted by a
    # dashboard has to be added here in the same commit.
    #
    # --disable_metrics REPLACES cAdvisor's own default ignore list rather than
    # extending it - MetricSet.Set() clears the set before parsing the value -
    # so upstream's eleven defaults are repeated here verbatim and dropping one
    # of them would silently switch that family ON. The five on the end are the
    # families measured above: percpu, cpuLoad (container_tasks_state), disk and
    # diskIO (the fs_* and blkio_* series), and perf_event, which needs host
    # configuration this box does not have. What is kept is what is queried -
    # cpu, memory, network - plus oom_event, which is one series per container
    # and the only cheap answer to "why did that container disappear".
    # container_start_time_seconds is emitted unconditionally and belongs to no
    # family, so nothing here can take it away.
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service,com.docker.compose.project_working_dir
      - --disable_metrics=advtcp,cpuLoad,cpu_topology,cpuset,disk,diskIO,hugetlb,memory_numa,percpu,perf_event,process,referenced_memory,resctrl,sched,tcp,udp
    # No healthcheck here: the image already ships one (wget --spider on
    # $CADVISOR_HEALTHCHECK_URL) and the container reports healthy.
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8082:8080"
    deploy:
      resources:
        limits:
          # 7-day peak 54 MiB, p95 46 MiB since the 2026-08-19 flag trim below.
          memory: 128m
    networks: [devnet]

  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: node-exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      # The textfile collector, for metrics a HOST program writes: today
      # bothy_update_available{component,level} from apps/bothy-ops/
      # discover_updates.py (Settings > Updates). Added 2026-09-19; before that
      # node-exporter had no textfile directory at all.
      - --collector.textfile.directory=/textfile
    volumes:
      - /:/host:ro
      # A DEDICATED directory, read-only - not a path under /host, which would
      # tie the collector to one home directory and let any *.prom a process
      # drops anywhere be exported. never auto-created: `just up-monitoring` and
      # bootstrap create it 755 (node-exporter runs as nobody).
      - type: bind
        source: ${STATE_ROOT:-${HOME}/.local/state}/bothy/textfile
        target: /textfile
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "9100:9100"
    healthcheck:
      # The landing page, not /metrics: /metrics runs every collector.
      test: ["CMD", "wget", "-qO", "/dev/null", "-T", "3", "http://127.0.0.1:9100/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          # 7-day peak 24 MiB, p95 22 MiB.
          memory: 64m
    networks: [devnet]

volumes:
  victoriametrics_data:
  alloy_data:
  # Both kept for rollback (see the legacy services). promtail_positions is also
  # read once by alloy; prometheus_data is ~700 MB - delete it only once the
  # rollback window is over: `docker volume rm monitoring_prometheus_data`.
  promtail_positions:
  prometheus_data:
  grafana_data:
  loki_data:

networks:
  devnet:
    external: true
