apiVersion: 1

groups:
  - orgId: 1
    name: core-alerts
    folder: Alerts
    interval: 1m
    rules:
      - uid: instance_down
        title: Instance down
        condition: C
        for: 2m
        noDataState: OK
        execErrState: Alerting
        labels:
          severity: critical
        annotations:
          summary: "Target {{ $labels.job }} ({{ $labels.instance }}) is DOWN"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              # kube* jobs excluded: the cluster has its own group below
              # (cluster-alerts), so a stopped cluster pages ONCE, not per job.
              expr: up{job!~"kube.*"}
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - type: query
                  evaluator: { type: lt, params: [1] }
                  operator: { type: and }
                  query: { params: [] }
                  reducer: { type: last, params: [] }

      - uid: host_high_memory
        title: Host memory high
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Alerting
        labels:
          severity: warning
        annotations:
          summary: "Host memory usage above 90%"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - type: query
                  evaluator: { type: gt, params: [90] }
                  operator: { type: and }
                  query: { params: [] }
                  reducer: { type: last, params: [] }

      - uid: host_disk_full
        title: Host disk almost full
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Alerting
        labels:
          severity: warning
        annotations:
          summary: "A filesystem is above 85% full"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: max(100 - (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs"}) * 100)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - type: query
                  evaluator: { type: gt, params: [85] }
                  operator: { type: and }
                  query: { params: [] }
                  reducer: { type: last, params: [] }

  # The minikube cluster thales-scc (monitoring/scrape.d/kubernetes.yml).
  #
  # noDataState: OK on both, and that is a trade-off, not an oversight. With no
  # cluster on the box - or prometheus started without compose.cluster.yml - the
  # kube* series do not exist at all, and NoData=Alerting would page forever on
  # every box that never had a cluster. The cost: if prometheus is recreated
  # WITHOUT the override, these go silent instead of red. `just up-monitoring`
  # adds the override whenever the thales-scc network exists, which is why it,
  # not a bare `docker compose`, is the way to (re)start prometheus.
  - orgId: 1
    name: cluster-alerts
    folder: Alerts
    interval: 1m
    rules:
      # Node container stopped, kubelet dead, or KSM gone: any kube* target down.
      # minikube.service starts the cluster at boot, so down for 5m is a fault.
      - uid: kube_cluster_down
        title: Kubernetes cluster down
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Alerting
        labels:
          severity: critical
        annotations:
          summary: "thales-scc: scrape job {{ $labels.job }} is DOWN - cluster stopped? (systemctl status minikube; kubectl --context thales-scc get nodes)"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: max by (cluster, job) (up{cluster="thales-scc", job=~"kube.*"})
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - type: query
                  evaluator: { type: lt, params: [1] }
                  operator: { type: and }
                  query: { params: [] }
                  reducer: { type: last, params: [] }

      # The apiserver answers and KSM runs, but the kubelet reports NotReady
      # (disk/memory pressure, runtime down, network plugin broken).
      - uid: kube_node_not_ready
        title: Kubernetes node NotReady
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Alerting
        labels:
          severity: critical
        annotations:
          summary: "thales-scc: node {{ $labels.node }} is NotReady (kubectl --context thales-scc describe node {{ $labels.node }})"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: max by (cluster, node) (kube_node_status_condition{cluster="thales-scc", condition="Ready", status="true"})
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - type: query
                  evaluator: { type: lt, params: [1] }
                  operator: { type: and }
                  query: { params: [] }
                  reducer: { type: last, params: [] }

  # Settings > Updates (docs/plans/updates.md step 7). The host updater writes
  # these through node-exporter's textfile collector:
  #   bothy_update_last_result{component,result}   updater/record.py - 1 on the
  #                                                result of the component's LAST job
  #   bothy_update_paused{component}               updater/auto.py - 1 while the
  #                                                automatic channel is paused for it
  #   bothy_update_available{component,level}      discover_updates.py
  #
  # noDataState: OK throughout: a box that never ran an update has none of these
  # series, and that is not a fault. The cost is the usual one - if node-exporter
  # stops, these go silent - and `instance_down` above already pages for that.
  - orgId: 1
    name: update-alerts
    folder: Alerts
    interval: 1m
    rules:
      # Sticky on purpose: last_result stays rolled_back/failed until the NEXT job
      # of that component succeeds, so this keeps reminding (repeat_interval) until
      # a person has looked. `failed` means the rollback did not restore health.
      - uid: update_failed
        title: Update rolled back or failed
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Alerting
        labels:
          severity: critical
        annotations:
          summary: "Update of {{ $labels.component }} ended {{ $labels.result }} - see Settings > Updates (history) or `just update-status` on the host. An auto component stays paused until an operator clears it."
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: max by (component, result) (bothy_update_last_result{result=~"rolled_back|failed"})
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - type: query
                  evaluator: { type: gt, params: [0] }
                  operator: { type: and }
                  query: { params: [] }
                  reducer: { type: last, params: [] }

      # The night job will not touch this component again until an operator
      # clears it: Settings > Updates > Unpause, or `just update-unpause <id>`.
      - uid: update_auto_paused
        title: Automatic updates paused
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Alerting
        labels:
          severity: warning
        annotations:
          summary: "Automatic updates are paused for {{ $labels.component }} after a rollback or a failure - find out why, then Unpause in Settings > Updates (or `just update-unpause {{ $labels.component }}` on the host)"
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: max by (component) (bothy_update_paused)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - type: query
                  evaluator: { type: gt, params: [0] }
                  operator: { type: and }
                  query: { params: [] }
                  reducer: { type: last, params: [] }

      # A NOTICE, not a fault: a patch or minor has been on offer for over two
      # weeks - on offer now, and also 13-14 days ago. VictoriaMetrics keeps 15
      # days, so the window fits inside retention. Majors are left out: they are
      # manual procedures that may wait on purpose. severity=info is routed to one
      # email a day (policies.yml).
      - uid: update_stale
        title: Update waiting for over 14 days
        condition: C
        for: 1h
        noDataState: OK
        execErrState: OK
        labels:
          severity: info
        annotations:
          summary: "{{ $labels.component }} has had a newer patch or minor on offer for over 14 days - merge its Dependabot PR, pull, and deploy it from Settings > Updates"
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: max by (component) (bothy_update_available{level=~"patch|minor"}) and on (component) max by (component) (max_over_time(bothy_update_available{level=~"patch|minor"}[1d] offset 13d))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - type: query
                  evaluator: { type: gt, params: [0] }
                  operator: { type: and }
                  query: { params: [] }
                  reducer: { type: last, params: [] }
