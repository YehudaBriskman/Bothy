server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Discover every running container via the Docker socket and ship its logs.
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: stream
      - source_labels: ["__meta_docker_container_label_com_docker_compose_project"]
        target_label: stack

  # Host processes — the half of the box docker_sd cannot see.
  #
  # A project run from a terminal (`just dev`, `tilt up`) has no container, so
  # its output lived only in whatever terminal happened to be open and was gone
  # once that scrolled. Anything writing to ~/.local/state/devbox-logs now lands
  # in Loki beside the container logs: one query path for the portal, and
  # Grafana / `/f-observe` get host logs for free.
  #
  # Convention over config: the FILENAME is the stream name, so a new project
  # needs no change here — it just writes a file into the directory.
  - job_name: host-processes
    static_configs:
      - targets: [localhost]
        labels:
          job: host-processes
          __path__: /host-logs/*.log
    pipeline_stages:
      - regex:
          source: filename
          expression: '/host-logs/(?P<host_service>[^/]+)\.log$'
      - labels:
          host_service:
