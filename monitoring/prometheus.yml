# Scraped by VictoriaMetrics (-promscrape.config, monitoring/compose.yml) since
# 2026-09-17; the file keeps its name because the format is still Prometheus'.
#
# VM PARSES THIS STRICTLY: an unknown field is a fatal startup error, not a
# warning. That is why `evaluation_interval` is gone - it configured Prometheus'
# rule evaluation, VM has none (rules/ was empty; alerting is Grafana's), and VM
# refuses the key. Check an edit before recreating the container:
#   docker run --rm -v "$PWD/monitoring:/etc/prometheus:ro" \
#     victoriametrics/victoria-metrics:v1.152.0 \
#     -promscrape.config=/etc/prometheus/prometheus.yml -promscrape.config.dryRun
global:
  scrape_interval: 15s

# Optional scrape jobs that depend on something outside this compose project.
# Today: the minikube cluster thales-scc (scrape.d/kubernetes.yml). The
# directory is mounted only by compose.cluster.yml, so without the cluster the
# glob matches nothing and VictoriaMetrics starts exactly as before. Relative to
# this file's directory.
#
# FORMAT DIFFERS FROM PROMETHEUS: VM wants each included file to be a bare LIST
# of scrape configs, where Prometheus wanted a `scrape_configs:` map. The file in
# scrape.d/ is in VM's form; the dry-run above catches the other.
scrape_config_files:
  - scrape.d/*.yml

scrape_configs:
  - job_name: victoriametrics
    # Self-scrape needs the same basic auth VM enforces (-httpAuth.*). Both files
    # are gitignored, generated by bootstrap and mounted; see compose.yml.
    # (Was `prometheus` / localhost:9090 until 2026-09-17. The legacy-prometheus
    # rollback profile reads this same file, so that one target is DOWN there.)
    #
    # username_file, NOT a literal. This line read `username:
    # <the maintainer's email>` - a committed config naming one person's
    # account - and prometheus-web.yml's users map was generated from
    # $DEV_LOGIN_USER, which on any box but that one is somebody else. The two
    # disagreed, so the self-scrape got a 401 on every fresh install and
    # Prometheus reported it as a target that was simply DOWN. Reading the name
    # from the same .env the users map is built from is what makes them agree
    # by construction rather than by coincidence.
    basic_auth:
      username_file: /etc/prometheus/prom-username.txt
      password_file: /etc/prometheus/prom-password.txt
    static_configs:
      - targets: ["localhost:8428"]

  # The edge itself - request/latency/error metrics per router + service. Metrics
  # ride an internal traefik entrypoint (:8899, no host port); we reach it by name
  # over devnet. See edge/compose.yml.
  - job_name: traefik
    static_configs:
      - targets: ["traefik:8899"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  # Data-stack exporters (down until those stacks are up - that's fine).
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # redis and kafka scrape jobs REMOVED 2026-08-12, with their services.
  #
  # Both were retired as idle (redis: 0 keys, kafka: 0 topics). A scrape job for
  # a service that no longer runs is not harmless: its target sits permanently
  # DOWN, so "are all targets up?" stops being a question worth asking and the
  # one alert that matters gets lost among two that never resolve.
  #
  # Restore alongside the service:
  #   - job_name: redis   ->  redis-exporter:9121
  #   - job_name: kafka   ->  kafka-exporter:9308

  # docker-daemon scrape job REMOVED 2026-08-19.
  #
  # It scraped the daemon's own `metrics-addr` endpoint on :9323 and NOTHING
  # read the result: no panel in monitoring/dashboards/, no expression in
  # rules/, no query in the portal - not one `engine_daemon_*` series is named
  # anywhere in this repo. It was also the only job in this file with no comment
  # saying what it was for, which is usually the tell.
  #
  # The argument is the one written directly above about redis and kafka, and it
  # applies harder here: `metrics-addr` is opt-in, bootstrap.sh deliberately did
  # not set it, so on any install that had not been hand-edited this target sat
  # permanently DOWN. A target that is always down stops "are all targets up?"
  # being a question worth asking, and it was one of the four faults that made
  # `just doctor strict` unusable on a fresh box (#105).
  #
  # Restore alongside the setting:
  #   - job_name: docker-daemon  ->  host.docker.internal:9323
  # and add `"metrics-addr": "0.0.0.0:9323"` to /etc/docker/daemon.json -
  # host/docker/daemon.json still carries the line, and is still worth copying
  # for the log rotation that sits beside it. Prometheus also needs its
  # `extra_hosts: host.docker.internal:host-gateway` back in compose.yml, which
  # came out with this job because nothing else in this file uses that name.
