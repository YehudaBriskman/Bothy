global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # The edge itself — request/latency/error metrics per router + service. Metrics
  # ride an internal traefik entrypoint (:8899, no host port); we reach it by name
  # over devnet. See edge/compose.yml.
  - job_name: traefik
    static_configs:
      - targets: ["traefik:8899"]

  - job_name: docker-daemon
    static_configs:
      - targets: ["host.docker.internal:9323"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  # Data-stack exporters (down until those stacks are up — that's fine).
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]
